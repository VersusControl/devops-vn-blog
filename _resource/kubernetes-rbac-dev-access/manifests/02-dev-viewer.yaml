# Who: a ServiceAccount the developers will use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-viewer
  namespace: dev
---
# What: read Pods and their logs. Nothing else, and only in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dev
rules:
- apiGroups: [""]               # "" is the core API group, where Pods live
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
# Glue: give pod-reader to dev-viewer, inside dev only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-viewer-pod-reader
  namespace: dev
subjects:
- kind: ServiceAccount
  name: dev-viewer
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
