# Chapter 3's Gateway for the Helm-installed ingress gateway in namespace istio-ingress.
# Only the selector changes: the gateway chart labels its Pods istio=ingress.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: bookstore-gateway
  namespace: bookstore
spec:
  # Which gateway Pods get this configuration: matched by Pod label, in any namespace.
  selector:
    istio: ingress           # the label the Helm gateway chart sets (chapter 3 used ingressgateway)
  servers:
    - port:
        number: 80          # the gateway Service's port 80 (node port 30080, localhost:8080)
        name: http
        protocol: HTTP
      hosts:
        - bookstore.local   # the Host header the gateway accepts on this port
