# A ratings build with a bug: half of its answers are HTTP 503.
# Same image as ratings-v1; SERVICE_VERSION=v-faulty switches the bug on.
# Its /health endpoint still says healthy, so Kubernetes keeps it in the Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratings-v-faulty
  namespace: bookstore
  labels:
    app: ratings
    version: v-faulty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratings
      version: v-faulty
  template:
    metadata:
      labels:
        app: ratings
        version: v-faulty
    spec:
      serviceAccountName: bookstore-ratings
      containers:
        - name: ratings
          image: registry.istio.io/release/examples-bookinfo-ratings-v1:1.20.3
          env:
            - name: SERVICE_VERSION
              value: v-faulty
          ports:
            - containerPort: 9080
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
