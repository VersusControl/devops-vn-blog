# Part of the Book Store app for the Kubernetes Advanced: Service Mesh series.
# Images are Istio's Bookinfo sample images; the manifests are our own.
# productpage: the web page and JSON API. Calls details and reviews.
apiVersion: v1
kind: Service
metadata:
  name: productpage
  namespace: bookstore
  labels:
    app: productpage
spec:
  selector:
    app: productpage
  ports:
    # Istio reads the protocol from the port name (http, grpc, tcp, ...).
    - name: http
      port: 9080
      targetPort: 9080
---
# One service account per service. From chapter 11 it becomes the workload identity
# that mTLS and authorization policies use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstore-productpage
  namespace: bookstore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage-v1
  namespace: bookstore
  labels:
    app: productpage
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productpage
      version: v1
  template:
    metadata:
      labels:
        # app selects the Service; version lets Istio tell versions apart (chapter 6).
        app: productpage
        version: v1
    spec:
      serviceAccountName: bookstore-productpage
      containers:
        - name: productpage
          image: registry.istio.io/release/examples-bookinfo-productpage-v1:1.20.3
          ports:
            - containerPort: 9080
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
