# Part of the Book Store app for the Kubernetes Advanced: Service Mesh series.
# Images are Istio's Bookinfo sample images; the manifests are our own.
# reviews: three versions behind one Service.
#   v1: no stars, does not call ratings
#   v2: black stars, calls ratings
#   v3: red stars, calls ratings
apiVersion: v1
kind: Service
metadata:
  name: reviews
  namespace: bookstore
  labels:
    app: reviews
spec:
  selector:
    app: reviews
  ports:
    # Istio reads the protocol from the port name (http, grpc, tcp, ...).
    - name: http
      port: 9080
      targetPort: 9080
---
# One service account per service. From chapter 11 it becomes the workload identity
# that mTLS and authorization policies use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookstore-reviews
  namespace: bookstore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-v1
  namespace: bookstore
  labels:
    app: reviews
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews
      version: v1
  template:
    metadata:
      labels:
        # app selects the Service; version lets Istio tell versions apart (chapter 6).
        app: reviews
        version: v1
    spec:
      serviceAccountName: bookstore-reviews
      containers:
        - name: reviews
          image: registry.istio.io/release/examples-bookinfo-reviews-v1:1.20.3
          ports:
            - containerPort: 9080
          env:
            - name: LOG_DIR
              value: "/tmp/logs"
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
