# httpbin inside the mesh: it echoes the request headers it receives, including the
# X-Forwarded-Client-Cert header that its sidecar adds after an mTLS handshake.
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: bookstore
  labels:
    app: httpbin
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: bookstore
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: bookstore
  labels:
    app: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: docker.io/mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
