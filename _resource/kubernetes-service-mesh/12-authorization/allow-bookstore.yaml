# Allow exactly the calls Book Store makes, by caller identity (mTLS, chapter 11).
#   ingress gateway -> productpage
#   productpage     -> details, reviews
#   reviews         -> ratings
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: productpage
  namespace: bookstore
spec:
  selector:
    matchLabels:
      app: productpage
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: details
  namespace: bookstore
spec:
  selector:
    matchLabels:
      app: details
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/bookstore/sa/bookstore-productpage
      to:
        - operation:
            methods: ["GET"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: reviews
  namespace: bookstore
spec:
  selector:
    matchLabels:
      app: reviews
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/bookstore/sa/bookstore-productpage
      to:
        - operation:
            methods: ["GET"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ratings
  namespace: bookstore
spec:
  selector:
    matchLabels:
      app: ratings
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/bookstore/sa/bookstore-reviews
      to:
        - operation:
            methods: ["GET"]
