# The Gateway API has no subsets. Each version gets its own Service instead,
# selecting Pods by app AND version. The original "reviews" Service stays as it is.
apiVersion: v1
kind: Service
metadata:
  name: reviews-v1
  namespace: bookstore
spec:
  selector:
    app: reviews
    version: v1
  ports:
    - name: http
      port: 9080
      targetPort: 9080
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-v3
  namespace: bookstore
spec:
  selector:
    app: reviews
    version: v3
  ports:
    - name: http
      port: 9080
      targetPort: 9080
