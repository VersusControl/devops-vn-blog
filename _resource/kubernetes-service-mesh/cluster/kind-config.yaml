# Kind cluster for the "Kubernetes Advanced: Service Mesh" series.
# One control-plane node and two workers, so the cluster has more than one node to schedule on.
#
#   kind create cluster --config cluster/kind-config.yaml
#
# The port mappings publish NodePorts on 127.0.0.1 only. Istio gateways use these
# NodePorts from chapter 2 on, so http://localhost:8080 reaches the cluster without
# a LoadBalancer, sudo, or port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mesh
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraPortMappings:
      # Istio ingress gateway: HTTP and HTTPS (chapters 2-13)
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
      - containerPort: 30443
        hostPort: 8443
        listenAddress: "127.0.0.1"
      # Gateway API gateway (chapter 14)
      - containerPort: 30090
        hostPort: 9080
        listenAddress: "127.0.0.1"
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
