# Step 4: v3 takes all traffic. v1 still runs, ready for a rollback.
# A mesh-internal VirtualService: no "gateways" field, so it applies to calls made by
# sidecars inside the mesh (here, productpage calling reviews).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: bookstore
spec:
  hosts:
    - reviews
  http:
    - route:
        - destination:
            host: reviews
            subset: v3
