<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A local client port-forwards to a ClusterIP Service, which resolves ready EndpointSlice addresses and sends traffic to Task API Pods on port 3000">
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.d{font:16px Menlo,monospace;fill:#466176}.t{font-size:21px;font-weight:700}.z{font-size:14px;font-weight:700;letter-spacing:2px;fill:#527089}</style></defs>
  <rect width="1200" height="630" fill="#fff"/><rect x="35" y="42" width="210" height="520" rx="16" fill="#f5f8fa"/><rect x="270" y="42" width="400" height="520" rx="16" fill="#edf4f7"/><rect x="695" y="42" width="470" height="520" rx="16" fill="#f5f8fa"/><text x="60" y="78" class="z">LAPTOP</text><text x="295" y="78" class="z">NAMESPACE tasks</text><text x="720" y="78" class="z">READY BACKENDS</text>
  <rect x="70" y="245" width="140" height="110" rx="12" fill="#fff" stroke="#172033" stroke-width="2"/><text x="140" y="290" text-anchor="middle" class="t">curl</text><text x="140" y="320" text-anchor="middle" class="d">localhost</text><text x="270" y="215" text-anchor="middle" class="d">port-forward</text><path d="M210 300H306" stroke="#172033" stroke-width="3"/><path d="M306 292L320 300L306 308Z" fill="#172033"/>
  <rect x="330" y="225" width="270" height="150" rx="12" fill="#d8edf3" stroke="#277da1" stroke-width="3"/><text x="465" y="270" text-anchor="middle" class="t">Service task-api</text><text x="465" y="302" text-anchor="middle" class="d">ClusterIP   port: 80</text><text x="465" y="332" text-anchor="middle" class="d">selector: app=task-api</text><path d="M600 300H716" stroke="#172033" stroke-width="3"/><path d="M716 292L730 300L716 308Z" fill="#172033"/><rect x="740" y="220" width="180" height="160" rx="12" fill="#fff" stroke="#172033" stroke-width="2"/><text x="830" y="260" text-anchor="middle" class="t">EndpointSlice</text><text x="830" y="292" text-anchor="middle" class="d">ready addresses</text><text x="830" y="330" text-anchor="middle" class="d">targetPort: 3000</text><path d="M920 300H975V185H986" fill="none" stroke="#172033" stroke-width="3"/><path d="M986 177L1000 185L986 193Z" fill="#172033"/><path d="M920 300H975V415H986" fill="none" stroke="#172033" stroke-width="3"/><path d="M986 407L1000 415L986 423Z" fill="#172033"/><rect x="1010" y="125" width="115" height="120" rx="10" fill="#d8edf3" stroke="#277da1" stroke-width="2"/><rect x="1010" y="355" width="115" height="120" rx="10" fill="#d8edf3" stroke="#277da1" stroke-width="2"/><text x="1067" y="175" text-anchor="middle" class="t">Pod</text><text x="1067" y="205" text-anchor="middle" class="d">:3000</text><text x="1067" y="405" text-anchor="middle" class="t">Pod</text><text x="1067" y="435" text-anchor="middle" class="d">:3000</text><text x="295" y="515" class="d">temporary API-server connection; no external Service exposure</text>
</svg>