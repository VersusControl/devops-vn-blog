<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="The tasks Namespace scopes a naked pod which is scheduled to a node, runs its container, and is not recreated after deletion">
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.d{font:18px Menlo,monospace;fill:#466176}.t{font-size:23px;font-weight:700}.z{font-size:14px;font-weight:700;letter-spacing:2px;fill:#527089}</style></defs>
  <rect width="1200" height="630" fill="#fff"/><rect x="35" y="40" width="730" height="530" rx="18" fill="#edf4f7"/><text x="65" y="78" class="z">CLUSTER / NAMESPACE tasks</text><rect x="78" y="120" width="640" height="260" rx="14" fill="#fff" stroke="#277da1" stroke-width="3"/><text x="110" y="162" class="t">Pod  pod-inspector</text><text x="110" y="193" class="d">label: app=pod-inspector</text><rect x="115" y="230" width="565" height="105" rx="10" fill="#d8edf3" stroke="#277da1" stroke-width="2"/><text x="145" y="274" class="t">container  web</text><text x="145" y="305" class="d">nginx:1.27-alpine    containerPort: 80</text><path d="M395 386V421" stroke="#172033" stroke-width="3"/><path d="M387 421L395 435L403 421Z" fill="#172033"/><rect x="245" y="445" width="300" height="75" rx="10" fill="#fff" stroke="#172033" stroke-width="2"/><text x="395" y="490" text-anchor="middle" class="t">scheduled to one node</text>
  <rect x="800" y="40" width="365" height="530" rx="18" fill="#f5f8fa"/><text x="830" y="78" class="z">POD LIFECYCLE</text><circle cx="875" cy="165" r="35" fill="#d8edf3" stroke="#277da1" stroke-width="3"/><text x="925" y="172" class="t">Pending</text><path d="M875 205V246" stroke="#172033" stroke-width="3"/><path d="M867 246L875 260L883 246Z" fill="#172033"/><circle cx="875" cy="305" r="35" fill="#d8edf3" stroke="#277da1" stroke-width="3"/><text x="925" y="312" class="t">Running</text><path d="M875 345V386" stroke="#172033" stroke-width="3"/><path d="M867 386L875 400L883 386Z" fill="#172033"/><circle cx="875" cy="445" r="35" fill="#fff" stroke="#9c3f3f" stroke-width="3"/><text x="925" y="452" class="t">Deleted</text><text x="830" y="525" class="d">no controller</text><text x="830" y="550" class="d">no replacement Pod</text>
