<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="30" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Docker Compose Architecture</text>
  
  <!-- docker-compose.yml -->
  <g transform="translate(50,60)">
    <rect x="0" y="0" width="180" height="200" rx="6" fill="#1e293b" stroke="#2496ED" stroke-width="2"/>
    <text x="90" y="25" fill="#2496ED" font-size="12" text-anchor="middle" font-weight="500">docker-compose.yml</text>
    
    <text x="15" y="55" fill="#6b7280" font-size="10" font-family="monospace">services:</text>
    <text x="25" y="75" fill="#4ade80" font-size="10" font-family="monospace">api:</text>
    <text x="35" y="90" fill="#9aa4b2" font-size="9" font-family="monospace">build: ./api</text>
    <text x="35" y="105" fill="#9aa4b2" font-size="9" font-family="monospace">ports: 3000:3000</text>
    <text x="25" y="125" fill="#16a34a" font-size="10" font-family="monospace">db:</text>
    <text x="35" y="140" fill="#9aa4b2" font-size="9" font-family="monospace">image: postgres</text>
    <text x="25" y="160" fill="#ef4444" font-size="10" font-family="monospace">redis:</text>
    <text x="35" y="175" fill="#9aa4b2" font-size="9" font-family="monospace">image: redis</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(240,150)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#2496ED" stroke-width="2"/>
    <polygon points="60,0 52,-5 52,5" fill="#2496ED"/>
    <text x="30" y="-10" fill="#6b7280" font-size="10" text-anchor="middle">compose up</text>
  </g>
  
  <!-- Created resources -->
  <g transform="translate(320,50)">
    <!-- Network -->
    <rect x="0" y="0" width="430" height="280" rx="8" fill="#2496ED" fill-opacity="0.1" stroke="#2496ED" stroke-width="2"/>
    <text x="20" y="25" fill="#2496ED" font-size="11" font-weight="500">project_default (network)</text>
    
    <!-- API Container -->
    <g transform="translate(30,50)">
      <rect x="0" y="0" width="110" height="70" rx="5" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
      <text x="55" y="25" fill="#4ade80" font-size="11" text-anchor="middle" font-weight="500">api</text>
      <text x="55" y="45" fill="#6b7280" font-size="9" text-anchor="middle">:3000</text>
      <text x="55" y="60" fill="#6b7280" font-size="8" text-anchor="middle">project-api-1</text>
    </g>
    
    <!-- DB Container -->
    <g transform="translate(160,50)">
      <rect x="0" y="0" width="110" height="70" rx="5" fill="#1e293b" stroke="#16a34a" stroke-width="2"/>
      <text x="55" y="25" fill="#16a34a" font-size="11" text-anchor="middle" font-weight="500">db</text>
      <text x="55" y="45" fill="#6b7280" font-size="9" text-anchor="middle">:5432</text>
      <text x="55" y="60" fill="#6b7280" font-size="8" text-anchor="middle">project-db-1</text>
    </g>
    
    <!-- Redis Container -->
    <g transform="translate(290,50)">
      <rect x="0" y="0" width="110" height="70" rx="5" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <text x="55" y="25" fill="#ef4444" font-size="11" text-anchor="middle" font-weight="500">redis</text>
      <text x="55" y="45" fill="#6b7280" font-size="9" text-anchor="middle">:6379</text>
      <text x="55" y="60" fill="#6b7280" font-size="8" text-anchor="middle">project-redis-1</text>
    </g>
    
    <!-- Connections -->
    <line x1="140" y1="85" x2="160" y2="85" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="270" y1="85" x2="290" y2="85" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,2"/>
    
    <!-- Volume -->
    <g transform="translate(160,150)">
      <ellipse cx="55" cy="25" rx="50" ry="20" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="2"/>
      <text x="55" y="30" fill="#a78bfa" font-size="10" text-anchor="middle">pgdata</text>
      <line x1="55" y1="5" x2="215" y2="-45" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,2"/>
    </g>
    
    <!-- Labels -->
    <text x="215" y="250" fill="#6b7280" font-size="10" text-anchor="middle">All created with one command</text>
  </g>
  
  <text x="400" y="370" fill="#6b7280" font-size="11" text-anchor="middle">docker compose up → network + containers + volumes</text>
  <text x="400" y="390" fill="#6b7280" font-size="11" text-anchor="middle">docker compose down → removes everything</text>
</svg>