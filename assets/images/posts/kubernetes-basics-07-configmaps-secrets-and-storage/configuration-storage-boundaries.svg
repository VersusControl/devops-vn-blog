<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ConfigMap and Secret inject separate environment values into a Task API Pod while a persistent volume claim mounts task data outside the container filesystem">
  <defs><style>text{font-family:Arial,sans-serif;fill:#172033}.d{font:16px Menlo,monospace;fill:#466176}.t{font-size:21px;font-weight:700}.z{font-size:14px;font-weight:700;letter-spacing:2px;fill:#527089}</style></defs>
  <rect width="1200" height="630" fill="#fff"/><rect x="35" y="42" width="330" height="520" rx="16" fill="#edf4f7"/><rect x="395" y="42" width="405" height="520" rx="16" fill="#f5f8fa"/><rect x="830" y="42" width="335" height="520" rx="16" fill="#edf4f7"/><text x="60" y="78" class="z">SEPARATE INPUTS</text><text x="420" y="78" class="z">POD BOUNDARY</text><text x="855" y="78" class="z">DURABLE STORAGE</text>
  <rect x="75" y="140" width="250" height="125" rx="12" fill="#fff" stroke="#172033" stroke-width="2"/><text x="200" y="185" text-anchor="middle" class="t">ConfigMap</text><text x="200" y="215" text-anchor="middle" class="d">APP_MESSAGE</text><text x="200" y="240" text-anchor="middle" class="d">PORT=3000</text><rect x="75" y="350" width="250" height="125" rx="12" fill="#fff" stroke="#172033" stroke-width="2"/><text x="200" y="395" text-anchor="middle" class="t">Secret</text><text x="200" y="425" text-anchor="middle" class="d">API_TOKEN</text><text x="200" y="450" text-anchor="middle" class="d">access controlled</text>
  <path d="M325 202H426" fill="none" stroke="#172033" stroke-width="3"/><path d="M426 194L440 202L426 210Z" fill="#172033"/><path d="M325 412H410V330H426" fill="none" stroke="#172033" stroke-width="3"/><path d="M426 322L440 330L426 338Z" fill="#172033"/><rect x="450" y="150" width="300" height="250" rx="14" fill="#d8edf3" stroke="#277da1" stroke-width="3"/><text x="600" y="198" text-anchor="middle" class="t">Task API container</text><text x="480" y="250" class="d">envFrom: ConfigMap</text><text x="480" y="285" class="d">API_TOKEN: Secret key</text><text x="480" y="320" class="d">TASK_STORE_PATH:</text><text x="600" y="345" text-anchor="middle" font-family="Menlo, monospace" font-size="14" fill="#466176">/var/lib/task-api/tasks.json</text><path d="M600 400V406" stroke="#172033" stroke-width="3"/><path d="M592 406L600 420L608 406Z" fill="#172033"/><rect x="475" y="430" width="250" height="55" rx="10" fill="#fff" stroke="#172033" stroke-width="2"/><text x="600" y="465" text-anchor="middle" class="d">volume mount</text><path d="M725 457H861" stroke="#172033" stroke-width="3"/><path d="M861 449L875 457L861 465Z" fill="#172033"/><rect x="885" y="385" width="235" height="145" rx="12" fill="#fff" stroke="#172033" stroke-width="2"/><text x="1002" y="430" text-anchor="middle" class="t">PVC task-api-data</text><text x="1002" y="462" text-anchor="middle" class="d">ReadWriteOnce</text><text x="1002" y="489" text-anchor="middle" class="d">request: 1Gi</text>
</svg>