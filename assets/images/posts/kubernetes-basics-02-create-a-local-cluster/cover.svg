<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Kubernetes Basics Chapter 2 cover showing a local Kind control plane and worker node.">
  <defs><style>.k{font:700 22px Arial;letter-spacing:4px;fill:#2496ed}.t{font:800 72px Arial;fill:#f7f9fb}.s{font:28px Arial;fill:#aebdcd}.n{font:700 21px Arial;fill:#dce8f5}.d{font:17px Menlo,monospace;fill:#aebdcd}.light{fill:#f7f9fb}.dark{fill:#12202f}</style></defs>
  <rect width="1600" height="900" fill="#0d1117"/><path d="M860 0V900" stroke="#263545" stroke-width="2"/>
  <text x="100" y="120" class="k">KUBERNETES BASICS</text><text x="100" y="156" class="k">CHAPTER 02</text><text x="100" y="380" class="t">Local Cluster</text><text x="100" y="468" class="t">with Kind</text><text x="100" y="570" class="s">Kubernetes nodes in Docker.</text>
  <g transform="translate(980 190)"><rect width="500" height="500" rx="24" fill="#12202f" stroke="#2496ed" stroke-width="3"/><text x="42" y="58" class="k" font-size="16">DOCKER HOST</text><rect x="45" y="100" width="180" height="280" rx="18" fill="#1b3044" stroke="#4a6b88" stroke-width="2"/><text x="135" y="145" text-anchor="middle" class="n">control plane</text><rect x="75" y="190" width="120" height="60" rx="10" fill="#2496ed"/><text x="135" y="227" text-anchor="middle" class="d light">API server</text><rect x="275" y="100" width="180" height="280" rx="18" fill="#1b3044" stroke="#4a6b88" stroke-width="2"/><text x="365" y="145" text-anchor="middle" class="n">worker node</text><rect x="305" y="190" width="120" height="60" rx="10" fill="#dce8f5"/><text x="365" y="227" text-anchor="middle" class="d dark">Pods</text><text x="135" y="430" text-anchor="middle" class="d">kind-control-plane</text><text x="365" y="430" text-anchor="middle" class="d">kind-worker</text></g>
</svg>
