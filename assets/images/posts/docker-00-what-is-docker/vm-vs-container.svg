<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  
  <!-- VM Side -->
  <text x="150" y="40" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Virtual Machine</text>
  
  <g transform="translate(50,60)">
    <!-- Apps -->
    <rect x="0" y="0" width="60" height="40" rx="4" fill="#f97316" opacity="0.8"/>
    <text x="30" y="25" fill="white" font-size="11" text-anchor="middle">App 1</text>
    <rect x="70" y="0" width="60" height="40" rx="4" fill="#f97316" opacity="0.8"/>
    <text x="100" y="25" fill="white" font-size="11" text-anchor="middle">App 2</text>
    <rect x="140" y="0" width="60" height="40" rx="4" fill="#f97316" opacity="0.8"/>
    <text x="170" y="25" fill="white" font-size="11" text-anchor="middle">App 3</text>
    
    <!-- Bins/Libs -->
    <rect x="0" y="50" width="200" height="30" rx="4" fill="#64748b"/>
    <text x="100" y="70" fill="white" font-size="11" text-anchor="middle">Bins/Libs</text>
    
    <!-- Guest OS -->
    <rect x="0" y="90" width="200" height="40" rx="4" fill="#7c3aed"/>
    <text x="100" y="115" fill="white" font-size="12" text-anchor="middle">Guest OS</text>
    
    <!-- Hypervisor -->
    <rect x="0" y="140" width="200" height="35" rx="4" fill="#0ea5e9"/>
    <text x="100" y="162" fill="white" font-size="12" text-anchor="middle">Hypervisor</text>
    
    <!-- Host OS -->
    <rect x="0" y="185" width="200" height="40" rx="4" fill="#16a34a"/>
    <text x="100" y="210" fill="white" font-size="12" text-anchor="middle">Host OS</text>
    
    <!-- Hardware -->
    <rect x="0" y="235" width="200" height="40" rx="4" fill="#475569"/>
    <text x="100" y="260" fill="white" font-size="12" text-anchor="middle">Hardware</text>
  </g>
  
  <!-- Container Side -->
  <text x="650" y="40" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Containers</text>
  
  <g transform="translate(550,60)">
    <!-- Container boxes -->
    <g>
      <rect x="0" y="0" width="60" height="80" rx="4" fill="none" stroke="#2496ED" stroke-width="2"/>
      <rect x="5" y="5" width="50" height="30" rx="3" fill="#f97316" opacity="0.8"/>
      <text x="30" y="25" fill="white" font-size="10" text-anchor="middle">App 1</text>
      <rect x="5" y="40" width="50" height="35" rx="3" fill="#64748b"/>
      <text x="30" y="62" fill="white" font-size="9" text-anchor="middle">Bins/Libs</text>
    </g>
    <g transform="translate(70,0)">
      <rect x="0" y="0" width="60" height="80" rx="4" fill="none" stroke="#2496ED" stroke-width="2"/>
      <rect x="5" y="5" width="50" height="30" rx="3" fill="#f97316" opacity="0.8"/>
      <text x="30" y="25" fill="white" font-size="10" text-anchor="middle">App 2</text>
      <rect x="5" y="40" width="50" height="35" rx="3" fill="#64748b"/>
      <text x="30" y="62" fill="white" font-size="9" text-anchor="middle">Bins/Libs</text>
    </g>
    <g transform="translate(140,0)">
      <rect x="0" y="0" width="60" height="80" rx="4" fill="none" stroke="#2496ED" stroke-width="2"/>
      <rect x="5" y="5" width="50" height="30" rx="3" fill="#f97316" opacity="0.8"/>
      <text x="30" y="25" fill="white" font-size="10" text-anchor="middle">App 3</text>
      <rect x="5" y="40" width="50" height="35" rx="3" fill="#64748b"/>
      <text x="30" y="62" fill="white" font-size="9" text-anchor="middle">Bins/Libs</text>
    </g>
    
    <!-- Docker Engine -->
    <rect x="0" y="90" width="200" height="40" rx="4" fill="#2496ED"/>
    <text x="100" y="115" fill="white" font-size="12" text-anchor="middle">Docker Engine</text>
    
    <!-- Host OS -->
    <rect x="0" y="140" width="200" height="40" rx="4" fill="#16a34a"/>
    <text x="100" y="165" fill="white" font-size="12" text-anchor="middle">Host OS</text>
    
    <!-- Hardware -->
    <rect x="0" y="190" width="200" height="40" rx="4" fill="#475569"/>
    <text x="100" y="215" fill="white" font-size="12" text-anchor="middle">Hardware</text>
  </g>
  
  <!-- Comparison arrows/info -->
  <text x="400" y="360" fill="#6b7280" font-size="13" text-anchor="middle">VMs virtualize hardware → heavy</text>
  <text x="400" y="380" fill="#6b7280" font-size="13" text-anchor="middle">Containers virtualize OS → lightweight</text>
</svg>