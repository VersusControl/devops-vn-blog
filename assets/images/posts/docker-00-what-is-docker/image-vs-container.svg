<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="350" fill="#0d1117"/>
  
  <!-- Image box -->
  <g transform="translate(100,80)">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="none" stroke="#2496ED" stroke-width="2"/>
    <text x="100" y="-15" fill="#2496ED" font-size="14" font-weight="600" text-anchor="middle">IMAGE</text>
    <text x="100" y="18" fill="#6b7280" font-size="11" text-anchor="middle">(read-only template)</text>
    
    <!-- Layers -->
    <rect x="15" y="30" width="170" height="30" rx="4" fill="#475569"/>
    <text x="100" y="50" fill="white" font-size="11" text-anchor="middle">Your App Code</text>
    
    <rect x="15" y="65" width="170" height="30" rx="4" fill="#64748b"/>
    <text x="100" y="85" fill="white" font-size="11" text-anchor="middle">Dependencies</text>
    
    <rect x="15" y="100" width="170" height="30" rx="4" fill="#7c3aed"/>
    <text x="100" y="120" fill="white" font-size="11" text-anchor="middle">Runtime (Node/Python)</text>
    
    <rect x="15" y="135" width="170" height="30" rx="4" fill="#16a34a"/>
    <text x="100" y="155" fill="white" font-size="11" text-anchor="middle">Base OS (Alpine)</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(320,170)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#2496ED" stroke-width="2"/>
    <polygon points="80,0 70,-6 70,6" fill="#2496ED"/>
    <text x="40" y="-10" fill="#6b7280" font-size="11" text-anchor="middle">docker run</text>
  </g>
  
  <!-- Container box -->
  <g transform="translate(420,60)">
    <rect x="0" y="0" width="260" height="220" rx="8" fill="none" stroke="#f97316" stroke-width="2"/>
    <text x="130" y="-15" fill="#f97316" font-size="14" font-weight="600" text-anchor="middle">CONTAINER</text>
    <text x="130" y="18" fill="#6b7280" font-size="11" text-anchor="middle">(running instance)</text>
    
    <!-- Writable layer -->
    <rect x="15" y="30" width="230" height="35" rx="4" fill="#f97316" opacity="0.8"/>
    <text x="130" y="52" fill="white" font-size="11" text-anchor="middle">Writable Layer (runtime data)</text>
    
    <!-- Image layers (read-only) -->
    <g opacity="0.7">
      <rect x="15" y="75" width="230" height="25" rx="4" fill="#475569"/>
      <text x="130" y="92" fill="white" font-size="10" text-anchor="middle">App Code (read-only)</text>
      
      <rect x="15" y="105" width="230" height="25" rx="4" fill="#64748b"/>
      <text x="130" y="122" fill="white" font-size="10" text-anchor="middle">Dependencies (read-only)</text>
      
      <rect x="15" y="135" width="230" height="25" rx="4" fill="#7c3aed"/>
      <text x="130" y="152" fill="white" font-size="10" text-anchor="middle">Runtime (read-only)</text>
      
      <rect x="15" y="165" width="230" height="25" rx="4" fill="#16a34a"/>
      <text x="130" y="182" fill="white" font-size="10" text-anchor="middle">Base OS (read-only)</text>
    </g>
  </g>
  
  <text x="400" y="320" fill="#6b7280" font-size="12" text-anchor="middle">Images are templates • Containers are running instances</text>
</svg>