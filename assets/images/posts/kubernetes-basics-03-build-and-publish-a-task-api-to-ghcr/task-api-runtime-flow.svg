<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-label="Client requests enter the Task API Node.js server on port 3000, then health checks return directly, task reads load the task store, and task creation optionally authenticates, validates, appends, and writes the task store">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #102534; }
      .zone-label { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #587083; }
      .node-title { font-size: 16px; font-weight: 700; }
      .detail { font-size: 13px; fill: #506779; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #405c70; }
      .step { font-family: Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #277da1; }
    </style>
  </defs>

  <rect width="760" height="620" fill="#ffffff"/>

  <rect x="20" y="20" width="720" height="112" rx="14" fill="#eef4f7" stroke="#b7c8d3" stroke-width="1.5"/>
  <rect x="20" y="148" width="720" height="448" rx="14" fill="#f5f8fa" stroke="#b7c8d3" stroke-width="1.5"/>

  <rect x="42" y="64" width="108" height="44" rx="10" fill="#c9e1ed" stroke="#172b3a" stroke-width="2"/>
  <rect x="166" y="64" width="164" height="44" rx="10" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>
  <rect x="346" y="64" width="164" height="44" rx="10" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>
  <rect x="526" y="64" width="192" height="44" rx="10" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>

  <rect x="42" y="294" width="112" height="82" rx="12" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>
  <rect x="194" y="274" width="132" height="122" rx="12" fill="#c9e1ed" stroke="#172b3a" stroke-width="2"/>

  <rect x="376" y="176" width="338" height="96" rx="12" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>
  <rect x="376" y="292" width="338" height="112" rx="12" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>
  <rect x="376" y="424" width="338" height="146" rx="12" fill="#ffffff" stroke="#172b3a" stroke-width="2"/>

  <path d="M154 335 H174" fill="none" stroke="#172b3a" stroke-width="2.8"/>
  <path d="M174 328 L186 335 L174 342 Z" fill="#172b3a"/>

  <path d="M326 304 H344 V224 H356" fill="none" stroke="#172b3a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M356 217 L368 224 L356 231 Z" fill="#172b3a"/>
  <path d="M326 335 H356" fill="none" stroke="#172b3a" stroke-width="2.8"/>
  <path d="M356 328 L368 335 L356 342 Z" fill="#172b3a"/>
  <path d="M326 366 H344 V497 H356" fill="none" stroke="#172b3a" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M356 490 L368 497 L356 504 Z" fill="#172b3a"/>

  <line x1="394" y1="352" x2="696" y2="352" stroke="#d4dfe5" stroke-width="1.5"/>
  <line x1="394" y1="474" x2="696" y2="474" stroke="#d4dfe5" stroke-width="1.5"/>
  <line x1="394" y1="516" x2="696" y2="516" stroke="#d4dfe5" stroke-width="1.5"/>

  <text x="42" y="48" class="zone-label">RUNTIME ENVIRONMENT</text>
  <text x="96" y="91" text-anchor="middle" class="code">PORT=3000</text>
  <text x="248" y="91" text-anchor="middle" class="code">APP_MESSAGE</text>
  <text x="428" y="83" text-anchor="middle" class="code">API_TOKEN</text>
  <text x="428" y="99" text-anchor="middle" class="detail">optional</text>
  <text x="622" y="83" text-anchor="middle" class="code">TASK_STORE_PATH</text>
  <text x="622" y="99" text-anchor="middle" class="detail">task file</text>

  <text x="42" y="178" class="zone-label">REQUEST FLOW</text>
  <text x="98" y="328" text-anchor="middle" class="node-title">Client</text>
  <text x="98" y="352" text-anchor="middle" class="detail">HTTP request</text>

  <text x="260" y="311" text-anchor="middle" class="node-title">Node.js</text>
  <text x="260" y="333" text-anchor="middle" class="node-title">HTTP server</text>
  <text x="260" y="361" text-anchor="middle" class="code">0.0.0.0:3000</text>
  <text x="260" y="380" text-anchor="middle" class="detail">route request</text>

  <text x="396" y="207" class="node-title">GET /healthz</text>
  <text x="396" y="235" class="code">200  { status: "ok" }</text>
  <text x="696" y="256" text-anchor="end" class="step">NO TASK STORAGE</text>

  <text x="396" y="323" class="node-title">GET /</text>
  <text x="396" y="343" class="detail">Build response</text>
  <text x="396" y="376" class="step">READ</text>
  <text x="438" y="376" class="code">TASK_STORE_PATH</text>
  <text x="696" y="376" text-anchor="end" class="code">APP_MESSAGE + tasks</text>

  <text x="396" y="455" class="node-title">POST /tasks</text>
  <text x="396" y="499" class="step">01</text>
  <text x="426" y="499" class="detail">Bearer token when API_TOKEN is set</text>
  <text x="396" y="541" class="step">02</text>
  <text x="426" y="541" class="detail">Validate non-empty title</text>
  <text x="582" y="541" class="step">03</text>
  <text x="612" y="541" class="detail">Append task</text>
  <text x="696" y="557" text-anchor="end" class="code">write TASK_STORE_PATH</text>
</svg>