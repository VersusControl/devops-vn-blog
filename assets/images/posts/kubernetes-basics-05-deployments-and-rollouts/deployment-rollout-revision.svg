<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A Deployment creates a ReplicaSet and two Pods, then a changed template creates a new rollout revision while old Pods remain available">
