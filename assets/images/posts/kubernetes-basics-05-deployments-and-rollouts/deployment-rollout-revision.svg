  <rect width="1200" height="630" fill="#fff"/><rect x="35" y="42" width="1130" height="270" rx="16" fill="#edf4f7"/><text x="65" y="78" class="z">REVISION 1 / DESIRED REPLICAS 2</text><rect x="78" y="130" width="180" height="105" rx="12" fill="#d8edf3" stroke="#277da1" stroke-width="3"/><text x="168" y="174" text-anchor="middle" class="t">Deployment</text><text x="168" y="204" text-anchor="middle" class="d">app=task-api</text><path d="M258 182H326" stroke="#172033" stroke-width="3"/><path d="M326 174L340 182L326 190Z" fill="#172033"/><rect x="350" y="130" width="180" height="105" rx="12" fill="#fff" stroke="#172033" stroke-width="2"/><text x="440" y="174" text-anchor="middle" class="t">ReplicaSet</text><text x="440" y="204" text-anchor="middle" class="d">task-api-abc</text><path d="M530 182H620V135H686" fill="none" stroke="#172033" stroke-width="3"/><path d="M686 127L700 135L686 143Z" fill="#172033"/><path d="M620 182V270H686" fill="none" stroke="#172033" stroke-width="3"/><path d="M686 262L700 270L686 278Z" fill="#172033"/><rect x="710" y="90" width="175" height="90" rx="10" fill="#fff" stroke="#277da1" stroke-width="2"/><rect x="710" y="225" width="175" height="90" rx="10" fill="#fff" stroke="#277da1" stroke-width="2"/><text x="797" y="143" text-anchor="middle" class="t">Pod A</text><text x="797" y="275" text-anchor="middle" class="t">Pod B</text><text x="940" y="150" class="d">image: 1.0.0</text><text x="940" y="282" class="d">ready: true</text>
  <rect x="35" y="350" width="1130" height="235" rx="16" fill="#f5f8fa"/><text x="65" y="388" class="z">TEMPLATE CHANGES / ROLLING UPDATE</text><rect x="85" y="430" width="170" height="90" rx="10" fill="#d8edf3" stroke="#277da1" stroke-width="2"/><text x="170" y="472" text-anchor="middle" class="t">Deployment</text><text x="170" y="499" text-anchor="middle" class="d">image: 1.0.1</text><path d="M255 475H326" stroke="#172033" stroke-width="3"/><path d="M326 467L340 475L326 483Z" fill="#172033"/><rect x="350" y="430" width="170" height="90" rx="10" fill="#fff" stroke="#172033" stroke-width="2"/><text x="435" y="472" text-anchor="middle" class="t">ReplicaSet</text><text x="435" y="499" text-anchor="middle" class="d">revision 2</text><path d="M520 475H591" stroke="#172033" stroke-width="3"/><path d="M591 467L605 475L591 483Z" fill="#172033"/><rect x="615" y="430" width="190" height="90" rx="10" fill="#d8edf3" stroke="#277da1" stroke-width="2"/><text x="710" y="472" text-anchor="middle" class="t">new Pod</text><text x="710" y="499" text-anchor="middle" class="d">must become ready</text><path d="M805 475H866" stroke="#172033" stroke-width="3"/><path d="M866 467L880 475L866 483Z" fill="#172033"/><rect x="890" y="430" width="220" height="90" rx="10" fill="#fff" stroke="#172033" stroke-width="2"/><text x="1000" y="472" text-anchor="middle" class="t">old Pod removed</text><text x="1000" y="499" text-anchor="middle" class="d">after availability</text>
