<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-label="What the Argo CD backup covers. The argocd namespace holds Applications, AppProjects, repository credentials stored as Secrets with the argocd.argoproj.io/secret-type label, the argocd-cm and argocd-rbac-cm ConfigMaps for settings and RBAC, and argocd-secret with the admin password and signing key. argocd admin export saves all of them, and all of them are lost if the namespace is deleted. Outside the namespace, Git keeps the application manifests and the guestbook namespace keeps its running Pods: they are not in the backup and are not lost.">
	<defs>
		<style>
			text{font-family:'Helvetica Neue',Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.mono-t{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.mono{font-family:Menlo,Consolas,monospace;font-size:12px;fill:#263746}
			.box-label{font-family:Menlo,Consolas,monospace;font-size:13px;font-weight:700;fill:#17212b}
			.note{font-size:13px;font-weight:700;fill:#17212b}
			.zone-box{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
		</style>
	</defs>
	<rect width="760" height="486" fill="#fff"/>
	<rect x="20" y="20" width="450" height="446" rx="14" class="zone-box"/>
	<text x="36" y="42" class="zone">ARGOCD NAMESPACE</text>
	<rect x="38" y="58" width="414" height="364" rx="12" class="primary"/>
	<text x="54" y="83" class="box-label">argocd admin export</text>
	<text x="436" y="83" class="detail" text-anchor="end" style="fill:#456987">saves all of these</text>
	<rect x="54" y="96" width="382" height="54" rx="12" class="node"/>
	<text x="70" y="118" class="title">Applications</text>
	<text x="70" y="137" class="detail">what to deploy, from where, to where</text>
	<rect x="54" y="160" width="382" height="54" rx="12" class="node"/>
	<text x="70" y="182" class="title">AppProjects</text>
	<text x="70" y="201" class="detail">which repos and namespaces a team may use</text>
	<rect x="54" y="224" width="382" height="54" rx="12" class="node"/>
	<text x="70" y="246" class="title">Repository credentials</text>
	<text x="70" y="265" class="detail">Secrets labelled <tspan class="mono">argocd.argoproj.io/secret-type</tspan></text>
	<rect x="54" y="288" width="382" height="54" rx="12" class="node"/>
	<text x="70" y="310" class="title">ConfigMaps</text>
	<text x="70" y="329" class="detail">settings and RBAC: <tspan class="mono">argocd-cm</tspan>, <tspan class="mono">argocd-rbac-cm</tspan></text>
	<rect x="54" y="352" width="382" height="54" rx="12" class="node"/>
	<text x="70" y="374" class="title"><tspan class="mono-t">argocd-secret</tspan></text>
	<text x="70" y="393" class="detail">admin password and signing key</text>
	<text x="36" y="450" class="note">lost if the namespace is deleted</text>
	<rect x="490" y="138" width="250" height="210" rx="14" class="zone-box"/>
	<text x="506" y="160" class="zone">OUTSIDE THE NAMESPACE</text>
	<rect x="506" y="178" width="218" height="54" rx="12" class="node"/>
	<text x="522" y="200" class="title">Git</text>
	<text x="522" y="219" class="detail">application manifests</text>
	<rect x="506" y="244" width="218" height="54" rx="12" class="node"/>
	<text x="522" y="266" class="title"><tspan class="mono-t">guestbook</tspan> namespace</text>
	<text x="522" y="285" class="detail">running Pods</text>
	<text x="506" y="330" class="note">not in the backup, not lost</text>
</svg>
