<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-label="Request flow from api.example.com through DNS, a cloud load balancer, the Kubernetes Gateway proxy, HTTPRoute rules, and payment or auth Pods, with the separate Gateway controller control path.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.small{font-size:10.5px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:10.5px;fill:#263746}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.flow{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
			.control{fill:none;stroke:#17212b;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round}
			.mapping{fill:none;stroke:#657c91;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
			.arrow{fill:#17212b}
			.mapping-arrow{fill:#657c91}
		</style>
	</defs>
	<rect width="760" height="980" fill="#fff"/>

	<!-- DNS and cluster zones -->
	<rect x="410" y="20" width="330" height="310" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="430" y="44" class="zone">DNS</text>
	<rect x="430" y="56" width="290" height="86" rx="10" class="node"/>
	<text x="448" y="81" class="title">DNS hosting provider</text>
	<text x="448" y="103" class="detail">Route 53  |  Cloud DNS  |  Cloudflare</text>
	<text x="448" y="126" class="small">Registrar delegates the zone via NS records</text>
	<rect x="430" y="205" width="290" height="112" rx="10" class="node"/>
	<text x="446" y="226" class="title" font-size="13">DNS records</text>
	<text x="446" y="245" class="small" font-weight="700">Type</text>
	<text x="492" y="245" class="small" font-weight="700">Name</text>
	<text x="612" y="245" class="small" font-weight="700">Value</text>
	<path d="M442 251H708 M442 272H708 M442 293H708" stroke="#d3dde6" stroke-width="1"/>
	<text x="446" y="267" class="mono">A</text>
	<text x="492" y="267" class="mono">api.example.com</text>
	<text x="612" y="267" class="mono">34.56.56.23</text>
	<text x="446" y="288" class="mono">A</text>
	<text x="492" y="288" class="mono">*.example.com</text>
	<text x="612" y="288" class="mono">34.56.56.23</text>
	<text x="446" y="309" class="mono">CNAME</text>
	<text x="492" y="309" class="mono">www.example.com</text>
	<text x="612" y="309" class="mono">api.example.com</text>

	<rect x="28" y="350" width="704" height="610" rx="14" fill="#e9eff4" stroke="#93a7b8" stroke-width="2"/>
	<text x="48" y="378" class="zone">KUBERNETES CLUSTER</text>
	<rect x="48" y="394" width="444" height="554" rx="12" fill="#f5f7f9" stroke="#b5c2cd" stroke-width="2"/>
	<text x="68" y="420" class="zone">SHOP NAMESPACE</text>
	<rect x="505" y="394" width="210" height="554" rx="12" fill="#f5f7f9" stroke="#b5c2cd" stroke-width="2"/>
	<text x="519" y="413" class="zone" font-size="9" letter-spacing="0.5">NGINX-GATEWAY</text>
	<text x="519" y="428" class="zone" font-size="9" letter-spacing="0.5">NAMESPACE</text>

	<!-- Legend -->
	<path d="M365 374H386" class="flow"/>
	<path d="M386 374L378 369L378 379Z" class="arrow"/>
	<text x="393" y="378" class="small">request path</text>
	<path d="M485 374H506" class="control"/>
	<path d="M506 374L498 369L498 379Z" class="arrow"/>
	<text x="513" y="378" class="small">control path</text>
	<path d="M610 374H631" class="mapping"/>
	<path d="M631 374L623 369L623 379Z" class="mapping-arrow"/>
	<text x="638" y="378" class="small">DNS mapping</text>

	<!-- Connectors are drawn before nodes; each destination has its own explicit head. -->
	<path d="M250 116V132" class="flow"/>
	<path d="M250 146L244 135H256Z" class="arrow"/>
	<path d="M250 202V225" class="flow"/>
	<path d="M250 237L244 226H256Z" class="arrow"/>
	<path d="M250 315V396" class="flow"/>
	<path d="M250 412L243 399H257Z" class="arrow"/>
	<path d="M390 272H402V164H585V185" class="mapping"/>
	<path d="M585 197L579 185H591Z" class="mapping-arrow"/>
	<path d="M267 504V537" class="flow"/>
	<path d="M267 550L260 537H274Z" class="arrow"/>
	<path d="M178 662V701H160V732" class="flow"/>
	<path d="M160 740L153 727H167Z" class="arrow"/>
	<path d="M356 662V701H380V732" class="flow"/>
	<path d="M380 740L373 727H387Z" class="arrow"/>
	<path d="M610 562V531" class="control"/>
	<path d="M610 518L604 531H616Z" class="arrow"/>
	<path d="M530 490L476 568" class="control"/>
	<path d="M466 582L469 567L480 575Z" class="arrow"/>

	<!-- Client and DNS lookup -->
	<rect x="110" y="48" width="280" height="68" rx="12" class="node"/>
	<text x="250" y="77" text-anchor="middle" class="title">Client</text>
	<text x="250" y="98" text-anchor="middle" class="detail">browser</text>
	<rect x="110" y="154" width="280" height="48" rx="8" fill="#17212b" stroke="#17212b" stroke-width="2"/>
	<text x="250" y="184" text-anchor="middle" font-family="Menlo,monospace" font-size="15" style="fill:#fff">api.example.com</text>
	<text x="282" y="221" class="small">DNS lookup</text>
	<rect x="110" y="245" width="280" height="70" rx="12" class="node"/>
	<text x="250" y="273" text-anchor="middle" class="title">Cloud Load Balancer</text>
	<text x="250" y="296" text-anchor="middle" class="mono">34.56.56.23</text>

	<!-- Gateway data plane and backends -->
	<rect x="76" y="438" width="382" height="66" rx="11" class="node"/>
	<text x="267" y="464" text-anchor="middle" class="title">Gateway Service</text>
	<text x="267" y="487" text-anchor="middle" class="mono">shop-gateway-nginx · LoadBalancer</text>
	<rect x="76" y="558" width="382" height="104" rx="11" fill="#d8e7f2" stroke="#456987" stroke-width="2"/>
	<text x="267" y="584" text-anchor="middle" class="title">Gateway proxy (data plane)</text>
	<rect x="119" y="604" width="88" height="39" rx="7" fill="#fff" stroke="#7893a8" stroke-width="1.5"/>
	<rect x="223" y="604" width="88" height="39" rx="7" fill="#fff" stroke="#7893a8" stroke-width="1.5"/>
	<rect x="327" y="604" width="88" height="39" rx="7" fill="#fff" stroke="#7893a8" stroke-width="1.5"/>
	<text x="163" y="629" text-anchor="middle" class="detail">nginx</text>
	<text x="267" y="629" text-anchor="middle" class="detail">nginx</text>
	<text x="371" y="629" text-anchor="middle" class="detail">nginx</text>

	<!-- Pod groups and route table -->
	<rect x="65" y="748" width="190" height="80" rx="10" class="node"/>
	<text x="160" y="770" text-anchor="middle" class="title" font-size="13">payment-service</text>
	<rect x="82" y="782" width="68" height="32" rx="6" fill="#f5f7f9" stroke="#91a2b1" stroke-width="1.5"/>
	<rect x="170" y="782" width="68" height="32" rx="6" fill="#f5f7f9" stroke="#91a2b1" stroke-width="1.5"/>
	<text x="116" y="803" text-anchor="middle" class="small">Pod 1</text>
	<text x="204" y="803" text-anchor="middle" class="small">Pod 2</text>
	<rect x="285" y="748" width="190" height="80" rx="10" class="node"/>
	<text x="380" y="770" text-anchor="middle" class="title" font-size="13">auth-service</text>
	<rect x="302" y="782" width="68" height="32" rx="6" fill="#f5f7f9" stroke="#91a2b1" stroke-width="1.5"/>
	<rect x="390" y="782" width="68" height="32" rx="6" fill="#f5f7f9" stroke="#91a2b1" stroke-width="1.5"/>
	<text x="336" y="803" text-anchor="middle" class="small">Pod 1</text>
	<text x="424" y="803" text-anchor="middle" class="small">Pod 2</text>
	<rect x="65" y="846" width="410" height="87" rx="10" class="node"/>
	<text x="82" y="866" class="title" font-size="13">HTTPRoute api-routes</text>
	<text x="82" y="884" class="small" font-weight="700">Host</text>
	<text x="220" y="884" class="small" font-weight="700">Path</text>
	<text x="294" y="884" class="small" font-weight="700">Backend</text>
	<path d="M77 889H463 M77 910H463" stroke="#d3dde6" stroke-width="1"/>
	<text x="82" y="906" class="mono">api.example.com</text>
	<text x="220" y="906" class="mono">/payment</text>
	<text x="294" y="906" class="mono">payment-service</text>
	<text x="82" y="928" class="mono">api.example.com</text>
	<text x="220" y="928" class="mono">/auth</text>
	<text x="294" y="928" class="mono">auth-service</text>

	<!-- Separate control plane -->
	<rect x="518" y="432" width="184" height="78" rx="10" class="node"/>
	<text x="610" y="461" text-anchor="middle" class="title" font-size="13">Gateway controller</text>
	<text x="610" y="484" text-anchor="middle" class="detail">control plane</text>
	<rect x="518" y="562" width="184" height="92" rx="10" class="node"/>
	<text x="610" y="587" text-anchor="middle" class="title" font-size="11.5">Kubernetes API objects</text>
	<text x="610" y="610" text-anchor="middle" class="mono">GatewayClass · Gateway</text>
	<text x="610" y="631" text-anchor="middle" class="mono">HTTPRoute</text>

	<!-- Step markers and connector labels -->
	<g fill="#fff" stroke="#2496ed" stroke-width="2">
		<circle cx="82" cy="178" r="12"/><circle cx="82" cy="280" r="12"/>
		<circle cx="54" cy="600" r="12"/><circle cx="54" cy="728" r="12"/>
	</g>
	<g text-anchor="middle" font-size="12" font-weight="700">
		<text x="82" y="182" style="fill:#1474b8">1</text><text x="82" y="284" style="fill:#1474b8">2</text>
		<text x="54" y="604" style="fill:#1474b8">3</text><text x="54" y="732" style="fill:#1474b8">4</text>
	</g>
	<text x="420" y="186" class="small">address published in DNS</text>
	<text x="267" y="724" text-anchor="middle" class="small">direct to Pod IPs (EndpointSlice)</text>
	<text x="521" y="533" class="small">pushes config</text>
	<text x="621" y="544" class="small">watches</text>
</svg>