<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Load balancer provisioning: you create Gateway shop-gateway, the Gateway controller creates Deployment and Service shop-gateway-nginx of type LoadBalancer, the cloud controller provisions a cloud load balancer at 34.56.56.23, the address is written back to the Service status and copied to the Gateway status.addresses, and you put it in the DNS record for api.example.com.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:14px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.label{font-size:11px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:10.5px;fill:#263746}
			.mono-muted{font-family:Menlo,monospace;font-size:10.5px;fill:#526579}
			.num{font-size:12px;font-weight:700;fill:#1474b8}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.hl{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.note{fill:#f5f7f9;stroke:#91a2b1;stroke-width:1.5;stroke-dasharray:5 4}
			.flow{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
			.ret{fill:none;stroke:#657c91;stroke-width:2.5;stroke-dasharray:7 5;stroke-linecap:round}
			.arrow{fill:#17212b}
			.ret-arrow{fill:#657c91}
		</style>
	</defs>
	<rect width="760" height="440" fill="#fff"/>

	<!-- Zones -->
	<rect x="20" y="20" width="436" height="400" rx="14" fill="#e9eff4" stroke="#aab9c7" stroke-width="2"/>
	<text x="40" y="44" class="zone">KUBERNETES CLUSTER</text>
	<rect x="508" y="20" width="232" height="140" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="528" y="44" class="zone">DNS</text>
	<rect x="508" y="180" width="232" height="240" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="528" y="204" class="zone">CLOUD</text>

	<!-- Nodes -->
	<rect x="40" y="60" width="170" height="76" rx="12" class="node"/>
	<text x="125" y="92" text-anchor="middle" class="title">Gateway controller</text>
	<text x="125" y="114" text-anchor="middle" class="detail">control plane</text>

	<rect x="266" y="60" width="170" height="76" rx="12" class="node"/>
	<text x="351" y="84" text-anchor="middle" class="title">Gateway</text>
	<text x="351" y="104" text-anchor="middle" class="mono">shop-gateway</text>
	<text x="351" y="124" text-anchor="middle" class="mono-muted">status.addresses</text>

	<rect x="528" y="60" width="192" height="76" rx="12" class="node"/>
	<text x="624" y="84" text-anchor="middle" class="title">DNS record</text>
	<text x="624" y="104" text-anchor="middle" class="mono">api.example.com</text>
	<text x="624" y="124" text-anchor="middle" class="detail">you add the address</text>

	<rect x="40" y="210" width="170" height="76" rx="12" class="node"/>
	<text x="125" y="234" text-anchor="middle" class="title">Deployment</text>
	<text x="125" y="254" text-anchor="middle" class="mono">shop-gateway-nginx</text>
	<text x="125" y="274" text-anchor="middle" class="detail">proxy Pods</text>

	<rect x="266" y="210" width="170" height="84" rx="12" class="node"/>
	<text x="351" y="234" text-anchor="middle" class="title">Service</text>
	<text x="351" y="254" text-anchor="middle" class="mono">shop-gateway-nginx</text>
	<text x="351" y="274" text-anchor="middle" class="mono">type: LoadBalancer</text>

	<rect x="528" y="220" width="192" height="76" rx="12" class="hl"/>
	<text x="624" y="244" text-anchor="middle" class="title">Cloud load balancer</text>
	<text x="624" y="264" text-anchor="middle" class="mono">34.56.56.23</text>
	<text x="624" y="284" text-anchor="middle" class="detail">layer 4</text>

	<rect x="266" y="340" width="170" height="60" rx="12" class="node"/>
	<text x="351" y="366" text-anchor="middle" class="title">Cloud controller</text>
	<text x="351" y="386" text-anchor="middle" class="detail">cloud provider</text>

	<rect x="40" y="312" width="170" height="88" rx="12" class="note"/>
	<text x="125" y="332" text-anchor="middle" class="label">Service setting</text>
	<text x="125" y="354" text-anchor="middle" class="mono">externalTrafficPolicy:</text>
	<text x="125" y="370" text-anchor="middle" class="mono">Local</text>
	<text x="125" y="390" text-anchor="middle" class="detail">keeps client IP</text>

	<!-- 1: Gateway triggers the controller -->
	<path d="M266 98H230" class="flow"/>
	<path d="M218 98L231 91.5V104.5Z" class="arrow"/>
	<!-- 2: controller creates Deployment and Service -->
	<path d="M100 136V190" class="flow"/>
	<path d="M100 202L93.5 189H106.5Z" class="arrow"/>
	<path d="M180 136V172H300V190" class="flow"/>
	<path d="M300 202L293.5 189H306.5Z" class="arrow"/>
	<!-- 3: Service triggers cloud controller, which provisions the load balancer -->
	<path d="M351 294V320" class="flow"/>
	<path d="M351 332L344.5 319H357.5Z" class="arrow"/>
	<path d="M436 370H624V317" class="flow"/>
	<path d="M624 304L617.5 317H630.5Z" class="arrow"/>
	<!-- 4: address written back -->
	<path d="M528 258H456" class="ret"/>
	<path d="M444 258L457 251.5V264.5Z" class="ret-arrow"/>
	<path d="M410 210V157" class="ret"/>
	<path d="M410 144L403.5 157H416.5Z" class="ret-arrow"/>
	<!-- 5: address goes into DNS -->
	<path d="M436 98H508" class="flow"/>
	<path d="M520 98L507 91.5V104.5Z" class="arrow"/>

	<!-- Step markers -->
	<g fill="#fff" stroke="#2496ed" stroke-width="2">
		<circle cx="278" cy="46" r="9"/><circle cx="140" cy="164" r="9"/><circle cx="648" cy="341" r="9"/>
		<circle cx="482" cy="236" r="9"/><circle cx="482" cy="76" r="9"/>
	</g>
	<text x="278" y="50" text-anchor="middle" class="num">1</text>
	<text x="140" y="168" text-anchor="middle" class="num">2</text>
	<text x="648" y="345" text-anchor="middle" class="num">3</text>
	<text x="482" y="240" text-anchor="middle" class="num">4</text>
	<text x="482" y="80" text-anchor="middle" class="num">5</text>

	<!-- Connector labels -->
	<text x="294" y="50" class="label">you create</text>
	<text x="238" y="87" text-anchor="middle" class="label">triggers</text>
	<text x="238" y="163" text-anchor="middle" class="label">creates</text>
	<text x="355" y="187" text-anchor="middle" class="label">copies address</text>
	<text x="362" y="317" class="label">triggers</text>
	<text x="663" y="345" class="label">provisions</text>
	<text x="482" y="281" text-anchor="middle" class="label">address</text>
</svg>
