<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="DNS resolution for api.example.com: the browser asks a recursive resolver, which queries the root servers, the .com servers, and the authoritative nameservers in turn and returns 34.56.56.23. Below, the registrar delegates the domain to the DNS hosting provider via NS records.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:14px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.label{font-size:11px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:10.5px;fill:#263746}
			.num{font-size:12px;font-weight:700;fill:#1474b8}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.hl{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.flow{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
			.ret{fill:none;stroke:#657c91;stroke-width:2.5;stroke-dasharray:7 5;stroke-linecap:round}
			.arrow{fill:#17212b}
			.ret-arrow{fill:#657c91}
		</style>
	</defs>
	<rect width="760" height="460" fill="#fff"/>

	<!-- Zones -->
	<rect x="20" y="20" width="720" height="280" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="40" y="44" class="zone">DNS RESOLUTION</text>
	<rect x="20" y="316" width="720" height="128" rx="14" fill="#e9eff4" stroke="#aab9c7" stroke-width="2"/>
	<text x="40" y="340" class="zone">WHO OWNS WHAT</text>

	<!-- Nodes -->
	<rect x="40" y="130" width="124" height="72" rx="12" class="node"/>
	<text x="102" y="160" text-anchor="middle" class="title">Browser</text>
	<text x="102" y="182" text-anchor="middle" class="mono">api.example.com</text>

	<rect x="254" y="56" width="150" height="220" rx="12" class="node"/>
	<text x="329" y="160" text-anchor="middle" class="title">Recursive resolver</text>
	<text x="329" y="182" text-anchor="middle" class="detail">ISP or 1.1.1.1</text>

	<rect x="520" y="56" width="200" height="60" rx="12" class="node"/>
	<text x="620" y="82" text-anchor="middle" class="title">Root servers</text>
	<text x="620" y="102" text-anchor="middle" class="detail">top of the DNS tree</text>

	<rect x="520" y="136" width="200" height="60" rx="12" class="node"/>
	<text x="620" y="162" text-anchor="middle" class="title">.com servers</text>
	<text x="620" y="182" text-anchor="middle" class="detail">TLD nameservers</text>

	<rect x="520" y="216" width="200" height="60" rx="12" class="hl"/>
	<text x="620" y="242" text-anchor="middle" class="title">Authoritative nameservers</text>
	<text x="620" y="262" text-anchor="middle" class="detail">at DNS host, e.g. Route 53</text>

	<rect x="40" y="352" width="260" height="72" rx="12" class="node"/>
	<text x="170" y="380" text-anchor="middle" class="title">Registrar</text>
	<text x="170" y="402" text-anchor="middle" class="detail">sells domain, publishes NS at .com</text>

	<rect x="470" y="352" width="250" height="72" rx="12" class="node"/>
	<text x="595" y="380" text-anchor="middle" class="title">DNS hosting provider</text>
	<text x="595" y="402" text-anchor="middle" class="detail">stores A / CNAME records</text>

	<!-- Browser and resolver -->
	<path d="M164 150H234" class="flow"/>
	<path d="M246 150L233 143.5V156.5Z" class="arrow"/>
	<path d="M254 184H184" class="ret"/>
	<path d="M172 184L185 177.5V190.5Z" class="ret-arrow"/>

	<!-- Queries 1-3 -->
	<path d="M404 72H500" class="flow"/>
	<path d="M512 72L499 65.5V78.5Z" class="arrow"/>
	<path d="M404 152H500" class="flow"/>
	<path d="M512 152L499 145.5V158.5Z" class="arrow"/>
	<path d="M404 232H500" class="flow"/>
	<path d="M512 232L499 225.5V238.5Z" class="arrow"/>

	<!-- Answers -->
	<path d="M520 96H424" class="ret"/>
	<path d="M412 96L425 89.5V102.5Z" class="ret-arrow"/>
	<path d="M520 176H424" class="ret"/>
	<path d="M412 176L425 169.5V182.5Z" class="ret-arrow"/>
	<path d="M520 256H424" class="ret"/>
	<path d="M412 256L425 249.5V262.5Z" class="ret-arrow"/>

	<!-- Delegation -->
	<path d="M300 388H450" class="flow"/>
	<path d="M462 388L449 381.5V394.5Z" class="arrow"/>

	<!-- Step markers -->
	<g fill="#fff" stroke="#2496ed" stroke-width="2">
		<circle cx="424" cy="55" r="9"/><circle cx="424" cy="135" r="9"/><circle cx="424" cy="215" r="9"/>
	</g>
	<text x="424" y="59" text-anchor="middle" class="num">1</text>
	<text x="424" y="139" text-anchor="middle" class="num">2</text>
	<text x="424" y="219" text-anchor="middle" class="num">3</text>

	<!-- Connector labels -->
	<text x="209" y="140" text-anchor="middle" class="label">lookup</text>
	<text x="209" y="203" text-anchor="middle" class="mono">34.56.56.23</text>
	<text x="462" y="113" text-anchor="middle" class="label">ask .com</text>
	<text x="462" y="193" text-anchor="middle" class="label">NS for example.com</text>
	<text x="462" y="273" text-anchor="middle" class="mono">A 34.56.56.23</text>
	<text x="385" y="377" text-anchor="middle" class="label">delegates via NS</text>
</svg>
