<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486" role="img" aria-label="The Gateway controller in the nginx-gateway namespace watches GatewayClass nginx, Gateway shop-gateway, HTTPRoute api-routes, and EndpointSlices; it provisions the shop-gateway-nginx Deployment and Service, pushes NGINX config to the proxy Pods, and writes status conditions back to each object.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:14px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.small{font-size:11px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:11px;fill:#263746}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.flow{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:round}
			.control{fill:none;stroke:#17212b;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
			.arrow{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="486" fill="#fff"/>

	<!-- Zones -->
	<rect x="16" y="20" width="220" height="298" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="32" y="42" class="zone">WATCHED OBJECTS</text>
	<rect x="528" y="20" width="216" height="298" rx="14" fill="#e9eff4" stroke="#aab9c7" stroke-width="2"/>
	<text x="544" y="42" class="zone">DATA PLANE</text>

	<!-- Inputs -> controller: one arrow per object -->
	<path d="M228 82H279" class="flow"/>
	<path d="M292 82L279 75.5V88.5Z" class="arrow"/>
	<path d="M228 148H279" class="flow"/>
	<path d="M292 148L279 141.5V154.5Z" class="arrow"/>
	<path d="M228 214H279" class="flow"/>
	<path d="M292 214L279 207.5V220.5Z" class="arrow"/>
	<path d="M228 280H279" class="flow"/>
	<path d="M292 280L279 273.5V286.5Z" class="arrow"/>

	<!-- Controller -> outputs -->
	<path d="M468 84H523" class="flow"/>
	<path d="M536 84L523 77.5V90.5Z" class="arrow"/>
	<path d="M468 177H523" class="flow"/>
	<path d="M536 177L523 170.5V183.5Z" class="arrow"/>
	<path d="M636 208V231" class="flow"/>
	<path d="M636 244L629.5 231H642.5Z" class="arrow"/>

	<!-- Status return path -->
	<path d="M440 310V420H391" class="control"/>
	<path d="M378 420L391 413.5V426.5Z" class="arrow"/>

	<!-- Inputs -->
	<rect x="32" y="56" width="188" height="52" rx="12" class="node"/>
	<text x="48" y="78" class="title">GatewayClass</text>
	<text x="48" y="97" class="mono">nginx</text>
	<rect x="32" y="122" width="188" height="52" rx="12" class="node"/>
	<text x="48" y="144" class="title">Gateway</text>
	<text x="48" y="163" class="mono">shop-gateway</text>
	<rect x="32" y="188" width="188" height="52" rx="12" class="node"/>
	<text x="48" y="210" class="title">HTTPRoute</text>
	<text x="48" y="229" class="mono">api-routes</text>
	<rect x="32" y="254" width="188" height="52" rx="12" class="node"/>
	<text x="48" y="276" class="title">EndpointSlices</text>
	<text x="48" y="295" class="small">ready Pod IPs</text>

	<!-- Controller -->
	<rect x="300" y="56" width="160" height="250" rx="12" fill="#d8e7f2" stroke="#456987" stroke-width="2"/>
	<text x="380" y="172" text-anchor="middle" class="title" font-size="15">Gateway controller</text>
	<text x="380" y="194" text-anchor="middle" class="mono">nginx-gateway</text>
	<text x="380" y="211" text-anchor="middle" class="small">namespace</text>

	<!-- Outputs -->
	<rect x="544" y="56" width="184" height="56" rx="12" class="node"/>
	<text x="558" y="79" class="title">Deployment + Service</text>
	<text x="558" y="98" class="mono">shop-gateway-nginx</text>
	<rect x="544" y="150" width="184" height="54" rx="12" class="node"/>
	<text x="558" y="172" class="title">NGINX config</text>
	<text x="558" y="191" class="small">upstreams and routes</text>
	<rect x="544" y="252" width="184" height="54" rx="12" class="node"/>
	<text x="558" y="274" class="title">Proxy Pods</text>
	<text x="558" y="293" class="small">data plane</text>

	<!-- Status box -->
	<rect x="32" y="362" width="338" height="104" rx="12" class="node"/>
	<text x="48" y="384" class="title" font-size="13">Status on each object</text>
	<path d="M44 393H358 M44 415H358 M44 437H358" stroke="#d3dde6" stroke-width="1"/>
	<text x="48" y="409" class="detail" font-weight="700" style="fill:#17212b">GatewayClass</text>
	<text x="140" y="409" class="mono">Accepted=True</text>
	<text x="48" y="431" class="detail" font-weight="700" style="fill:#17212b">Gateway</text>
	<text x="140" y="431" class="mono">Programmed=True</text>
	<text x="48" y="453" class="detail" font-weight="700" style="fill:#17212b">HTTPRoute</text>
	<text x="140" y="453" class="mono">Accepted=True, ResolvedRefs=True</text>

	<!-- Connector labels -->
	<text x="268" y="72" text-anchor="middle" class="small">watches</text>
	<text x="496" y="74" text-anchor="middle" class="small">provisions</text>
	<text x="496" y="167" text-anchor="middle" class="small">pushes</text>
	<text x="452" y="372" class="small">writes status</text>
</svg>
