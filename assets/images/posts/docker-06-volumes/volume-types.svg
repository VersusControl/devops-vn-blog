<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="320" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="30" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Volume Types</text>
  
  <!-- Named Volume -->
  <g transform="translate(50,60)">
    <text x="100" y="0" fill="#2496ED" font-size="13" font-weight="600" text-anchor="middle">Named Volume</text>
    
    <rect x="0" y="20" width="200" height="70" rx="6" fill="#1e293b" stroke="#2496ED" stroke-width="2"/>
    <text x="100" y="50" fill="white" font-size="11" text-anchor="middle">Container</text>
    <text x="100" y="70" fill="#6b7280" font-size="10" text-anchor="middle">/var/lib/postgresql/data</text>
    
    <line x1="100" y1="90" x2="100" y2="120" stroke="#2496ED" stroke-width="2"/>
    
    <ellipse cx="100" cy="145" rx="80" ry="30" fill="#2496ED" fill-opacity="0.2" stroke="#2496ED" stroke-width="2"/>
    <text x="100" y="150" fill="#2496ED" font-size="11" text-anchor="middle">pgdata</text>
    
    <text x="100" y="200" fill="#6b7280" font-size="10" text-anchor="middle">Managed by Docker</text>
    <text x="100" y="215" fill="#4ade80" font-size="10" text-anchor="middle">✓ Best for databases</text>
  </g>
  
  <!-- Bind Mount -->
  <g transform="translate(300,60)">
    <text x="100" y="0" fill="#f97316" font-size="13" font-weight="600" text-anchor="middle">Bind Mount</text>
    
    <rect x="0" y="20" width="200" height="70" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="100" y="50" fill="white" font-size="11" text-anchor="middle">Container</text>
    <text x="100" y="70" fill="#6b7280" font-size="10" text-anchor="middle">/app/src</text>
    
    <line x1="100" y1="90" x2="100" y2="120" stroke="#f97316" stroke-width="2"/>
    
    <rect x="20" y="125" width="160" height="45" rx="4" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="2"/>
    <text x="100" y="145" fill="#f97316" font-size="10" text-anchor="middle">/Users/you/project/src</text>
    <text x="100" y="160" fill="#f97316" font-size="9" text-anchor="middle">(host filesystem)</text>
    
    <text x="100" y="200" fill="#6b7280" font-size="10" text-anchor="middle">You manage location</text>
    <text x="100" y="215" fill="#4ade80" font-size="10" text-anchor="middle">✓ Best for development</text>
  </g>
  
  <!-- tmpfs -->
  <g transform="translate(550,60)">
    <text x="100" y="0" fill="#a78bfa" font-size="13" font-weight="600" text-anchor="middle">tmpfs Mount</text>
    
    <rect x="0" y="20" width="200" height="70" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="100" y="50" fill="white" font-size="11" text-anchor="middle">Container</text>
    <text x="100" y="70" fill="#6b7280" font-size="10" text-anchor="middle">/tmp</text>
    
    <line x1="100" y1="90" x2="100" y2="120" stroke="#a78bfa" stroke-width="2"/>
    
    <rect x="30" y="125" width="140" height="40" rx="4" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="100" y="150" fill="#a78bfa" font-size="11" text-anchor="middle">Memory Only</text>
    
    <text x="100" y="200" fill="#6b7280" font-size="10" text-anchor="middle">Ephemeral, fast</text>
    <text x="100" y="215" fill="#4ade80" font-size="10" text-anchor="middle">✓ Best for secrets/cache</text>
  </g>
  
  <text x="400" y="300" fill="#6b7280" font-size="11" text-anchor="middle">Named volumes persist data • Bind mounts sync with host • tmpfs vanishes on stop</text>
</svg>