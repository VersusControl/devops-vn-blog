<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="350" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="30" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Docker Bridge Network</text>
  
  <!-- Host machine -->
  <rect x="50" y="50" width="700" height="260" rx="10" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="70" y="75" fill="#6b7280" font-size="12">Host Machine</text>
  
  <!-- Bridge network -->
  <rect x="100" y="100" width="600" height="180" rx="8" fill="#2496ED" fill-opacity="0.1" stroke="#2496ED" stroke-width="2"/>
  <text x="120" y="125" fill="#2496ED" font-size="12" font-weight="500">my-network (bridge)</text>
  
  <!-- Container 1: API -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#1e293b" stroke="#2496ED" stroke-width="2"/>
    <text x="60" y="25" fill="#2496ED" font-size="12" text-anchor="middle" font-weight="500">api</text>
    <text x="60" y="45" fill="#6b7280" font-size="10" text-anchor="middle">172.18.0.2</text>
    <text x="60" y="65" fill="#6b7280" font-size="10" text-anchor="middle">:3000</text>
  </g>
  
  <!-- Container 2: DB -->
  <g transform="translate(340,150)">
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#1e293b" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="25" fill="#16a34a" font-size="12" text-anchor="middle" font-weight="500">db</text>
    <text x="60" y="45" fill="#6b7280" font-size="10" text-anchor="middle">172.18.0.3</text>
    <text x="60" y="65" fill="#6b7280" font-size="10" text-anchor="middle">:5432</text>
  </g>
  
  <!-- Container 3: Redis -->
  <g transform="translate(530,150)">
    <rect x="0" y="0" width="120" height="80" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="60" y="25" fill="#ef4444" font-size="12" text-anchor="middle" font-weight="500">redis</text>
    <text x="60" y="45" fill="#6b7280" font-size="10" text-anchor="middle">172.18.0.4</text>
    <text x="60" y="65" fill="#6b7280" font-size="10" text-anchor="middle">:6379</text>
  </g>
  
  <!-- Connection lines -->
  <line x1="270" y1="190" x2="340" y2="190" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="460" y1="190" x2="530" y2="190" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- DNS explanation -->
  <text x="305" y="255" fill="#4ade80" font-size="10" text-anchor="middle">ping db ✓</text>
  <text x="495" y="255" fill="#4ade80" font-size="10" text-anchor="middle">ping redis ✓</text>
  
  <!-- Port publishing note -->
  <g transform="translate(150,240)">
    <line x1="60" y1="0" x2="60" y2="-30" stroke="#f97316" stroke-width="2"/>
    <text x="60" y="15" fill="#f97316" font-size="10" text-anchor="middle">-p 3000:3000</text>
    <text x="60" y="28" fill="#6b7280" font-size="9" text-anchor="middle">exposed to host</text>
  </g>
  
  <text x="400" y="330" fill="#6b7280" font-size="11" text-anchor="middle">Containers on the same network find each other by name (DNS)</text>
</svg>