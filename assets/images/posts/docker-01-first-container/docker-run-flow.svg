<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="300" fill="#0d1117"/>
  
  <!-- docker run command -->
  <rect x="50" y="120" width="150" height="50" rx="6" fill="#1e293b"/>
  <text x="125" y="150" fill="#2496ED" font-size="13" text-anchor="middle" font-family="monospace">docker run nginx</text>
  
  <!-- Arrow 1 -->
  <line x1="200" y1="145" x2="260" y2="145" stroke="#2496ED" stroke-width="2"/>
  <polygon points="260,145 250,139 250,151" fill="#2496ED"/>
  
  <!-- Check local -->
  <rect x="270" y="110" width="120" height="70" rx="6" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="140" fill="#9aa4b2" font-size="12" text-anchor="middle">Check local</text>
  <text x="330" y="158" fill="#9aa4b2" font-size="12" text-anchor="middle">images</text>
  
  <!-- Arrow 2 -->
  <line x1="390" y1="145" x2="450" y2="145" stroke="#2496ED" stroke-width="2"/>
  <polygon points="450,145 440,139 440,151" fill="#2496ED"/>
  <text x="420" y="135" fill="#6b7280" font-size="10" text-anchor="middle">not found</text>
  
  <!-- Pull from registry -->
  <rect x="460" y="110" width="130" height="70" rx="6" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="525" y="140" fill="#a78bfa" font-size="12" text-anchor="middle">Pull from</text>
  <text x="525" y="158" fill="#a78bfa" font-size="12" text-anchor="middle">Docker Hub</text>
  
  <!-- Arrow 3 -->
  <line x1="590" y1="145" x2="650" y2="145" stroke="#2496ED" stroke-width="2"/>
  <polygon points="650,145 640,139 640,151" fill="#2496ED"/>
  
  <!-- Create container -->
  <rect x="660" y="110" width="110" height="70" rx="6" fill="#2496ED" opacity="0.2" stroke="#2496ED" stroke-width="2"/>
  <text x="715" y="140" fill="#2496ED" font-size="12" text-anchor="middle">Create &amp;</text>
  <text x="715" y="158" fill="#2496ED" font-size="12" text-anchor="middle">Start</text>
  
  <!-- Bottom explanation -->
  <text x="400" y="230" fill="#6b7280" font-size="12" text-anchor="middle">1. Check locally → 2. Pull if needed → 3. Create container → 4. Start</text>
  <text x="400" y="255" fill="#4b5563" font-size="11" text-anchor="middle">This entire process takes seconds</text>
</svg>