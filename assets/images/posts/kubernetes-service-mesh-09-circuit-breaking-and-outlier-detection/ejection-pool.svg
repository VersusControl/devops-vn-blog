<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" role="img" aria-label="Before and after outlier detection on the ratings Service. Before: the Envoy sidecar of reviews-v2 has two endpoints in its load-balancing pool, ratings-v1 at 10.244.2.10, which answers 200 to every call, and ratings-v-faulty at 10.244.2.22, which answers 503 to half of its calls. Kubernetes shows both Pods Ready and the sidecar sends about 50 percent of calls to each, so 12 of 40 measured pages lost their stars. After: ratings-v-faulty fails twice in a row and the sidecar ejects it from its pool. Its outlier check reads FAILED while Kubernetes still shows it Ready, and every call goes to ratings-v1. Measured: 38 of 40 pages with stars, the 2 errors being the price of detection, then 40 of 40.">
