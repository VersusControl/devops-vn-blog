			.bar-title{font-size:13px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.count{font-family:Menlo,monospace;font-size:13px;font-weight:700;fill:#17212b}
			.count-zero{font-family:Menlo,monospace;font-size:13px;fill:#8a99a8}
			.tick{font-family:Menlo,monospace;font-size:12px;fill:#526579}
			.ejected{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.inpool{fill:#fff;stroke:#283541;stroke-width:2;stroke-dasharray:6 4}
			.cell-ok{fill:#fff;stroke:#283541;stroke-width:1}
			.cell-err{fill:#17212b}
			.band{fill:#fff;stroke:#aab9c7;stroke-width:1.5;stroke-dasharray:6 4}
