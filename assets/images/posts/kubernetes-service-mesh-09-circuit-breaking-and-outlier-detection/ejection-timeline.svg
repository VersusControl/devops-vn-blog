<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Outlier detection over 100 seconds, measured with 10 requests every 10 seconds while ratings-v-faulty answers 503 to half of its calls. The faulty Pod is already ejected when the loop starts, so the batches at 0, 10, and 20 seconds have no errors. Around 26 seconds it is back in the pool: the batches at 30 and 40 seconds have 3 and 2 ratings errors, and it is ejected again for about the same time, so the batches at 50, 60, and 70 seconds have no errors. Around 77 seconds it is back again and the batches at 80 and 90 seconds have 1 error each. Settings: consecutive5xxErrors 2, interval 5s, baseEjectionTime 30s.">
