  <rect x="380" y="185" width="240" height="165" rx="12" fill="#d8edf3" stroke="#277da1" stroke-width="3"/><text x="500" y="223" text-anchor="middle" class="t">Deployment task-api</text><text x="500" y="251" text-anchor="middle" class="d">replicas: 1 · Recreate</text><text x="500" y="278" text-anchor="middle" class="d">imagePullSecrets</text><text x="500" y="305" text-anchor="middle" class="d">envFrom and env</text><text x="500" y="332" text-anchor="middle" class="d">readiness: /healthz</text>
