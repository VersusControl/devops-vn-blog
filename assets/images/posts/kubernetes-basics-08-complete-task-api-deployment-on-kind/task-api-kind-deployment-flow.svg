<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="A complete Task API deployment in Kind: GHCR image and pull Secret feed the Deployment; ConfigMap and Secret configure the Pod; PVC mounts storage; port-forward traffic reaches the Service, EndpointSlice, then Pod">
