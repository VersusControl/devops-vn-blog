<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" role="img" aria-label="Three questions lead to a data model, and each data model maps to its AWS service. The questions, in order: what shape is the data, how will you read it, and what guarantees do you need. The data models and services: relational to RDS, Aurora, and Aurora DSQL; key-value to DynamoDB; document to DocumentDB; wide-column to Keyspaces; in-memory to ElastiCache and MemoryDB; search to OpenSearch Service; graph to Neptune; time series to Timestream for InfluxDB.">
<title>Three questions lead to a data model and its AWS service</title>
<rect width="760" height="472" fill="#ffffff"/>
<rect x="20" y="20" width="290" height="432" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/><text x="36.0" y="46.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#526579" text-anchor="start" letter-spacing="1.5">THREE QUESTIONS</text>
<rect x="36" y="62.0" width="258" height="98.0" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2"/>
<text x="50.0" y="84.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#526579" text-anchor="start" letter-spacing="1">QUESTION 1</text>
<text x="50.0" y="106.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">What shape is the data?</text>
<text x="50.0" y="126.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">related rows, whole records,</text>
<text x="50.0" y="142.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">connections, or time-stamped values</text>
<rect x="36" y="200.0" width="258" height="98.0" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2"/>
<text x="50.0" y="222.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#526579" text-anchor="start" letter-spacing="1">QUESTION 2</text>
<text x="50.0" y="244.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">How will you read it?</text>
<text x="50.0" y="264.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">by a known key, ad-hoc queries,</text>
<text x="50.0" y="280.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">free text, or relationships</text>
<rect x="36" y="338.0" width="258" height="98.0" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2"/>
<text x="50.0" y="360.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#526579" text-anchor="start" letter-spacing="1">QUESTION 3</text>
<text x="50.0" y="382.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">What guarantees do you need?</text>
<text x="50.0" y="402.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">ACID transactions,</text>
<text x="50.0" y="418.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">answers in microseconds</text>
