<path d="M 210.0 280.0 L 262.0 280.0 L 262.0 89.0 L 437.0 89.0" fill="none" stroke="#17212b" stroke-width="2.5" stroke-linejoin="round"/><path d="M 448.0 89.0 L 436.0 95.0 L 436.0 83.0 Z" fill="#17212b"/>
<text x="276.0" y="81.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">orders, inventory</text>
<path d="M 210.0 280.0 L 262.0 280.0 L 262.0 157.0 L 437.0 157.0" fill="none" stroke="#17212b" stroke-width="2.5" stroke-linejoin="round"/><path d="M 448.0 157.0 L 436.0 163.0 L 436.0 151.0 Z" fill="#17212b"/>
<text x="276.0" y="149.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">catalog, profiles</text>
<path d="M 210.0 280.0 L 262.0 280.0 L 262.0 225.0 L 437.0 225.0" fill="none" stroke="#17212b" stroke-width="2.5" stroke-linejoin="round"/><path d="M 448.0 225.0 L 436.0 231.0 L 436.0 219.0 Z" fill="#17212b"/>
<text x="276.0" y="217.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">browsing</text>
</svg>
