<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492" role="img" aria-label="An online store uses each database for the part it fits. Aurora holds orders and inventory, where transactions matter. DocumentDB holds the product catalog and user profiles, which change shape often. DynamoDB serves browsing with fast reads by key. Optional, added only when measurements show a need: ElastiCache as an in-memory cache for hot queries, and OpenSearch for product search.">
<title>One online store, several databases</title>
<rect width="760" height="492" fill="#ffffff"/>
<rect x="440" y="20" width="300" height="248" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/><text x="456.0" y="46.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#526579" text-anchor="start" letter-spacing="1.5">DATABASE PER PART</text>
<rect x="440" y="292" width="300" height="180" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2" stroke-dasharray="8 6"/><text x="456.0" y="318.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#526579" text-anchor="start" letter-spacing="1.5">OPTIONAL, ADD WHEN MEASURED</text>
<rect x="456" y="62" width="268" height="54" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2"/>
<text x="472.0" y="85.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">Aurora</text>
<text x="472.0" y="104.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">transactions</text>
<rect x="456" y="130" width="268" height="54" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2"/>
<text x="472.0" y="153.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">DocumentDB</text>
<text x="472.0" y="172.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">flexible shape</text>
<rect x="456" y="198" width="268" height="54" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2"/>
<text x="472.0" y="221.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">DynamoDB</text>
<text x="472.0" y="240.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">fast reads by key</text>
<rect x="456" y="334" width="268" height="54" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2" stroke-dasharray="7 5"/>
<text x="472.0" y="357.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">ElastiCache</text>
<text x="472.0" y="376.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">in-memory cache</text>
<rect x="456" y="402" width="268" height="54" rx="12" fill="#ffffff" stroke="#283541" stroke-width="2" stroke-dasharray="7 5"/>
<text x="472.0" y="425.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17212b" text-anchor="start">OpenSearch</text>
<text x="472.0" y="444.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="start">full-text search</text>
<rect x="20" y="242.0" width="190" height="76" rx="12" fill="#dce8f4" stroke="#283541" stroke-width="2"/>
<text x="115.0" y="277.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle">Online store</text>
<text x="115.0" y="297.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#526579" text-anchor="middle">one application</text>
<path d="M 262.0 280.0 L 262.0 361.0 L 437.0 361.0" fill="none" stroke="#17212b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M 448.0 361.0 L 436.0 367.0 L 436.0 355.0 Z" fill="#17212b"/>
<text x="276.0" y="353.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#17212b" text-anchor="start">hot queries</text>
<path d="M 262.0 280.0 L 262.0 429.0 L 437.0 429.0" fill="none" stroke="#17212b" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M 448.0 429.0 L 436.0 435.0 L 436.0 423.0 Z" fill="#17212b"/>
