<rect x="32.0" y="318.0" width="204.0" height="36.0" rx="10" class="node"/>
<text x="46.0" y="341.0" class="item">Resource pooling</text>
<rect x="32.0" y="362.0" width="204.0" height="36.0" rx="10" class="node"/>
<text x="46.0" y="385.0" class="item">Rapid elasticity</text>
<rect x="32.0" y="406.0" width="204.0" height="36.0" rx="10" class="node"/>
<text x="46.0" y="429.0" class="item">Measured service</text>
