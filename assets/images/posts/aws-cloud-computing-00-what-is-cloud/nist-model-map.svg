<text x="134.0" y="183.0" class="title" text-anchor="middle">5 essential</text>
<text x="134.0" y="202.0" class="title" text-anchor="middle">characteristics</text>
<rect x="32.0" y="230.0" width="204.0" height="36.0" rx="10" class="node"/>
<text x="46.0" y="253.0" class="item">On-demand self-service</text>
