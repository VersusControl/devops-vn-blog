<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Kubernetes Advanced: Service Mesh, Chapter 11 cover: Mutual TLS in the Mesh. Inside the Book Store mesh, in STRICT mode, the reviews sidecar and the ratings sidecar each hold an identity badge, bookstore-reviews and bookstore-ratings, and present their certificates to each other over mutual TLS. Outside the mesh, report-job has no sidecar and no identity; its plain-text call to ratings is reset before it arrives.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.series{font-size:28px;font-weight:700;fill:#526579}
			.chapter{font-size:28px;fill:#526579}
			.title{font-size:80px;font-weight:700}
			.subtitle{font-size:32px;fill:#526579}
			.zone{font-size:16px;font-weight:700;letter-spacing:2.5px;fill:#526579}
			.tag{font-family:Menlo,monospace;font-size:18px;font-weight:700;fill:#456987}
			.node-title{font-size:30px;font-weight:700}
			.detail{font-size:20px;fill:#526579}
			.badge-text{font-family:Menlo,monospace;font-size:16px;font-weight:700;fill:#17212b}
			.tls-label{font-size:22px;font-weight:700;fill:#456987}
			.off-title{font-size:26px;font-weight:700;fill:#6b7d8f}
			.off-detail{font-size:20px;fill:#6b7d8f}
			.blocked{font-size:20px;font-weight:700;fill:#526579}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.badge{fill:#fff;stroke:#456987;stroke-width:2}
			.off{fill:#f5f7f9;stroke:#8a99a8;stroke-width:2;stroke-dasharray:10 6}
			.tls{fill:none;stroke:#456987;stroke-width:4;stroke-linecap:butt}
			.tls-arrow{fill:#456987}
			.denied{fill:none;stroke:#6b7d8f;stroke-width:4;stroke-dasharray:12 8;stroke-linecap:butt}
			.stop{fill:#17212b}
			.lock-shackle{fill:none;stroke:#456987;stroke-width:1.8}
			.lock-body{fill:#456987}
		</style>
		<g id="lock">
			<path d="M3 7V4.5a3 3 0 0 1 6 0V7" class="lock-shackle"/>
			<rect x="0" y="6.5" width="12" height="8.5" rx="2" class="lock-body"/>
			<circle cx="6" cy="10.5" r="1.3" fill="#fff"/>
		</g>
	</defs>
	<rect width="1600" height="900" fill="#fff"/>

	<!-- Title block -->
	<text x="160" y="282" class="series">Kubernetes Advanced: Service Mesh</text>
	<text x="160" y="326" class="chapter">Chapter 11</text>
	<text x="156" y="432" class="title">Mutual TLS</text>
	<text x="156" y="522" class="title">in the Mesh</text>
	<path d="M160 568H280" stroke="#aab9c7" stroke-width="3"/>
	<text x="160" y="628" class="subtitle">Every workload proves who it is,</text>
	<text x="160" y="672" class="subtitle">plain text is turned away</text>

	<!-- Mesh zone -->
	<rect x="760" y="140" width="690" height="370" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="786" y="184" class="zone">BOOKSTORE MESH</text>
	<text x="1424" y="184" text-anchor="end" class="tag">STRICT</text>

	<!-- mTLS exchange: each sidecar presents its certificate to the other -->
	<path d="M1068 310H1122" class="tls"/>
	<path d="M1142 310L1122 300V320Z" class="tls-arrow"/>
	<path d="M1088 370H1142" class="tls"/>
	<path d="M1068 370L1088 360V380Z" class="tls-arrow"/>
	<use href="#lock" transform="translate(1089.4 231) scale(2.6)"/>
	<text x="1105" y="420" text-anchor="middle" class="tls-label">mTLS</text>

	<!-- Plain-text call from outside the mesh: reset before it reaches ratings -->
	<path d="M1060 695H1285V482" class="denied"/>
	<rect x="1259" y="472" width="52" height="8" rx="2" class="stop"/>
	<text x="1328" y="483" class="blocked">reset</text>
	<text x="1172" y="676" text-anchor="middle" class="blocked">plain text</text>

	<!-- Sidecars with their identity badges -->
	<rect x="790" y="220" width="270" height="210" rx="14" class="primary"/>
	<text x="925" y="276" text-anchor="middle" class="node-title">reviews</text>
	<text x="925" y="312" text-anchor="middle" class="detail">sidecar identity</text>
	<rect x="808" y="340" width="234" height="56" rx="10" class="badge"/>
	<use href="#lock" transform="translate(826 353) scale(2)"/>
	<text x="860" y="374" class="badge-text">bookstore-reviews</text>

	<rect x="1150" y="220" width="270" height="210" rx="14" class="primary"/>
	<text x="1285" y="276" text-anchor="middle" class="node-title">ratings</text>
	<text x="1285" y="312" text-anchor="middle" class="detail">sidecar identity</text>
	<rect x="1168" y="340" width="234" height="56" rx="10" class="badge"/>
	<use href="#lock" transform="translate(1186 353) scale(2)"/>
	<text x="1220" y="374" class="badge-text">bookstore-ratings</text>

	<!-- Outside the mesh: no sidecar, no identity -->
	<rect x="790" y="640" width="270" height="110" rx="14" class="off"/>
	<text x="925" y="687" text-anchor="middle" class="off-title">report-job</text>
	<text x="925" y="723" text-anchor="middle" class="off-detail">no sidecar, no identity</text>
</svg>
