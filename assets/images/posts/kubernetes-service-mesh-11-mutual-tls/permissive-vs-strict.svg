<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-label="PERMISSIVE versus STRICT for the ratings sidecar. PERMISSIVE, the default: the reviews sidecar, with identity bookstore-reviews, calls ratings over mutual TLS and gets 200; report-job in namespace reports, with no sidecar and no identity, calls in plain text and also gets 200, readable on the wire. STRICT: the mutual TLS call from reviews still gets 200, but the plain-text connection from report-job is reset; curl exits with code 56 and the ratings sidecar logs NR filter_chain_not_found. In both modes the ingress gateway reaches productpage with 200, because the gateway has its own mesh identity.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone-label{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.sub{font-size:12px;fill:#526579}
			.panel-label{font-size:11px;font-weight:700;letter-spacing:1px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.off-title{font-size:15px;font-weight:700;fill:#6b7d8f}
			.detail{font-size:12px;fill:#526579}
			.off-detail{font-size:12px;fill:#6b7d8f}
			.row{font-size:12px;fill:#17212b}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.status{font-family:Menlo,monospace;font-size:12px;font-weight:700;fill:#17212b}
			.tls-label{font-size:12px;font-weight:700;fill:#456987}
			.http-label{font-size:12px;font-weight:700;fill:#17212b}
			.reset-label{font-size:12px;font-weight:700;fill:#526579}
			.zone{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.off{fill:#f5f7f9;stroke:#8a99a8;stroke-width:2;stroke-dasharray:6 4}
			.panel{fill:#fff;stroke:#aab9c7;stroke-width:1.5}
			.divider{stroke:#d5dee6;stroke-width:1}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt}
			.arrow{fill:#17212b}
			.tls{fill:none;stroke:#456987;stroke-width:3;stroke-linecap:butt}
			.tls-arrow{fill:#456987}
			.denied{fill:none;stroke:#6b7d8f;stroke-width:2.5;stroke-dasharray:6 4;stroke-linecap:butt}
			.stop{fill:#17212b}
			.lock-shackle{fill:none;stroke:#456987;stroke-width:1.8}
			.lock-body{fill:#456987}
		</style>
		<g id="lock">
			<path d="M3 7V4.5a3 3 0 0 1 6 0V7" class="lock-shackle"/>
			<rect x="0" y="6.5" width="12" height="8.5" rx="2" class="lock-body"/>
			<circle cx="6" cy="10.5" r="1.3" fill="#fff"/>
		</g>
	</defs>
	<rect width="760" height="530" fill="#fff"/>

	<!-- Zones: one column per mode -->
	<rect x="16" y="16" width="356" height="450" rx="14" class="zone"/>
	<text x="32" y="40" class="zone-label">PERMISSIVE</text>
	<text x="32" y="58" class="sub">the default</text>
	<rect x="388" y="16" width="356" height="450" rx="14" class="zone"/>
	<text x="404" y="40" class="zone-label">STRICT</text>
	<text x="404" y="58" class="sub">PeerAuthentication default in bookstore</text>

	<!-- PERMISSIVE connectors -->
	<path d="M108 150V218" class="tls"/>
	<path d="M108 232L102 218H114Z" class="tls-arrow"/>
	<use href="#lock" x="120" y="183"/>
	<text x="138" y="196" class="tls-label">mTLS</text>
	<path d="M280 150V218" class="flow"/>
	<path d="M280 232L274 218H286Z" class="arrow"/>
	<text x="292" y="196" class="http-label">plain text</text>

	<!-- STRICT connectors -->
	<path d="M480 150V218" class="tls"/>
	<path d="M480 232L474 218H486Z" class="tls-arrow"/>
	<use href="#lock" x="492" y="183"/>
	<text x="510" y="196" class="tls-label">mTLS</text>
	<path d="M652 150V204" class="denied"/>
	<rect x="634" y="204" width="36" height="6" rx="2" class="stop"/>
	<text x="664" y="180" class="http-label">plain text</text>
	<text x="680" y="211" class="reset-label">reset</text>

	<!-- PERMISSIVE nodes -->
	<rect x="32" y="76" width="152" height="74" rx="12" class="node"/>
	<text x="108" y="100" text-anchor="middle" class="title">reviews</text>
	<text x="108" y="118" text-anchor="middle" class="detail">sidecar, identity</text>
	<text x="108" y="137" text-anchor="middle" class="mono">bookstore-reviews</text>

	<rect x="204" y="76" width="152" height="74" rx="12" class="off"/>
	<text x="280" y="100" text-anchor="middle" class="off-title">report-job</text>
	<text x="280" y="118" text-anchor="middle" class="off-detail">namespace reports</text>
	<text x="280" y="136" text-anchor="middle" class="off-detail">no sidecar, no identity</text>

	<rect x="32" y="240" width="324" height="60" rx="12" class="primary"/>
	<text x="194" y="264" text-anchor="middle" class="title">ratings sidecar</text>
	<text x="194" y="284" text-anchor="middle" class="detail">accepts mTLS and plain text</text>

	<!-- STRICT nodes -->
	<rect x="404" y="76" width="152" height="74" rx="12" class="node"/>
	<text x="480" y="100" text-anchor="middle" class="title">reviews</text>
	<text x="480" y="118" text-anchor="middle" class="detail">sidecar, identity</text>
	<text x="480" y="137" text-anchor="middle" class="mono">bookstore-reviews</text>

	<rect x="576" y="76" width="152" height="74" rx="12" class="off"/>
	<text x="652" y="100" text-anchor="middle" class="off-title">report-job</text>
	<text x="652" y="118" text-anchor="middle" class="off-detail">namespace reports</text>
	<text x="652" y="136" text-anchor="middle" class="off-detail">no sidecar, no identity</text>

	<rect x="404" y="240" width="324" height="60" rx="12" class="primary"/>
	<text x="566" y="264" text-anchor="middle" class="title">ratings sidecar</text>
	<text x="566" y="284" text-anchor="middle" class="detail">accepts mTLS only</text>

	<!-- PERMISSIVE results -->
	<rect x="32" y="318" width="324" height="130" rx="12" class="panel"/>
	<text x="48" y="340" class="panel-label">RESULT</text>
	<text x="48" y="360" class="row">reviews → ratings</text>
	<text x="340" y="360" text-anchor="end" class="status">200</text>
	<path d="M48 370H340" class="divider"/>
	<text x="48" y="388" class="row">report-job → ratings</text>
	<text x="340" y="388" text-anchor="end" class="status">200</text>
	<text x="340" y="404" text-anchor="end" class="detail">no identity, readable on the wire</text>
	<path d="M48 416H340" class="divider"/>
	<text x="48" y="434" class="row">gateway → productpage</text>
	<text x="340" y="434" text-anchor="end" class="status">200</text>

	<!-- STRICT results -->
	<rect x="404" y="318" width="324" height="130" rx="12" class="panel"/>
	<text x="420" y="340" class="panel-label">RESULT</text>
	<text x="420" y="360" class="row">reviews → ratings</text>
	<text x="712" y="360" text-anchor="end" class="status">200</text>
	<path d="M420 370H712" class="divider"/>
	<text x="420" y="388" class="row">report-job → ratings</text>
	<text x="712" y="388" text-anchor="end" class="status">reset, curl exit 56</text>
	<text x="420" y="404" class="detail">ratings log</text>
	<text x="712" y="404" text-anchor="end" class="mono">NR filter_chain_not_found</text>
	<path d="M420 416H712" class="divider"/>
	<text x="420" y="434" class="row">gateway → productpage</text>
	<text x="712" y="434" text-anchor="end" class="status">200</text>

	<!-- Legend and note -->
	<path d="M18 490H44" class="tls"/>
	<path d="M56 490L44 484V496Z" class="tls-arrow"/>
	<text x="66" y="494" class="detail">mTLS, both sides show an identity</text>
	<path d="M262 490H288" class="flow"/>
	<path d="M300 490L288 484V496Z" class="arrow"/>
	<text x="310" y="494" class="detail">plain text</text>
	<path d="M392 490H414" class="denied"/>
	<rect x="414" y="484" width="6" height="12" rx="1" class="stop"/>
	<text x="430" y="494" class="detail">connection reset by the ratings sidecar</text>
	<text x="18" y="516" class="detail">The ingress gateway has its own mesh identity, so traffic through it keeps working under STRICT.</text>
</svg>
