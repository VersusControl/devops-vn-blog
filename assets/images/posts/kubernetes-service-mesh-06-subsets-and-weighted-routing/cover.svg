<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Kubernetes Advanced: Service Mesh, Chapter 6 cover: Canary Release. The Envoy sidecar of productpage splits reviews traffic by weight: a thick arrow carries 90 percent to reviews-v1 and a thin arrow carries 10 percent to reviews-v3. Below, four rollout steps slide the split from 100/0 through 90/10 and 50/50 to 0/100, with 90/10 as the current step.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.series{font-size:28px;font-weight:700;fill:#526579}
			.chapter{font-size:28px;fill:#526579}
			.title{font-size:80px;font-weight:700}
			.subtitle{font-size:32px;fill:#526579}
			.zone{font-size:16px;font-weight:700;letter-spacing:2.5px;fill:#526579}
			.node-title{font-size:30px;font-weight:700}
			.pod-title{font-size:26px;font-weight:700}
			.detail{font-size:20px;fill:#526579}
			.weight{font-size:40px;font-weight:700}
			.step{font-family:Menlo,monospace;font-size:20px;fill:#526579}
			.step-now{font-family:Menlo,monospace;font-size:20px;font-weight:700;fill:#17212b}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.heavy{fill:none;stroke:#17212b;stroke-width:12;stroke-linecap:butt;stroke-linejoin:round}
			.light{fill:none;stroke:#17212b;stroke-width:4;stroke-linecap:butt;stroke-linejoin:round}
			.flow{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:butt}
			.arrow{fill:#17212b}
			.bar{fill:none;stroke:#283541;stroke-width:2}
			.v1{fill:#fff}
			.v3{fill:#456987}
		</style>
	</defs>
	<rect width="1600" height="900" fill="#fff"/>

	<!-- Title block -->
	<text x="160" y="282" class="series">Kubernetes Advanced: Service Mesh</text>
	<text x="160" y="326" class="chapter">Chapter 6</text>
	<text x="156" y="432" class="title">Canary</text>
	<text x="156" y="522" class="title">Release</text>
	<path d="M160 568H280" stroke="#aab9c7" stroke-width="3"/>
	<text x="160" y="628" class="subtitle">Subsets and weights move</text>
	<text x="160" y="672" class="subtitle">traffic from v1 to v3</text>

	<!-- Zone -->
	<rect x="800" y="120" width="650" height="660" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="826" y="164" class="zone">WEIGHTED ROUTE</text>

	<!-- Weighted connectors: shaft width follows the weight, each with its own head -->
	<path d="M1065 292V346H925V404" class="heavy"/>
	<path d="M925 432L907 404H943Z" class="arrow"/>
	<path d="M1185 292V346H1325V412" class="light"/>
	<path d="M1325 432L1315 412H1335Z" class="arrow"/>

	<text x="947" y="394" class="weight">90%</text>
	<text x="1305" y="394" text-anchor="end" class="weight">10%</text>

	<!-- Nodes -->
	<rect x="1005" y="196" width="240" height="96" rx="14" class="node"/>
	<text x="1125" y="236" text-anchor="middle" class="node-title">productpage</text>
	<text x="1125" y="270" text-anchor="middle" class="detail">Envoy sidecar</text>

	<rect x="825" y="442" width="200" height="100" rx="14" class="node"/>
	<text x="925" y="484" text-anchor="middle" class="pod-title">reviews-v1</text>
	<text x="925" y="516" text-anchor="middle" class="detail">no stars</text>

	<rect x="1225" y="442" width="200" height="100" rx="14" class="primary"/>
	<text x="1325" y="484" text-anchor="middle" class="pod-title">reviews-v3</text>
	<text x="1325" y="516" text-anchor="middle" class="detail">red stars</text>

	<!-- Rollout steps -->
	<path d="M826 590H1424" stroke="#aab9c7" stroke-width="2"/>
	<text x="826" y="636" class="zone">ROLLOUT STEPS</text>

	<path d="M944 682H967" class="flow"/>
	<path d="M981 682L967 675V689Z" class="arrow"/>
	<path d="M1107 682H1130" class="flow"/>
	<path d="M1144 682L1130 675V689Z" class="arrow"/>
	<path d="M1270 682H1292" class="flow"/>
	<path d="M1306 682L1292 675V689Z" class="arrow"/>

	<!-- 100/0 -->
	<rect x="826" y="664" width="110" height="36" class="v1"/>
	<rect x="826" y="664" width="110" height="36" rx="4" class="bar"/>
	<!-- 90/10 -->
	<rect x="989" y="664" width="110" height="36" class="v1"/>
	<rect x="1088" y="664" width="11" height="36" class="v3"/>
	<rect x="989" y="664" width="110" height="36" rx="4" class="bar"/>
	<!-- 50/50 -->
	<rect x="1152" y="664" width="110" height="36" class="v1"/>
	<rect x="1207" y="664" width="55" height="36" class="v3"/>
	<rect x="1152" y="664" width="110" height="36" rx="4" class="bar"/>
	<!-- 0/100 -->
	<rect x="1314" y="664" width="110" height="36" class="v3"/>
	<rect x="1314" y="664" width="110" height="36" rx="4" class="bar"/>

	<text x="881" y="738" text-anchor="middle" class="step">100/0</text>
	<text x="1044" y="738" text-anchor="middle" class="step-now">90/10</text>
	<text x="1207" y="738" text-anchor="middle" class="step">50/50</text>
	<text x="1369" y="738" text-anchor="middle" class="step">0/100</text>
</svg>
