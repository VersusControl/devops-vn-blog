<svg xmlns="http://www.w3.org/2000/svg" width="760" height="776" viewBox="0 0 760 776" role="img" aria-label="Troubleshooting a failed request at the Istio gateway. If the client gets no response at all, an empty reply, there is no listener: check the Gateway selector and port with istioctl proxy-config listener. If it gets a status code, read the gateway access log line and look at the response flag after the status. NR means no matching route: check the host, the path, and the gateways link with istioctl proxy-config route and istioctl analyze. NC means no cluster: check destination.host for a typo with istioctl proxy-config cluster and istioctl analyze, which reports IST0101. UH means no healthy endpoints: no Pods, or none ready; check istioctl proxy-config endpoint and kubectl get pods. UF or URX means the connection to the endpoint failed: a wrong targetPort or an app that is not listening; check the Service's targetPort against the app port. No flag with via_upstream means the next hop, the sidecar or the app, sent the error: find the request ID in the next proxy's log with kubectl logs on the istio-proxy container piped to grep, then read that line's flag the same way.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.label{font-size:12px;font-style:italic;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.mono-b{font-family:Menlo,monospace;font-size:12px;font-weight:700;fill:#17212b}
			.sample{font-family:Menlo,monospace;font-size:14px;fill:#263746}
			.flag{font-family:Menlo,monospace;font-size:14px;font-weight:700;fill:#17212b}
			.chip-text{font-size:13px;font-weight:700;fill:#17212b}
			.tick{font-size:11px;fill:#526579}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.chip{fill:#d8e7f2;stroke:#456987;stroke-width:1.5}
			.divider{stroke:#aab9c7;stroke-width:1.5}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt;stroke-linejoin:round}
			.arrow{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="776" fill="#fff"/>

	<!-- Connectors: every branch has its own path and head -->
	<path d="M44 72V132H68" class="flow"/>
	<path d="M80 132L68 126V138Z" class="arrow"/>
	<path d="M44 72V190" class="flow"/>
	<path d="M44 202L38 190H50Z" class="arrow"/>
	<path d="M44 288V364H68" class="flow"/>
	<path d="M80 364L68 358V370Z" class="arrow"/>
	<path d="M44 288V448H68" class="flow"/>
	<path d="M80 448L68 442V454Z" class="arrow"/>
	<path d="M44 288V532H68" class="flow"/>
	<path d="M80 532L68 526V538Z" class="arrow"/>
	<path d="M44 288V616H68" class="flow"/>
	<path d="M80 616L68 610V622Z" class="arrow"/>
	<path d="M44 288V710H68" class="flow"/>
	<path d="M80 710L68 704V716Z" class="arrow"/>

	<text x="58" y="194" class="label">got a status code</text>

	<!-- Start -->
	<rect x="24" y="16" width="280" height="56" rx="12" class="node"/>
	<text x="44" y="40" class="title">request failed</text>
	<text x="44" y="58" class="detail">curl shows an error, or nothing</text>

	<!-- No response: no listener -->
	<rect x="88" y="96" width="656" height="72" rx="12" class="node"/>
	<rect x="104" y="118" width="101.4" height="28" rx="6" class="chip"/>
	<text x="154.7" y="137" text-anchor="middle" class="chip-text">empty reply</text>
	<text x="244" y="118" class="title">no listener</text>
	<text x="244" y="137" class="detail">Gateway selector or port</text>
	<text x="244" y="154" class="detail">does not match the gateway</text>
	<path d="M468 108V156" class="divider"/>
	<text x="484" y="127" class="mono">istioctl proxy-config listener</text>
	<text x="484" y="145" class="detail">is <tspan class="mono">0.0.0.0:8080</tspan> there?</text>

	<!-- Read the access log -->
	<rect x="24" y="210" width="720" height="78" rx="12" class="primary"/>
	<text x="44" y="240" class="title">read the gateway access log line</text>
	<text x="44" y="264" class="mono">kubectl -n istio-system logs \</text>
	<text x="60" y="280" class="mono">deploy/istio-ingressgateway --tail=1</text>
	<path d="M468 224V274" class="divider" style="stroke:#9fb6c8"/>
	<text x="484" y="250" class="sample">503</text>
	<rect x="519.29" y="231" width="30.86" height="26" rx="6" fill="#fff" stroke="#456987" stroke-width="1.5"/>
	<text x="534.72" y="249.5" text-anchor="middle" class="flag">NC</text>
	<text x="560.15" y="250" class="sample">cluster_not_found</text>
	<text x="496.645" y="274" text-anchor="middle" class="tick">status</text>
	<text x="534.72" y="274" text-anchor="middle" class="tick">flag</text>
	<text x="631.805" y="274" text-anchor="middle" class="tick">details</text>

	<!-- Column headers -->
	<text x="104" y="316" class="zone">FLAG</text>
	<text x="244" y="316" class="zone">CAUSE</text>
	<text x="484" y="316" class="zone">CHECK WITH</text>

	<!-- NR -->
	<rect x="88" y="328" width="656" height="72" rx="12" class="node"/>
	<rect x="104" y="350" width="37" height="28" rx="6" class="chip"/>
	<text x="122.5" y="369" text-anchor="middle" class="flag">NR</text>
	<text x="244" y="350" class="title">no matching route</text>
	<text x="244" y="369" class="detail">host, path, or the</text>
	<text x="244" y="386" class="detail"><tspan class="mono">gateways</tspan> link</text>
	<path d="M468 340V388" class="divider"/>
	<text x="484" y="359" class="mono">istioctl proxy-config route</text>
	<text x="484" y="377" class="mono">istioctl analyze</text>

	<!-- NC -->
	<rect x="88" y="412" width="656" height="72" rx="12" class="node"/>
	<rect x="104" y="434" width="37" height="28" rx="6" class="chip"/>
	<text x="122.5" y="453" text-anchor="middle" class="flag">NC</text>
	<text x="244" y="443" class="title">no cluster</text>
	<text x="244" y="462" class="detail">typo in <tspan class="mono">destination.host</tspan></text>
	<path d="M468 424V472" class="divider"/>
	<text x="484" y="443" class="mono">istioctl proxy-config cluster</text>
	<text x="484" y="461" class="detail"><tspan class="mono">istioctl analyze</tspan> reports IST0101</text>

	<!-- UH -->
	<rect x="88" y="496" width="656" height="72" rx="12" class="node"/>
	<rect x="104" y="518" width="37" height="28" rx="6" class="chip"/>
	<text x="122.5" y="537" text-anchor="middle" class="flag">UH</text>
	<text x="244" y="527" class="title">no healthy endpoints</text>
	<text x="244" y="546" class="detail">no Pods, or none ready</text>
	<path d="M468 508V556" class="divider"/>
	<text x="484" y="527" class="mono">istioctl proxy-config endpoint</text>
	<text x="484" y="545" class="mono">kubectl -n bookstore get pods</text>

	<!-- UF / URX -->
	<rect x="88" y="580" width="656" height="72" rx="12" class="node"/>
	<rect x="104" y="602" width="37" height="28" rx="6" class="chip"/>
	<text x="122.5" y="621" text-anchor="middle" class="flag">UF</text>
	<rect x="147.0" y="602" width="45.5" height="28" rx="6" class="chip"/>
	<text x="169.75" y="621" text-anchor="middle" class="flag">URX</text>
	<text x="244" y="602" class="title">connect to endpoint failed</text>
	<text x="244" y="621" class="detail">wrong <tspan class="mono">targetPort</tspan>, or the</text>
	<text x="244" y="638" class="detail">app is not listening</text>
	<path d="M468 592V640" class="divider"/>
	<text x="484" y="611" class="mono">kubectl get svc &lt;name&gt; -o yaml</text>
	<text x="484" y="629" class="detail">is <tspan class="mono">targetPort</tspan> the app port?</text>

	<!-- no flag, via_upstream -->
	<rect x="88" y="664" width="656" height="92" rx="12" class="node"/>
	<rect x="104" y="688" width="71.8" height="28" rx="6" class="chip"/>
	<text x="139.9" y="707" text-anchor="middle" class="chip-text">no flag</text>
	<text x="104" y="734" class="mono">via_upstream</text>
	<text x="244" y="696" class="title">next hop answered</text>
	<text x="244" y="715" class="detail">the sidecar or the app</text>
	<text x="244" y="732" class="detail">sent the error</text>
	<path d="M468 676V744" class="divider"/>
	<text x="484" y="696" class="mono">kubectl logs &lt;pod&gt; -c istio-proxy</text>
	<text x="500" y="714" class="mono">| grep &lt;x-request-id&gt;</text>
	<text x="484" y="732" class="detail">then read that line's flag</text>

</svg>
