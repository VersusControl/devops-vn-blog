<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="250" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="30" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Container Lifecycle</text>
  
  <!-- States -->
  <g transform="translate(50,80)">
    <!-- Created -->
    <rect x="0" y="0" width="100" height="50" rx="6" fill="#64748b"/>
    <text x="50" y="30" fill="white" font-size="12" text-anchor="middle">Created</text>
    
    <!-- Arrow to Running -->
    <line x1="100" y1="25" x2="150" y2="25" stroke="#2496ED" stroke-width="2"/>
    <polygon points="150,25 142,20 142,30" fill="#2496ED"/>
    <text x="125" y="18" fill="#6b7280" font-size="9" text-anchor="middle">start</text>
    
    <!-- Running -->
    <rect x="150" y="0" width="100" height="50" rx="6" fill="#16a34a"/>
    <text x="200" y="30" fill="white" font-size="12" text-anchor="middle">Running</text>
    
    <!-- Arrow to Paused -->
    <line x1="250" y1="15" x2="300" y2="15" stroke="#f97316" stroke-width="2"/>
    <polygon points="300,15 292,10 292,20" fill="#f97316"/>
    <text x="275" y="8" fill="#6b7280" font-size="9" text-anchor="middle">pause</text>
    
    <!-- Paused -->
    <rect x="300" y="0" width="100" height="50" rx="6" fill="#f97316"/>
    <text x="350" y="30" fill="white" font-size="12" text-anchor="middle">Paused</text>
    
    <!-- Arrow back to Running -->
    <line x1="300" y1="35" x2="250" y2="35" stroke="#16a34a" stroke-width="2"/>
    <polygon points="250,35 258,30 258,40" fill="#16a34a"/>
    <text x="275" y="48" fill="#6b7280" font-size="9" text-anchor="middle">unpause</text>
    
    <!-- Arrow to Stopped -->
    <line x1="400" y1="25" x2="470" y2="25" stroke="#ef4444" stroke-width="2"/>
    <polygon points="470,25 462,20 462,30" fill="#ef4444"/>
    <text x="435" y="18" fill="#6b7280" font-size="9" text-anchor="middle">stop</text>
    
    <!-- Stopped -->
    <rect x="470" y="0" width="100" height="50" rx="6" fill="#ef4444"/>
    <text x="520" y="30" fill="white" font-size="12" text-anchor="middle">Stopped</text>
    
    <!-- Arrow to Removed -->
    <line x1="570" y1="25" x2="620" y2="25" stroke="#6b7280" stroke-width="2"/>
    <polygon points="620,25 612,20 612,30" fill="#6b7280"/>
    <text x="595" y="18" fill="#6b7280" font-size="9" text-anchor="middle">rm</text>
    
    <!-- Removed -->
    <rect x="620" y="0" width="100" height="50" rx="6" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="670" y="30" fill="#6b7280" font-size="12" text-anchor="middle">Removed</text>
    
    <!-- Restart arrow -->
    <path d="M520,50 Q520,90 200,90 Q150,90 150,50" fill="none" stroke="#2496ED" stroke-width="2"/>
    <polygon points="150,50 145,60 155,60" fill="#2496ED"/>
    <text x="350" y="105" fill="#6b7280" font-size="9" text-anchor="middle">restart</text>
  </g>
  
  <!-- Commands reference -->
  <text x="400" y="200" fill="#6b7280" font-size="11" text-anchor="middle">docker create → docker start → docker pause/unpause → docker stop → docker rm</text>
  <text x="400" y="220" fill="#4b5563" font-size="10" text-anchor="middle">Use docker rm -f to force remove running containers</text>
</svg>