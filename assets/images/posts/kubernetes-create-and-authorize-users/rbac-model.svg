<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" viewBox="0 0 760 512" role="img" aria-label="RBAC objects in the dev namespace. The RoleBinding dev-viewer-pod-reader points to the ServiceAccount dev-viewer through subjects (who) and to the Role pod-reader through roleRef (what). The Role allows get, list, and watch on pods and pods/log. All three objects live in the dev namespace. The pro namespace next to it has no Role or RoleBinding, so dev-viewer has no access there.">
	<defs>
		<style>
			text{font-family:'Helvetica Neue', Arial, sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.zone-mono{font-family:Menlo, Consolas, monospace;font-size:13px;font-weight:700;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.cap{font-size:11px;font-weight:700;letter-spacing:1.2px;fill:#526579}
			.mono{font-family:Menlo, Consolas, monospace;font-size:13px;fill:#263746}
			.mono-s{font-family:Menlo, Consolas, monospace;font-size:12px;fill:#263746}
			.key{font-family:Menlo, Consolas, monospace;font-size:12px;fill:#526579}
			.zone-box{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.empty{fill:none;stroke:#9aabbb;stroke-width:1.5;stroke-dasharray:7 5}
			.rule{stroke:#c5d0da;stroke-width:1}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt}
			.arrow{fill:#17212b}
		</style>
	</defs>
<rect width="760" height="512" fill="#fff"/>
<rect x="20" y="20" width="480" height="472" rx="14" class="zone-box"/>
<text x="36" y="44"><tspan class="zone">NAMESPACE</tspan><tspan class="zone-mono" dx="7">dev</tspan></text>
<rect x="520" y="20" width="220" height="472" rx="14" class="zone-box"/>
<text x="536" y="44"><tspan class="zone">NAMESPACE</tspan><tspan class="zone-mono" dx="7">pro</tspan></text>
<rect x="52" y="68" width="260" height="68" rx="12" class="node"/>
<text x="182.0" y="97" class="title" text-anchor="middle">ServiceAccount</text>
<text x="182.0" y="119" class="mono" text-anchor="middle">dev-viewer</text>
<rect x="52" y="208" width="260" height="68" rx="12" class="primary"/>
<text x="182.0" y="237" class="title" text-anchor="middle">RoleBinding</text>
<text x="182.0" y="259" class="mono-s" text-anchor="middle">dev-viewer-pod-reader</text>
<rect x="52" y="348" width="260" height="120" rx="12" class="node"/>
<text x="182.0" y="375" class="title" text-anchor="middle">Role</text>
<text x="182.0" y="395" class="mono" text-anchor="middle">pod-reader</text>
<path d="M70 410H294" class="rule"/>
<text x="74" y="432" class="detail">resources</text>
<text x="150" y="432" class="mono-s">pods, pods/log</text>
<text x="74" y="453" class="detail">verbs</text>
<text x="150" y="453" class="mono-s">get, list, watch</text>
<path d="M182.0 208V156" class="flow"/>
<path d="M182.0 144L176.0 157H188.0Z" class="arrow"/>
<text x="194.0" y="176.0" class="key">subjects</text>
<path d="M182.0 276V328" class="flow"/>
<path d="M182.0 340L176.0 327H188.0Z" class="arrow"/>
<text x="194.0" y="316.0" class="key">roleRef</text>
<text x="340" y="99.0" class="cap">WHO</text>
<text x="340" y="117.0" class="detail">an identity that logs in</text>
<text x="340" y="239.0" class="cap">WHO GETS WHAT</text>
<text x="340" y="257.0" class="detail">grants the Role in dev</text>
<text x="340" y="405.0" class="cap">WHAT</text>
<text x="340" y="423.0" class="detail">read only, no changes</text>
<rect x="540" y="68" width="180" height="400" rx="12" class="empty"/>
<circle cx="630.0" cy="234.0" r="16" fill="none" stroke="#526579" stroke-width="2"/>
<path d="M618.7 222.7L641.3 245.3" stroke="#526579" stroke-width="2"/>
<text x="630.0" y="276.0" class="title" text-anchor="middle">no access</text>
<text x="630.0" y="296.0" class="detail" text-anchor="middle">no Role or RoleBinding</text>
</svg>
