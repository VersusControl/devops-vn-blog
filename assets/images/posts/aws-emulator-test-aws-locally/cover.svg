<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AWS Emulator cover: a laptop runs AWS Emulator on 127.0.0.1:9297 with an in-memory S3 bucket, DynamoDB table, and SQS queue in account 000000000000, while a faded AWS cloud outside the machine is not called.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.kicker{font-size:24px;font-weight:700;letter-spacing:5px;fill:#526579}
			.title{font-size:80px;font-weight:700}
			.subtitle{font-size:34px;fill:#526579}
			.zone{font-size:16px;font-weight:700;letter-spacing:2.5px;fill:#526579}
			.node-title{font-size:30px;font-weight:700}
			.card-title{font-size:24px;font-weight:700}
			.detail{font-size:20px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:22px;fill:#263746}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.shape{fill:#fff;stroke:#283541;stroke-width:2.5;stroke-linejoin:round}
			.fillshape{fill:#d8e7f2;stroke:#456987;stroke-width:2.5;stroke-linejoin:round}
			.muted{fill:#8c9cab}
		</style>
	</defs>
	<rect width="1600" height="900" fill="#fff"/>

	<!-- Title block -->
	<text x="170" y="336" class="kicker">LOCAL TESTING</text>
	<text x="166" y="428" class="title">AWS Emulator</text>
	<path d="M170 474H290" stroke="#aab9c7" stroke-width="3"/>
	<text x="170" y="534" class="subtitle">Test AWS code locally</text>
	<text x="170" y="578" class="subtitle">with no AWS account</text>

	<!-- Faded AWS cloud, outside the machine and not connected -->
	<path d="M1196 236H1384A38 38 0 0 0 1390 160A56 56 0 0 0 1288 134A46 46 0 0 0 1214 168A34 34 0 0 0 1196 236Z" fill="#f8fafb" stroke="#b5c2cd" stroke-width="3" stroke-dasharray="10 8"/>
	<text x="1296" y="192" text-anchor="middle" font-size="26" font-weight="700" class="muted">AWS cloud</text>
	<text x="1296" y="220" text-anchor="middle" font-size="22" class="muted">not called</text>

	<!-- Laptop -->
	<rect x="840" y="280" width="580" height="404" rx="20" fill="#fff" stroke="#283541" stroke-width="3"/>
	<rect x="862" y="302" width="536" height="360" rx="10" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<path d="M822 690H1438L1466 718Q1470 726 1460 726H800Q790 726 794 718Z" fill="#fff" stroke="#283541" stroke-width="3" stroke-linejoin="round"/>
	<path d="M1080 690V698Q1080 702 1084 702H1176Q1180 702 1180 698V690" fill="none" stroke="#283541" stroke-width="2.5"/>

	<!-- Emulator header -->
	<text x="884" y="350" class="node-title">AWS Emulator</text>
	<rect x="882" y="366" width="232" height="42" rx="12" fill="#d8e7f2" stroke="#456987" stroke-width="2"/>
	<text x="998" y="395" text-anchor="middle" class="mono">127.0.0.1:9297</text>
	<text x="1378" y="350" text-anchor="end" class="detail">account</text>
	<text x="1378" y="395" text-anchor="end" class="mono" font-size="20">000000000000</text>
	<path d="M882 426H1378" stroke="#aab9c7" stroke-width="2"/>

	<!-- Service cards -->
	<rect x="882" y="444" width="152" height="196" rx="14" class="node"/>
	<rect x="1054" y="444" width="152" height="196" rx="14" class="node"/>
	<rect x="1226" y="444" width="152" height="196" rx="14" class="node"/>

	<!-- S3: generic bucket -->
	<path d="M914 474L926 534A32 9 0 0 0 990 534L1002 474" class="shape"/>
	<ellipse cx="958" cy="474" rx="44" ry="12" class="fillshape"/>
	<text x="958" y="580" text-anchor="middle" class="card-title">S3</text>
	<text x="958" y="612" text-anchor="middle" class="detail">bucket</text>

	<!-- DynamoDB: generic table -->
	<rect x="1086" y="470" width="88" height="70" rx="6" class="shape"/>
	<path d="M1086 476A6 6 0 0 1 1092 470H1168A6 6 0 0 1 1174 476V488H1086Z" class="fillshape"/>
	<path d="M1086 506H1174M1086 523H1174M1116 488V540" stroke="#283541" stroke-width="2"/>
	<text x="1130" y="580" text-anchor="middle" class="card-title">DynamoDB</text>
	<text x="1130" y="612" text-anchor="middle" class="detail">table</text>

	<!-- SQS: generic queue of messages -->
	<rect x="1252" y="482" width="100" height="46" rx="8" class="shape"/>
	<rect x="1264" y="493" width="20" height="24" rx="3" class="fillshape"/>
	<rect x="1292" y="493" width="20" height="24" rx="3" class="fillshape"/>
	<rect x="1320" y="493" width="20" height="24" rx="3" class="fillshape"/>
	<text x="1302" y="580" text-anchor="middle" class="card-title">SQS</text>
	<text x="1302" y="612" text-anchor="middle" class="detail">queue</text>
</svg>
