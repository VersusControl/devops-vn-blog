<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" role="img" aria-label="The AWS CLI, a pytest suite, and a GitHub Actions CI job each send AWS API calls to one local endpoint, https://127.0.0.1:9297. AWS Emulator answers from in-memory S3, DynamoDB, and SQS resources in account 000000000000 and writes its run files to ~/.aws/emulator/9297/. The AWS cloud is not called.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.flow{fill:none;stroke:#17212b;stroke-width:3;stroke-linecap:butt}
			.arrow{fill:#17212b}
			.muted{fill:#8696a6}
		</style>
	</defs>
	<rect width="760" height="424" fill="#fff"/>

	<!-- Zones -->
	<rect x="20" y="20" width="220" height="254" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="36" y="44" class="zone">CLIENTS</text>

	<rect x="330" y="20" width="410" height="384" rx="14" fill="#e9eff4" stroke="#aab9c7" stroke-width="2"/>
	<text x="350" y="44" class="zone">LOCALHOST</text>

	<rect x="20" y="294" width="220" height="110" rx="14" fill="#f8fafb" stroke="#c3ced8" stroke-width="2" stroke-dasharray="7 6"/>
	<text x="36" y="318" class="zone" style="fill:#8696a6">AWS CLOUD</text>

	<!-- Connectors: one shaft and one head per destination -->
	<text x="285" y="73" text-anchor="middle" class="detail">API calls</text>
	<path d="M224 86H331" class="flow"/>
	<path d="M342 86L330 80V92Z" class="arrow"/>
	<path d="M224 154H331" class="flow"/>
	<path d="M342 154L330 148V160Z" class="arrow"/>
	<path d="M224 222H331" class="flow"/>
	<path d="M342 222L330 216V228Z" class="arrow"/>

	<path d="M535 250V279" class="flow"/>
	<path d="M535 290L529 278H541Z" class="arrow"/>
	<text x="549" y="278" class="detail">writes at start</text>

	<!-- Client nodes -->
	<rect x="36" y="58" width="188" height="56" rx="12" class="node"/>
	<text x="52" y="82" class="title">AWS CLI</text>
	<text x="52" y="102" class="mono">$ aws s3 ls</text>

	<rect x="36" y="126" width="188" height="56" rx="12" class="node"/>
	<text x="52" y="150" class="title">pytest suite</text>
	<text x="52" y="170" class="mono">test_orders.py</text>

	<rect x="36" y="194" width="188" height="56" rx="12" class="node"/>
	<text x="52" y="218" class="title">GitHub Actions</text>
	<text x="52" y="238" class="detail">CI job on a runner</text>

	<!-- AWS Emulator -->
	<rect x="350" y="58" width="370" height="192" rx="14" class="primary"/>
	<text x="366" y="83" class="title" font-size="16">AWS Emulator</text>
	<text x="366" y="104" class="mono" font-size="13">https://127.0.0.1:9297</text>
	<path d="M366 118H704" stroke="#9fb6c9" stroke-width="1.5"/>
	<text x="366" y="139" class="zone" font-size="11" letter-spacing="1.2">IN-MEMORY RESOURCES</text>

	<rect x="366" y="150" width="106" height="56" rx="10" class="node"/>
	<text x="419" y="174" text-anchor="middle" class="title" font-size="14">S3</text>
	<text x="419" y="194" text-anchor="middle" class="detail">bucket</text>
	<rect x="482" y="150" width="106" height="56" rx="10" class="node"/>
	<text x="535" y="174" text-anchor="middle" class="title" font-size="14">DynamoDB</text>
	<text x="535" y="194" text-anchor="middle" class="detail">table</text>
	<rect x="598" y="150" width="106" height="56" rx="10" class="node"/>
	<text x="651" y="174" text-anchor="middle" class="title" font-size="14">SQS</text>
	<text x="651" y="194" text-anchor="middle" class="detail">queue</text>

	<text x="366" y="232" class="detail">account</text>
	<text x="418" y="232" class="mono">000000000000</text>

	<!-- Run files -->
	<rect x="350" y="298" width="370" height="90" rx="12" class="node"/>
	<text x="366" y="322" class="title">Run files</text>
	<text x="440" y="322" class="mono">~/.aws/emulator/9297/</text>
	<text x="366" y="348" class="mono">emulator_credentials</text>
	<text x="532" y="348" class="mono">config</text>
	<text x="596" y="348" class="mono">ca.pem</text>
	<text x="366" y="372" class="detail">new keys and certificate for each run</text>

	<!-- AWS cloud, not called: no connector reaches it -->
	<path d="M58 382H108A15 15 0 0 0 110 352A21 21 0 0 0 72 346A16 16 0 0 0 56 360A11 11 0 0 0 58 382Z" fill="#fff" stroke="#b5c2cd" stroke-width="2" stroke-dasharray="5 4"/>
	<path d="M60 340L110 388" stroke="#b5c2cd" stroke-width="2" stroke-linecap="round"/>
	<text x="134" y="358" class="title muted" style="fill:#7a8b9b">Not called</text>
	<text x="134" y="378" class="detail" style="fill:#8696a6">no request</text>
	<text x="134" y="394" class="detail" style="fill:#8696a6">reaches AWS</text>
</svg>
