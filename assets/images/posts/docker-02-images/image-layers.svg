<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="340" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="35" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Image Layers</text>
  
  <!-- Layer stack -->
  <g transform="translate(250,60)">
    <!-- Layer 4 -->
    <rect x="0" y="0" width="300" height="45" rx="6" fill="#f97316" opacity="0.8"/>
    <text x="150" y="22" fill="white" font-size="12" text-anchor="middle" font-weight="500">Layer 4: COPY app.js</text>
    <text x="150" y="38" fill="white" font-size="10" text-anchor="middle" opacity="0.8">2 KB</text>
    
    <!-- Layer 3 -->
    <rect x="0" y="55" width="300" height="45" rx="6" fill="#0ea5e9"/>
    <text x="150" y="77" fill="white" font-size="12" text-anchor="middle" font-weight="500">Layer 3: RUN npm install</text>
    <text x="150" y="93" fill="white" font-size="10" text-anchor="middle" opacity="0.8">45 MB</text>
    
    <!-- Layer 2 -->
    <rect x="0" y="110" width="300" height="45" rx="6" fill="#7c3aed"/>
    <text x="150" y="132" fill="white" font-size="12" text-anchor="middle" font-weight="500">Layer 2: Node.js Runtime</text>
    <text x="150" y="148" fill="white" font-size="10" text-anchor="middle" opacity="0.8">120 MB</text>
    
    <!-- Layer 1 (base) -->
    <rect x="0" y="165" width="300" height="45" rx="6" fill="#16a34a"/>
    <text x="150" y="187" fill="white" font-size="12" text-anchor="middle" font-weight="500">Layer 1: Alpine Linux</text>
    <text x="150" y="203" fill="white" font-size="10" text-anchor="middle" opacity="0.8">5 MB</text>
  </g>
  
  <!-- Annotations -->
  <g transform="translate(570,80)">
    <text x="0" y="0" fill="#f97316" font-size="11">← Changes often</text>
    <text x="0" y="60" fill="#0ea5e9" font-size="11">← Cached until</text>
    <text x="0" y="75" fill="#0ea5e9" font-size="11">   package.json changes</text>
    <text x="0" y="135" fill="#7c3aed" font-size="11">← Shared across images</text>
    <text x="0" y="190" fill="#16a34a" font-size="11">← Base layer</text>
  </g>
  
  <!-- Key insight -->
  <text x="400" y="300" fill="#6b7280" font-size="12" text-anchor="middle">Layers are cached and shared • Only changed layers are rebuilt</text>
  <text x="400" y="320" fill="#4b5563" font-size="11" text-anchor="middle">Order your Dockerfile: rarely-changing → frequently-changing</text>
</svg>