<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Container runtime security uses a non-root application process with a read-only filesystem, dropped capabilities, temporary files, and external secrets."><style>.t{font-family:Arial,sans-serif;fill:#12222f}.n{font-family:Arial,sans-serif;font-weight:700;fill:#12222f}.z{font-family:Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#5b6b78}.c{font-family:Menlo,monospace;font-size:13px;fill:#12222f}</style><rect width="760" height="330" fill="#fff"/><rect x="24" y="28" width="712" height="274" rx="14" fill="#f2f5f8"/><text x="46" y="56" class="z">CONTAINER RUNTIME CONTROLS</text><rect x="264" y="104" width="232" height="122" rx="14" fill="#bacfe3" stroke="#000" stroke-width="2"/><text x="286" y="140" class="n" font-size="20">Application</text><text x="286" y="168" class="c">USER 10001</text><text x="286" y="194" class="t" font-size="13">least privilege process</text><rect x="52" y="88" width="166" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="70" y="114" class="n" font-size="16">read only root</text><text x="70" y="136" class="c">read_only: true</text><rect x="52" y="184" width="166" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="70" y="210" class="n" font-size="16">temporary files</text><text x="70" y="232" class="c">tmpfs: /tmp</text><rect x="542" y="88" width="166" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="560" y="114" class="n" font-size="16">no capabilities</text><text x="560" y="136" class="c">cap_drop: ALL</text><rect x="542" y="184" width="166" height="60" rx="12" fill="#fff" stroke="#000" stroke-width="2"/><text x="560" y="210" class="n" font-size="16">external secret</text><text x="560" y="232" class="t" font-size="13">mounted at runtime</text><g stroke="#000" stroke-width="2" fill="none"><path d="M218 118H258"/><path d="M218 214H258"/><path d="M502 118H542"/><path d="M502 214H542"/></g></svg>