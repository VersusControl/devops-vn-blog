<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356" role="img" aria-label="Two rows comparing a request from a user in Tokyo to an ALB in Singapore. ALB only: the user opens TCP and TLS all the way to the ALB over the public internet, which takes several long round trips. CloudFront + ALB: the user's TCP and TLS 1.3 handshakes end at a nearby CloudFront edge location with short round trips, and the edge forwards the request to the ALB over the AWS network on a keep-alive connection that is already open.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.label-b{font-size:13px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.zone-box{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt;stroke-linejoin:round}
			.arrow{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="356" fill="#fff"/>
	<rect x="20" y="20" width="720" height="148" rx="14" class="zone-box"/>
	<text x="36" y="44" class="zone">ALB ONLY</text>
	<rect x="20" y="188" width="720" height="148" rx="14" class="zone-box"/>
	<text x="36" y="212" class="zone">CLOUDFRONT + ALB</text>
	<!-- request and response cross the public internet: long round trips -->
	<path d="M164 98.0H583" class="flow"/>
	<path d="M596 98.0L583 92.0V104.0Z" class="arrow"/>
	<path d="M596 118.0H177" class="flow"/>
	<path d="M164 118.0L177 112.0V124.0Z" class="arrow"/>
	<rect x="36" y="76" width="120" height="64" rx="12" class="node"/>
	<text x="96" y="105" text-anchor="middle" class="title">User</text>
	<text x="96" y="123" text-anchor="middle" class="detail">Tokyo</text>
	<rect x="604" y="76" width="120" height="64" rx="12" class="node"/>
	<text x="664" y="105" text-anchor="middle" class="title">ALB</text>
	<text x="664" y="123" text-anchor="middle" class="detail">Singapore</text>
	<text x="380" y="86" text-anchor="middle" class="label-b">TCP + TLS handshakes</text>
	<text x="380" y="142" text-anchor="middle" class="detail">several long round trips over the public internet</text>
	<!-- short round trips to the edge -->
	<path d="M164 266.0H255" class="flow"/>
	<path d="M268 266.0L255 260.0V272.0Z" class="arrow"/>
	<path d="M268 286.0H177" class="flow"/>
	<path d="M164 286.0L177 280.0V292.0Z" class="arrow"/>
	<!-- edge to ALB on an open connection -->
	<path d="M444 276.0H583" class="flow"/>
	<path d="M596 276.0L583 270.0V282.0Z" class="arrow"/>
	<rect x="36" y="244" width="120" height="64" rx="12" class="node"/>
	<text x="96" y="273" text-anchor="middle" class="title">User</text>
	<text x="96" y="291" text-anchor="middle" class="detail">Tokyo</text>
	<rect x="276" y="244" width="160" height="64" rx="12" class="primary"/>
	<text x="356" y="273" text-anchor="middle" class="title">CloudFront edge</text>
	<text x="356" y="291" text-anchor="middle" class="detail">near the user</text>
	<rect x="604" y="244" width="120" height="64" rx="12" class="node"/>
	<text x="664" y="273" text-anchor="middle" class="title">ALB</text>
	<text x="664" y="291" text-anchor="middle" class="detail">Singapore</text>
	<text x="216" y="254" text-anchor="middle" class="label-b">TCP + TLS 1.3</text>
	<text x="216" y="310" text-anchor="middle" class="detail">short round trips</text>
	<text x="520" y="264" text-anchor="middle" class="label-b">AWS network</text>
	<text x="520" y="300" text-anchor="middle" class="detail">keep-alive connection,</text>
	<text x="520" y="315" text-anchor="middle" class="detail">already open</text>
</svg>
