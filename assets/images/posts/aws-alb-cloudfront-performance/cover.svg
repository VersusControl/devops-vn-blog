<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-label="CloudFront in front of an Application Load Balancer, without caching. A user in Tokyo connects to a nearby CloudFront edge location, where the TCP and TLS 1.3 handshakes happen, and AWS WAF filters requests at the edge. The edge forwards the request over the AWS network on a reused keep-alive connection to the ALB in your VPC in Singapore, which can be a private ALB behind a VPC origin, and the ALB sends it to your app. Without CloudFront, the user makes long handshakes over the public internet straight to the ALB.">
<title>CloudFront + ALB: a user in Tokyo, a nearby CloudFront edge, the AWS network, and the ALB and app in your VPC in Singapore</title>
