<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="How the certificate reaches the gateway Envoy. The Gateway bookstore-gateway in namespace bookstore sets credentialName: bookstore-local-tls. That name resolves to the Secret bookstore-local-tls in istio-system, the gateway's namespace, which holds tls.crt and tls.key. istiod reads that Secret for the gateway and sends the certificate and key over SDS, the Secret Discovery Service, to the istio-agent in the istio-ingressgateway Pod, which hands it to the gateway Envoy. On your machine, istioctl proxy-config secret reads Envoy's config dump and shows kubernetes://bookstore-local-tls as ACTIVE. A Secret with the same name in namespace bookstore is not read.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone-label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.zone-note{font-size:12px;font-weight:700;fill:#456987}
			.title{font-size:15px;font-weight:700}
			.pod-title{font-size:14px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.label{font-size:12px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.mono-strong{font-family:Menlo,monospace;font-size:12px;font-weight:700;fill:#17212b}
			.mono-title{font-family:Menlo,monospace;font-size:14px;font-weight:700;fill:#17212b}
			.mono-cfg{font-family:Menlo,monospace;font-size:13px;font-weight:700;fill:#456987}
			.mono-cfg-detail{font-family:Menlo,monospace;font-size:12px;fill:#456987}
			.sds{font-family:Menlo,monospace;font-size:12px;font-weight:700;fill:#17212b}
			.off-title{font-size:15px;font-weight:700;fill:#8a99a8}
			.off-mono{font-family:Menlo,monospace;font-size:12px;fill:#8a99a8}
			.warn{font-size:12px;font-weight:700;fill:#17212b}
			.zone{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.pod{fill:#f5f7f9;stroke:#283541;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.proxy{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.cfg{fill:#fff;stroke:#456987;stroke-width:2;stroke-dasharray:6 4}
			.off{fill:#f5f7f9;stroke:#aab9c7;stroke-width:2;stroke-dasharray:6 4}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt}
			.arrow{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="520" fill="#fff"/>

	<!-- Zones -->
	<rect x="16" y="16" width="220" height="488" rx="14" class="zone"/>
	<text x="32" y="38" class="zone-label">BOOKSTORE</text>
	<rect x="252" y="16" width="492" height="356" rx="14" class="zone"/>
	<text x="268" y="38" class="zone-label">ISTIO-SYSTEM</text>
	<text x="728" y="38" text-anchor="end" class="zone-note">the gateway's namespace</text>
	<rect x="252" y="388" width="492" height="116" rx="14" class="zone"/>
	<text x="268" y="410" class="zone-label">YOUR MACHINE</text>

	<!-- Gateway Pod container -->
	<rect x="276" y="196" width="444" height="136" rx="14" class="pod"/>
	<text x="292" y="218" class="pod-title">gateway Pod</text>
	<text x="386" y="218" class="mono">istio-ingressgateway</text>

	<!-- Connectors: each relationship has its own shaft and head -->
	<!-- credentialName resolves to the Secret in istio-system -->
	<path d="M220 106H256" class="flow"/>
	<path d="M268 106L256 100V112Z" class="arrow"/>
	<!-- istiod reads the Secret -->
	<path d="M476 106H510" class="flow"/>
	<path d="M522 106L510 100V112Z" class="arrow"/>
	<text x="499" y="94" text-anchor="middle" class="label">read</text>
	<!-- istiod sends cert and key to the agent -->
	<path d="M620 156V216" class="flow"/>
	<path d="M620 228L614 216H626Z" class="arrow"/>
	<text x="632" y="182" class="label">cert + key</text>
	<!-- agent hands it to Envoy over SDS -->
	<path d="M540 273H496" class="flow"/>
	<path d="M484 273L496 267V279Z" class="arrow"/>
	<text x="510" y="261" text-anchor="middle" class="sds">SDS</text>
	<!-- istioctl reads what Envoy holds -->
	<path d="M386 310V412" class="flow"/>
	<path d="M386 424L380 412H392Z" class="arrow"/>
	<text x="398" y="356" class="label">config dump</text>

	<!-- BOOKSTORE: Gateway object -->
	<rect x="32" y="56" width="188" height="100" rx="12" class="cfg"/>
	<text x="126" y="82" text-anchor="middle" class="mono-cfg">Gateway</text>
	<text x="126" y="102" text-anchor="middle" class="mono-cfg-detail">bookstore-gateway</text>
	<text x="126" y="122" text-anchor="middle" class="mono">credentialName:</text>
	<text x="126" y="140" text-anchor="middle" class="mono-strong">bookstore-local-tls</text>

	<!-- BOOKSTORE: same-named Secret that is never read -->
	<rect x="32" y="236" width="188" height="94" rx="12" class="off"/>
	<text x="126" y="262" text-anchor="middle" class="off-title">Secret</text>
	<text x="126" y="282" text-anchor="middle" class="off-mono">bookstore-local-tls</text>
	<path d="M57 278H195" stroke="#8a99a8" stroke-width="1.5"/>
	<circle cx="56" cy="308" r="10" fill="#17212b"/>
	<path d="M51.5 303.5L60.5 312.5M60.5 303.5L51.5 312.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
	<text x="72" y="312" class="warn">not read</text>
	<text x="126" y="356" text-anchor="middle" class="detail">wrong namespace for</text>
	<text x="126" y="373" text-anchor="middle" class="detail">the gateway</text>

	<!-- ISTIO-SYSTEM: the Secret that is read -->
	<rect x="276" y="56" width="200" height="100" rx="12" class="primary"/>
	<text x="376" y="88" text-anchor="middle" class="title">Secret</text>
	<text x="376" y="110" text-anchor="middle" class="mono-strong">bookstore-local-tls</text>
	<text x="376" y="130" text-anchor="middle" class="mono">tls.crt  tls.key</text>

	<!-- ISTIO-SYSTEM: istiod -->
	<rect x="530" y="56" width="180" height="100" rx="12" class="node"/>
	<text x="620" y="88" text-anchor="middle" class="mono-title">istiod</text>
	<text x="620" y="110" text-anchor="middle" class="detail">reads Secrets the</text>
	<text x="620" y="128" text-anchor="middle" class="detail">gateway may use</text>

	<!-- Gateway Pod: Envoy and istio-agent -->
	<rect x="296" y="236" width="180" height="74" rx="12" class="proxy"/>
	<text x="386" y="266" text-anchor="middle" class="title">gateway Envoy</text>
	<text x="386" y="288" text-anchor="middle" class="detail">presents the cert on</text>
	<text x="386" y="304" text-anchor="middle" class="mono">:8443</text>

	<rect x="540" y="236" width="160" height="74" rx="12" class="node"/>
	<text x="620" y="266" text-anchor="middle" class="mono-title">istio-agent</text>
	<text x="620" y="288" text-anchor="middle" class="detail">relays SDS</text>
	<text x="620" y="304" text-anchor="middle" class="detail">to Envoy</text>

	<!-- YOUR MACHINE: what Envoy received -->
	<rect x="276" y="432" width="444" height="60" rx="12" class="node"/>
	<text x="292" y="456" class="mono-title">istioctl proxy-config secret</text>
	<text x="292" y="478"><tspan class="mono">kubernetes://bookstore-local-tls</tspan><tspan class="mono-strong" dx="16">ACTIVE</tspan></text>
</svg>
