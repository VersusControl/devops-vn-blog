<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="CI publishes a versioned image tag to a registry. The registry resolves an immutable digest, which production deploys.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5 0 10z" fill="#000"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-weight: 700; fill: #12222f; }
      .body { font-family: Arial, sans-serif; fill: #12222f; }
      .zone { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #5b6b78; }
      .code { font-family: Menlo, monospace; font-size: 12px; fill: #12222f; }
    </style>
  </defs>

  <rect width="760" height="330" fill="#fff"/>
  <rect x="24" y="28" width="712" height="274" rx="14" fill="#f2f5f8"/>
  <text x="46" y="56" class="zone">RELEASE DELIVERY CONTRACT</text>

  <rect x="54" y="118" width="170" height="88" rx="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="74" y="150" class="title" font-size="18">CI build</text>
  <text x="74" y="176" class="code">sha-3d9e2b7</text>

  <rect x="294" y="94" width="172" height="136" rx="12" fill="#bacfe3" stroke="#000" stroke-width="2"/>
  <text x="316" y="128" class="title" font-size="18">registry</text>
  <text x="316" y="156" class="code">task-api:1.4.0</text>
  <line x1="316" y1="174" x2="444" y2="174" stroke="#9aa9b6"/>
  <text x="316" y="202" class="code">sha256:ab12...9f</text>

  <rect x="536" y="118" width="170" height="88" rx="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="556" y="150" class="title" font-size="18">production</text>
  <text x="556" y="176" class="body" font-size="13">deploy by digest</text>

  <g fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#a)">
    <path d="M224 162H288"/>
    <path d="M466 162H530"/>
  </g>
</svg>
