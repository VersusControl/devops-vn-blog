<svg xmlns="http://www.w3.org/2000/svg" width="760" height="756" viewBox="0 0 760 756" role="img" aria-label="Setup flow, run from your laptop with the AWS CLI. Optional step 0: scripts/run-local.sh validates and serves the Envoy config in Docker on Envoy 1.40, at localhost:18080. Step 1: scripts/01-iam.sh creates the IAM proxy role that writes logs to /aws/elb-proxy/*. Step 2: scripts/02-network.sh picks two default subnets in two Availability Zones and creates a security group that allows port 80 from your IP, saved in network.json. Step 3: create-proxy with config.yaml, then poll get-proxy until the proxy is active. Step 4: update-proxy-configuration with config-v2.yaml, which adds a Lua API key check and a rate limit, then poll get-proxy-update until it is complete. Step 5: read Envoy logs in CloudWatch Logs and metrics in the AWS/ProxyELB namespace. Clean up: scripts/cleanup.sh deletes the proxy, security group, role, and log group.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.sans{font-family:Arial,sans-serif}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.badge-text{font-size:13px;font-weight:700;fill:#fff}
			.badge-text-dark{font-size:13px;font-weight:700;fill:#17212b}
			.zone-box{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.optional{fill:#fff;stroke:#283541;stroke-width:2;stroke-dasharray:7 5}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.badge{fill:#17212b}
			.badge-open{fill:#fff;stroke:#17212b;stroke-width:2}
			.divider{stroke:#aab9c7;stroke-width:1.5}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt}
			.arrow{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="756" fill="#fff"/>

	<!-- Zones -->
	<rect x="20" y="20" width="720" height="106" rx="14" class="zone-box"/>
	<text x="104" y="44" class="zone">OPTIONAL LOCAL CHECK</text>
	<text x="724" y="44" text-anchor="end" class="detail">Docker on your laptop</text>

	<rect x="20" y="146" width="720" height="590" rx="14" class="zone-box"/>
	<text x="104" y="170" class="zone">AWS ACCOUNT</text>
	<text x="724" y="170" text-anchor="end" class="mono">ap-southeast-1</text>

	<!-- Connectors between steps -->
	<path d="M72 110V164" class="flow"/>
	<path d="M72 176L66 164H78Z" class="arrow"/>
	<path d="M72 238V260" class="flow"/>
	<path d="M72 272L66 260H78Z" class="arrow"/>
	<path d="M72 334V356" class="flow"/>
	<path d="M72 368L66 356H78Z" class="arrow"/>
	<path d="M72 430V452" class="flow"/>
	<path d="M72 464L66 452H78Z" class="arrow"/>
	<path d="M72 526V548" class="flow"/>
	<path d="M72 560L66 548H78Z" class="arrow"/>
	<path d="M72 622V644" class="flow"/>
	<path d="M72 656L66 644H78Z" class="arrow"/>

	<!-- Step 0 -->
	<rect x="40" y="56" width="680" height="54" rx="12" class="optional"/>
	<circle cx="72" cy="83" r="14" class="badge-open"/>
	<text x="72" y="88" text-anchor="middle" class="badge-text-dark">0</text>
	<text x="104" y="78" class="title">Run the config locally</text>
	<text x="104" y="97" class="mono">scripts/run-local.sh</text>
	<path d="M450 66V100" class="divider"/>
	<text x="466" y="78" class="detail">validate and serve on Envoy 1.40</text>
	<text x="466" y="97" class="detail">in Docker at <tspan class="mono">localhost:18080</tspan></text>

	<!-- Step 1 -->
	<rect x="40" y="184" width="680" height="54" rx="12" class="node"/>
	<circle cx="72" cy="211" r="14" class="badge"/>
	<text x="72" y="216" text-anchor="middle" class="badge-text">1</text>
	<text x="104" y="206" class="title">Proxy role</text>
	<text x="104" y="225" class="mono">scripts/01-iam.sh</text>
	<path d="M450 194V228" class="divider"/>
	<text x="466" y="206" class="detail">IAM role the proxy assumes</text>
	<text x="466" y="225" class="detail">writes logs to <tspan class="mono">/aws/elb-proxy/*</tspan></text>

	<!-- Step 2 -->
	<rect x="40" y="280" width="680" height="54" rx="12" class="node"/>
	<circle cx="72" cy="307" r="14" class="badge"/>
	<text x="72" y="312" text-anchor="middle" class="badge-text">2</text>
	<text x="104" y="302" class="title">Subnets and security group</text>
	<text x="104" y="321" class="mono">scripts/02-network.sh</text>
	<path d="M450 290V324" class="divider"/>
	<text x="466" y="302" class="detail">two default subnets in two AZs</text>
	<text x="466" y="321" class="detail">port 80 from your IP, in <tspan class="mono">network.json</tspan></text>

	<!-- Step 3 -->
	<rect x="40" y="376" width="680" height="54" rx="12" class="primary"/>
	<circle cx="72" cy="403" r="14" class="badge"/>
	<text x="72" y="408" text-anchor="middle" class="badge-text">3</text>
	<text x="104" y="398" class="title">Create the proxy</text>
	<text x="104" y="417" class="mono">create-proxy<tspan class="detail sans" dx="6">with</tspan><tspan dx="6">config.yaml</tspan></text>
	<path d="M450 386V420" class="divider"/>
	<text x="466" y="398" class="detail">poll <tspan class="mono">get-proxy</tspan> every 15 s</text>
	<text x="466" y="417" class="detail">until the status is <tspan class="mono">active</tspan></text>

	<!-- Step 4 -->
	<rect x="40" y="472" width="680" height="54" rx="12" class="node"/>
	<circle cx="72" cy="499" r="14" class="badge"/>
	<text x="72" y="504" text-anchor="middle" class="badge-text">4</text>
	<text x="104" y="494" class="title">Update the configuration</text>
	<text x="104" y="513" class="mono">update-proxy-configuration<tspan class="detail sans" dx="6">with</tspan><tspan dx="6">config-v2.yaml</tspan></text>
	<path d="M450 482V516" class="divider"/>
	<text x="466" y="494" class="detail">Lua API key check plus rate limit</text>
	<text x="466" y="513" class="detail">poll <tspan class="mono">get-proxy-update</tspan> until complete</text>

	<!-- Step 5 -->
	<rect x="40" y="568" width="680" height="54" rx="12" class="node"/>
	<circle cx="72" cy="595" r="14" class="badge"/>
	<text x="72" y="600" text-anchor="middle" class="badge-text">5</text>
	<text x="104" y="590" class="title">Logs and metrics</text>
	<text x="104" y="609" class="mono">aws logs tail</text>
	<path d="M450 578V612" class="divider"/>
	<text x="466" y="590" class="detail">Envoy logs in CloudWatch Logs</text>
	<text x="466" y="609" class="detail">metrics in <tspan class="mono">AWS/ProxyELB</tspan></text>

	<!-- Clean up -->
	<rect x="40" y="664" width="680" height="54" rx="12" class="node"/>
	<circle cx="72" cy="691" r="14" class="badge-open"/>
	<rect x="66" y="685" width="12" height="12" rx="2" class="badge"/>
	<text x="104" y="686" class="title">Clean up</text>
	<text x="104" y="705" class="mono">scripts/cleanup.sh</text>
	<path d="M450 674V708" class="divider"/>
	<text x="466" y="686" class="detail">deletes the proxy, security group,</text>
	<text x="466" y="705" class="detail">proxy role, and log group</text>
</svg>
