<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="400" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="35" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Multi-Stage Build</text>
  
  <!-- Stage 1: Build -->
  <g transform="translate(50,60)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <text x="150" y="-10" fill="#7c3aed" font-size="13" font-weight="600" text-anchor="middle">Stage 1: BUILD</text>
    
    <rect x="15" y="20" width="270" height="30" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="150" y="40" fill="#a78bfa" font-size="11" text-anchor="middle">FROM golang:1.22 AS builder</text>
    
    <rect x="15" y="60" width="270" height="25" rx="4" fill="#475569"/>
    <text x="150" y="78" fill="white" font-size="10" text-anchor="middle">Go compiler &amp; tools (500MB)</text>
    
    <rect x="15" y="90" width="270" height="25" rx="4" fill="#64748b"/>
    <text x="150" y="108" fill="white" font-size="10" text-anchor="middle">Source code</text>
    
    <rect x="15" y="120" width="270" height="25" rx="4" fill="#0ea5e9"/>
    <text x="150" y="138" fill="white" font-size="10" text-anchor="middle">RUN go build -o app</text>
    
    <rect x="100" y="150" width="100" height="20" rx="3" fill="#16a34a"/>
    <text x="150" y="164" fill="white" font-size="9" text-anchor="middle">Binary: 15MB</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(360,150)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#2496ED" stroke-width="2"/>
    <polygon points="70,0 60,-6 60,6" fill="#2496ED"/>
    <text x="35" y="-10" fill="#6b7280" font-size="10" text-anchor="middle">COPY --from</text>
  </g>
  
  <!-- Stage 2: Run -->
  <g transform="translate(450,60)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="150" y="-10" fill="#16a34a" font-size="13" font-weight="600" text-anchor="middle">Stage 2: RUN</text>
    
    <rect x="15" y="20" width="270" height="30" rx="4" fill="#16a34a" opacity="0.3"/>
    <text x="150" y="40" fill="#4ade80" font-size="11" text-anchor="middle">FROM alpine:3.19</text>
    
    <rect x="15" y="60" width="270" height="25" rx="4" fill="#475569"/>
    <text x="150" y="78" fill="white" font-size="10" text-anchor="middle">Alpine base (5MB)</text>
    
    <rect x="15" y="95" width="270" height="25" rx="4" fill="#16a34a"/>
    <text x="150" y="113" fill="white" font-size="10" text-anchor="middle">COPY --from=builder /app/app .</text>
    
    <rect x="100" y="130" width="100" height="25" rx="4" fill="#2496ED"/>
    <text x="150" y="148" fill="white" font-size="10" text-anchor="middle">Final: 20MB</text>
  </g>
  
  <!-- Comparison -->
  <g transform="translate(100,280)">
    <rect x="0" y="0" width="200" height="40" rx="4" fill="#dc2626" opacity="0.2"/>
    <text x="100" y="25" fill="#ef4444" font-size="12" text-anchor="middle">Without multi-stage: ~800MB</text>
  </g>
  
  <g transform="translate(500,280)">
    <rect x="0" y="0" width="200" height="40" rx="4" fill="#16a34a" opacity="0.2"/>
    <text x="100" y="25" fill="#4ade80" font-size="12" text-anchor="middle">With multi-stage: ~20MB</text>
  </g>
  
  <text x="400" y="360" fill="#6b7280" font-size="12" text-anchor="middle">Build tools stay in Stage 1 • Only the binary goes to production</text>
</svg>