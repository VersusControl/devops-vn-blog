<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="280" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="30" fill="#9aa4b2" font-size="16" font-weight="600" text-anchor="middle">Dockerfile Layer Caching</text>
  
  <!-- Bad example -->
  <g transform="translate(50,55)">
    <text x="150" y="0" fill="#ef4444" font-size="13" font-weight="600" text-anchor="middle">❌ Bad Order</text>
    
    <rect x="0" y="15" width="300" height="28" rx="4" fill="#64748b"/>
    <text x="150" y="34" fill="white" font-size="10" text-anchor="middle" font-family="monospace">COPY . .</text>
    <text x="310" y="34" fill="#ef4444" font-size="9">← any change</text>
    
    <rect x="0" y="48" width="300" height="28" rx="4" fill="#ef4444" opacity="0.5"/>
    <text x="150" y="67" fill="white" font-size="10" text-anchor="middle" font-family="monospace">RUN npm install</text>
    <text x="310" y="67" fill="#ef4444" font-size="9">← rebuilds!</text>
    
    <rect x="0" y="81" width="300" height="28" rx="4" fill="#ef4444" opacity="0.5"/>
    <text x="150" y="100" fill="white" font-size="10" text-anchor="middle" font-family="monospace">RUN npm build</text>
    <text x="310" y="100" fill="#ef4444" font-size="9">← rebuilds!</text>
    
    <text x="150" y="145" fill="#6b7280" font-size="11" text-anchor="middle">Every code change reinstalls deps</text>
  </g>
  
  <!-- Good example -->
  <g transform="translate(450,55)">
    <text x="150" y="0" fill="#4ade80" font-size="13" font-weight="600" text-anchor="middle">✓ Good Order</text>
    
    <rect x="0" y="15" width="300" height="28" rx="4" fill="#16a34a" opacity="0.5"/>
    <text x="150" y="34" fill="white" font-size="10" text-anchor="middle" font-family="monospace">COPY package*.json .</text>
    <text x="310" y="34" fill="#4ade80" font-size="9">← rarely changes</text>
    
    <rect x="0" y="48" width="300" height="28" rx="4" fill="#16a34a" opacity="0.5"/>
    <text x="150" y="67" fill="white" font-size="10" text-anchor="middle" font-family="monospace">RUN npm install</text>
    <text x="310" y="67" fill="#4ade80" font-size="9">← cached!</text>
    
    <rect x="0" y="81" width="300" height="28" rx="4" fill="#64748b"/>
    <text x="150" y="100" fill="white" font-size="10" text-anchor="middle" font-family="monospace">COPY . .</text>
    <text x="310" y="100" fill="#6b7280" font-size="9">← only this rebuilds</text>
    
    <text x="150" y="145" fill="#6b7280" font-size="11" text-anchor="middle">Dependencies cached until package.json changes</text>
  </g>
  
  <text x="400" y="230" fill="#6b7280" font-size="12" text-anchor="middle">Rule: Put rarely-changing instructions first</text>
  <text x="400" y="250" fill="#4b5563" font-size="11" text-anchor="middle">Dependencies → Source code → Configuration</text>
</svg>