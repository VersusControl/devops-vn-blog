<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" role="img" aria-label="Three goals of cloud standards. Interoperability, systems can work together: one monitoring tool collects data from AWS, Azure, and Google Cloud. Portability, things can move: one container image in the OCI image format runs on a Kubernetes cluster in AWS, Azure, or Google Cloud. Security, you can compare and trust: the same CSA Cloud Controls Matrix is checked against AWS, Azure, and Google Cloud, so providers can be compared on the same terms.">
<defs>
	<style>
		text{font-family:'Helvetica Neue', Arial, sans-serif;fill:#17212b}
		.title{font-size:17px;font-weight:700}
		.ntitle{font-size:15px;font-weight:700}
		.sname{font-size:14px;font-weight:700}
		.sdet{font-size:13px;font-weight:400;fill:#526579}
		.detail{font-size:13px;fill:#526579}
		.note{font-size:13px;fill:#17212b}
		.rule{fill:none;stroke:#aab9c7;stroke-width:1.5}
		.zone-box{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
		.node{fill:#fff;stroke:#283541;stroke-width:2}
		.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
		.flow{fill:none;stroke:#17212b;stroke-width:2.5}
		.arrow{fill:#17212b}
		.check{fill:none;stroke:#2f5f8a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
	</style>
</defs>
<rect width="760" height="518" fill="#fff"/>
<rect x="20" y="20" width="720" height="150" rx="14" class="zone-box"/>
<text x="40.0" y="62.0" class="title">Interoperability</text>
<text x="40.0" y="84.0" class="detail">Systems can work together</text>
<path d="M40 102H238" class="rule"/>
<text x="40.0" y="124.0" class="note">One monitoring tool collects</text>
<text x="40.0" y="142.0" class="note">from three clouds</text>
<path d="M262 40V150" class="rule"/>
<rect x="534.0" y="38.0" width="186.0" height="114.0" rx="12" class="primary"/>
<text x="627.0" y="93.0" class="ntitle" text-anchor="middle">Monitoring tool</text>
<text x="627.0" y="113.0" class="detail" text-anchor="middle">collects data</text>
<rect x="290.0" y="38.0" width="160.0" height="32.0" rx="12" class="node"/>
<text x="370.0" y="59.0" class="sname" text-anchor="middle">AWS</text>
<path d="M454.0 54.0H513.0" class="flow"/>
<path d="M526.0 54.0L513.0 48.0L513.0 60.0Z" class="arrow"/>
<rect x="290.0" y="79.0" width="160.0" height="32.0" rx="12" class="node"/>
<text x="370.0" y="100.0" class="sname" text-anchor="middle">Azure</text>
<path d="M454.0 95.0H513.0" class="flow"/>
<path d="M526.0 95.0L513.0 89.0L513.0 101.0Z" class="arrow"/>
<rect x="290.0" y="120.0" width="160.0" height="32.0" rx="12" class="node"/>
<text x="370.0" y="141.0" class="sname" text-anchor="middle">Google Cloud</text>
<path d="M454.0 136.0H513.0" class="flow"/>
<path d="M526.0 136.0L513.0 130.0L513.0 142.0Z" class="arrow"/>
<rect x="20" y="184" width="720" height="150" rx="14" class="zone-box"/>
<text x="40.0" y="226.0" class="title">Portability</text>
<text x="40.0" y="248.0" class="detail">Things can move</text>
<path d="M40 266H238" class="rule"/>
<text x="40.0" y="288.0" class="note">One container image runs</text>
<text x="40.0" y="306.0" class="note">on any Kubernetes cluster</text>
<path d="M262 204V314" class="rule"/>
<rect x="290.0" y="202.0" width="160.0" height="114.0" rx="12" class="primary"/>
<text x="370.0" y="257.0" class="ntitle" text-anchor="middle">Container image</text>
<text x="370.0" y="277.0" class="detail" text-anchor="middle">OCI image format</text>
<rect x="534.0" y="202.0" width="186.0" height="32.0" rx="12" class="node"/>
<text x="589.2" y="223.0" class="sname">AWS<tspan class="sdet" dx="5.0">cluster</tspan></text>
<path d="M454.0 218.0H513.0" class="flow"/>
<path d="M526.0 218.0L513.0 212.0L513.0 224.0Z" class="arrow"/>
<rect x="534.0" y="243.0" width="186.0" height="32.0" rx="12" class="node"/>
<text x="585.8" y="264.0" class="sname">Azure<tspan class="sdet" dx="5.0">cluster</tspan></text>
<path d="M454.0 259.0H513.0" class="flow"/>
<path d="M526.0 259.0L513.0 253.0L513.0 265.0Z" class="arrow"/>
<rect x="534.0" y="284.0" width="186.0" height="32.0" rx="12" class="node"/>
<text x="559.4" y="305.0" class="sname">Google Cloud<tspan class="sdet" dx="5.0">cluster</tspan></text>
<path d="M454.0 300.0H513.0" class="flow"/>
<path d="M526.0 300.0L513.0 294.0L513.0 306.0Z" class="arrow"/>
<rect x="20" y="348" width="720" height="150" rx="14" class="zone-box"/>
<text x="40.0" y="390.0" class="title">Security</text>
<text x="40.0" y="412.0" class="detail">You can compare and trust</text>
<path d="M40 430H238" class="rule"/>
<text x="40.0" y="452.0" class="note">Providers mapped to the CSA</text>
<text x="40.0" y="470.0" class="note">Cloud Controls Matrix</text>
<path d="M262 368V478" class="rule"/>
<rect x="290.0" y="366.0" width="160.0" height="114.0" rx="12" class="primary"/>
<text x="370.0" y="419.0" class="ntitle" text-anchor="middle">Cloud Controls</text>
<text x="370.0" y="439.0" class="ntitle" text-anchor="middle">Matrix (CCM)</text>
<rect x="534.0" y="366.0" width="186.0" height="32.0" rx="12" class="node"/>
<text x="619.0" y="387.0" class="sname" text-anchor="middle">AWS</text>
<path d="M688.0 382.0L692.5 387.0L701.0 376.5" class="check"/>
<path d="M454.0 382.0H513.0" class="flow"/>
<path d="M526.0 382.0L513.0 376.0L513.0 388.0Z" class="arrow"/>
<rect x="534.0" y="407.0" width="186.0" height="32.0" rx="12" class="node"/>
