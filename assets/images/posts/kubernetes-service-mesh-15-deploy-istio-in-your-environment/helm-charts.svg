<svg xmlns="http://www.w3.org/2000/svg" width="760" height="576" viewBox="0 0 760 576" role="img" aria-label="The three Istio Helm charts, one row each, from values to chart to what the release installs. The base chart takes no values file, only defaultRevision set to empty, and is released as istio-base; it installs the Istio CRDs at cluster scope, once per cluster. The istiod chart, in folder istio-control/istio-discovery, takes istiod-values.yaml with 2 to 3 replicas and access logs plus a revision flag; each release installs one control plane revision in namespace istio-system, istiod-1-31 on 1.31.4 and istiod-1-32 on 1.32.0, each with a Deployment, Service, HPA, PDB, and injection webhook. The gateway chart takes gateway-values.yaml with 2 to 3 replicas, a PDB, and NodePort on Kind, is released as istio-ingress, and installs the ingress gateway Deployment, Service, HPA, and PDB in its own namespace istio-ingress, with Pods labeled istio: ingress.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.head{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.zone-label{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.mono-muted{font-family:Menlo,monospace;font-size:12px;fill:#526579}
			.mono-title{font-family:Menlo,monospace;font-size:15px;font-weight:700;fill:#17212b}
			.mono-b{font-family:Menlo,monospace;font-size:13px;font-weight:700;fill:#17212b}
			.mono-file{font-family:Menlo,monospace;font-size:12px;font-weight:700;fill:#17212b}
			.zone{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.cfg{fill:#fff;stroke:#456987;stroke-width:2;stroke-dasharray:8 5}
			.cfg-off{fill:#fff;stroke:#aab9c7;stroke-width:2;stroke-dasharray:8 5}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt;stroke-linejoin:round}
			.arrow{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="576" fill="#fff"/>

	<!-- Column headers -->
	<text x="16" y="30" class="head">VALUES</text>
	<text x="216" y="30" class="head">HELM CHART</text>
	<text x="392" y="30" class="head">WHAT EACH RELEASE INSTALLS</text>

	<!-- Zones: where each release puts its resources -->
	<rect x="392" y="48" width="352" height="116" rx="14" class="zone"/>
	<text x="408" y="70" class="zone-label">CLUSTER SCOPE</text>
	<rect x="392" y="184" width="352" height="240" rx="14" class="zone"/>
	<text x="408" y="206" class="zone-label">ISTIO-SYSTEM</text>
	<rect x="392" y="444" width="352" height="116" rx="14" class="zone"/>
	<text x="408" y="466" class="zone-label">ISTIO-INGRESS</text>

	<!-- Connectors: values to chart -->
	<path d="M176 116H196" class="flow"/>
	<path d="M208 116L196 110V122Z" class="arrow"/>
	<path d="M176 314H196" class="flow"/>
	<path d="M208 314L196 308V320Z" class="arrow"/>
	<path d="M176 512H196" class="flow"/>
	<path d="M208 512L196 506V518Z" class="arrow"/>

	<!-- Connectors: chart to installed resources; istiod branches, one release per revision -->
	<path d="M368 116H420" class="flow"/>
	<path d="M432 116L420 110V122Z" class="arrow"/>
	<path d="M368 314H408V264H420" class="flow"/>
	<path d="M432 264L420 258V270Z" class="arrow"/>
	<path d="M408 314V364H420" class="flow"/>
	<path d="M432 364L420 358V370Z" class="arrow"/>
	<path d="M368 512H420" class="flow"/>
	<path d="M432 512L420 506V518Z" class="arrow"/>

	<!-- Row 1: base -->
	<rect x="16" y="84" width="160" height="64" rx="12" class="cfg-off"/>
	<text x="96" y="110" text-anchor="middle" class="detail">no values file, only</text>
	<text x="96" y="130" text-anchor="middle" class="mono">defaultRevision=""</text>

	<rect x="216" y="78" width="152" height="76" rx="12" class="primary"/>
	<text x="292" y="102" text-anchor="middle" class="mono-title">base</text>
	<text x="292" y="124" text-anchor="middle" class="detail">release</text>
	<text x="292" y="142" text-anchor="middle" class="mono">istio-base</text>

	<rect x="440" y="84" width="288" height="64" rx="12" class="node"/>
	<text x="456" y="108" class="title">CRDs</text>
	<text x="712" y="108" text-anchor="end" class="detail">once per cluster</text>
	<text x="456" y="132" class="detail">Gateway, VirtualService, and the rest</text>

	<!-- Row 2: istiod -->
	<rect x="16" y="274" width="160" height="80" rx="12" class="cfg"/>
	<text x="96" y="298" text-anchor="middle" class="mono-file">istiod-values.yaml</text>
	<text x="96" y="318" text-anchor="middle" class="detail">2-3 replicas, access logs</text>
	<text x="96" y="338" text-anchor="middle" class="mono">--set revision</text>

	<rect x="216" y="242" width="152" height="144" rx="12" class="primary"/>
	<text x="292" y="268" text-anchor="middle" class="mono-title">istiod</text>
	<text x="292" y="290" text-anchor="middle" class="mono-muted">istio-control/</text>
	<text x="292" y="306" text-anchor="middle" class="mono-muted">istio-discovery</text>
	<text x="292" y="332" text-anchor="middle" class="detail">releases</text>
	<text x="292" y="350" text-anchor="middle" class="mono">istiod-1-31</text>
	<text x="292" y="368" text-anchor="middle" class="mono">istiod-1-32</text>

	<rect x="440" y="220" width="288" height="88" rx="12" class="node"/>
	<text x="456" y="244" class="mono-b">istiod-1-31</text>
	<text x="712" y="244" text-anchor="end" class="mono-muted">1.31.4</text>
	<text x="456" y="270" class="detail">Deployment, Service, HPA, PDB</text>
	<text x="456" y="290" class="detail">injection webhook</text>

	<rect x="440" y="320" width="288" height="88" rx="12" class="node"/>
	<text x="456" y="344" class="mono-b">istiod-1-32</text>
	<text x="712" y="344" text-anchor="end" class="mono-muted">1.32.0</text>
	<text x="456" y="370" class="detail">Deployment, Service, HPA, PDB</text>
	<text x="456" y="390" class="detail">injection webhook</text>

	<!-- Row 3: gateway -->
	<rect x="16" y="472" width="160" height="80" rx="12" class="cfg"/>
	<text x="96" y="496" text-anchor="middle" class="mono-file">gateway-values.yaml</text>
	<text x="96" y="516" text-anchor="middle" class="detail">2-3 replicas, PDB</text>
	<text x="96" y="536" text-anchor="middle" class="detail">NodePort on Kind</text>

	<rect x="216" y="474" width="152" height="76" rx="12" class="primary"/>
	<text x="292" y="498" text-anchor="middle" class="mono-title">gateway</text>
	<text x="292" y="520" text-anchor="middle" class="detail">release</text>
	<text x="292" y="538" text-anchor="middle" class="mono">istio-ingress</text>

	<rect x="440" y="480" width="288" height="64" rx="12" class="node"/>
	<text x="456" y="504" class="title">ingress gateway</text>
	<text x="712" y="504" text-anchor="end" class="mono-muted">istio: ingress</text>
	<text x="456" y="528" class="detail">Deployment, Service, HPA, PDB</text>
</svg>
