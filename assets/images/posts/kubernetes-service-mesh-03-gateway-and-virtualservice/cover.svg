<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Kubernetes Advanced: Service Mesh, Chapter 3 cover: Ingress Gateway. A browser outside the mesh sends a request to the ingress gateway, which sits in the mesh boundary like a door. A Gateway object and a VirtualService object configure the gateway, which routes /productpage to the Envoy sidecar of the productpage app inside the mesh.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.series{font-size:28px;font-weight:700;fill:#526579}
			.chapter{font-size:28px;fill:#526579}
			.title{font-size:80px;font-weight:700}
			.subtitle{font-size:32px;fill:#526579}
			.zone{font-size:16px;font-weight:700;letter-spacing:2.5px;fill:#526579}
			.node-title{font-size:30px;font-weight:700}
			.card-title{font-size:26px;font-weight:700}
			.proxy-title{font-size:24px;font-weight:700}
			.detail{font-size:20px;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:20px;fill:#263746}
			.mono-cfg{font-family:Menlo,monospace;font-size:18px;fill:#456987}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.proxy{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.cfg{fill:#fff;stroke:#456987;stroke-width:2;stroke-dasharray:10 6}
			.flow{fill:none;stroke:#17212b;stroke-width:4;stroke-linecap:butt;stroke-linejoin:round}
			.config{fill:none;stroke:#456987;stroke-width:3;stroke-dasharray:9 6;stroke-linecap:butt}
			.arrow{fill:#17212b}
			.config-arrow{fill:#456987}
		</style>
	</defs>
	<rect width="1600" height="900" fill="#fff"/>

	<!-- Title block -->
	<text x="160" y="282" class="series">Kubernetes Advanced: Service Mesh</text>
	<text x="160" y="326" class="chapter">Chapter 3</text>
	<text x="156" y="432" class="title">Ingress</text>
	<text x="156" y="522" class="title">Gateway</text>
	<path d="M160 568H280" stroke="#aab9c7" stroke-width="3"/>
	<text x="160" y="628" class="subtitle">Gateway and VirtualService</text>
	<text x="160" y="672" class="subtitle">open the door to the mesh</text>

	<!-- Mesh boundary: the gateway sits in its top edge -->
	<rect x="800" y="300" width="650" height="480" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="826" y="340" class="zone">MESH</text>

	<!-- Connectors: each has its own shaft and head -->
	<path d="M1125 184V225" class="flow"/>
	<path d="M1125 245L1115 225H1135Z" class="arrow"/>
	<path d="M1125 345V555" class="flow"/>
	<path d="M1125 575L1115 555H1135Z" class="arrow"/>
	<path d="M1010 420V375" class="config"/>
	<path d="M1010 355L1000 375H1020Z" class="config-arrow"/>
	<path d="M1240 420V375" class="config"/>
	<path d="M1240 355L1230 375H1250Z" class="config-arrow"/>

	<!-- Outside: the browser -->
	<rect x="1005" y="100" width="240" height="84" rx="14" class="node"/>
	<text x="1125" y="137" text-anchor="middle" class="node-title">browser</text>
	<text x="1125" y="167" text-anchor="middle" class="mono">bookstore.local</text>

	<!-- The door: ingress gateway -->
	<rect x="985" y="255" width="280" height="90" rx="14" class="primary"/>
	<text x="1125" y="294" text-anchor="middle" class="node-title">ingress gateway</text>
	<text x="1125" y="326" text-anchor="middle" class="mono">Envoy :8080</text>

	<!-- Configuration objects -->
	<rect x="840" y="420" width="220" height="100" rx="14" class="cfg"/>
	<text x="950" y="462" text-anchor="middle" class="card-title">Gateway</text>
	<text x="950" y="494" text-anchor="middle" class="detail">port and host</text>

	<rect x="1190" y="420" width="220" height="100" rx="14" class="cfg"/>
	<text x="1300" y="462" text-anchor="middle" class="card-title">VirtualService</text>
	<text x="1300" y="494" text-anchor="middle" class="detail">path routes</text>

	<text x="1141" y="560" class="mono">/productpage</text>

	<!-- Inside: productpage with its sidecar -->
	<rect x="1005" y="620" width="240" height="124" rx="14" class="node"/>
	<rect x="1045" y="585" width="160" height="62" rx="12" class="proxy"/>
	<text x="1125" y="624" text-anchor="middle" class="proxy-title">Envoy</text>
	<text x="1125" y="692" text-anchor="middle" class="card-title">productpage</text>
	<text x="1125" y="724" text-anchor="middle" class="detail">app :9080</text>
</svg>
