<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-label="Anatomy of an S3 object. The bucket my-app-uploads holds three objects with the keys uploads/2026/11/avatar-42.png, uploads/2026/11/avatar-43.png, and backups/db-2026-11-27.sql.gz. The shared part uploads/2026/11/ is a prefix, not a real folder; the console only shows prefixes as folders. Expanding the object avatar-42.png shows its three parts: the key that names it, the data, which is the bytes of the file and is read or replaced whole, and the metadata: Content-Type image/png, size, and custom tags.">
	<defs>
		<style>
			text{font-family:'Helvetica Neue', Arial, sans-serif;fill:#17212b}
