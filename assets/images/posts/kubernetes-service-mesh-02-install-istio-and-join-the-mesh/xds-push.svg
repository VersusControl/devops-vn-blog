	<rect x="448" y="464" width="62" height="22" rx="6" class="chip"/>
	<text x="479" y="479" text-anchor="middle" class="type">LDS</text>
	<rect x="518" y="464" width="62" height="22" rx="6" class="chip"/>
	<text x="549" y="479" text-anchor="middle" class="type">RDS</text>
	<rect x="588" y="464" width="62" height="22" rx="6" class="chip"/>
