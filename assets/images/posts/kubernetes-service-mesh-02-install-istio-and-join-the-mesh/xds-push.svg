	<rect x="658" y="280" width="62" height="22" rx="6" class="chip"/>
	<text x="689" y="295" text-anchor="middle" class="type">EDS</text>
	<rect x="140" y="318" width="592" height="38" rx="12" class="pod"/>
	<rect x="92" y="322" width="80" height="30" rx="10" class="proxy"/>
	<text x="132" y="342" text-anchor="middle" class="envoy">Envoy</text>
	<text x="188" y="342" class="name">reviews-v1</text>
	<rect x="448" y="326" width="62" height="22" rx="6" class="chip"/>
	<text x="479" y="341" text-anchor="middle" class="type">LDS</text>
	<rect x="518" y="326" width="62" height="22" rx="6" class="chip"/>
	<text x="549" y="341" text-anchor="middle" class="type">RDS</text>
	<rect x="588" y="326" width="62" height="22" rx="6" class="chip"/>
	<text x="619" y="341" text-anchor="middle" class="type">CDS</text>
	<rect x="658" y="326" width="62" height="22" rx="6" class="chip"/>
	<text x="689" y="341" text-anchor="middle" class="type">EDS</text>
	<rect x="140" y="364" width="592" height="38" rx="12" class="pod"/>
	<rect x="92" y="368" width="80" height="30" rx="10" class="proxy"/>
	<text x="132" y="388" text-anchor="middle" class="envoy">Envoy</text>
	<text x="188" y="388" class="name">reviews-v2</text>
	<rect x="448" y="372" width="62" height="22" rx="6" class="chip"/>
	<text x="479" y="387" text-anchor="middle" class="type">LDS</text>
	<rect x="518" y="372" width="62" height="22" rx="6" class="chip"/>
	<text x="549" y="387" text-anchor="middle" class="type">RDS</text>
	<rect x="588" y="372" width="62" height="22" rx="6" class="chip"/>
	<text x="619" y="387" text-anchor="middle" class="type">CDS</text>
	<rect x="658" y="372" width="62" height="22" rx="6" class="chip"/>
	<text x="689" y="387" text-anchor="middle" class="type">EDS</text>
	<rect x="140" y="410" width="592" height="38" rx="12" class="pod"/>
	<rect x="92" y="414" width="80" height="30" rx="10" class="proxy"/>
