	<rect x="658" y="464" width="62" height="22" rx="6" class="chip"/>
	<text x="689" y="479" text-anchor="middle" class="type">EDS</text>
	<rect x="140" y="536" width="592" height="38" rx="12" class="pod"/>
	<rect x="92" y="540" width="80" height="30" rx="10" class="proxy"/>
	<text x="132" y="560" text-anchor="middle" class="envoy">Envoy</text>
	<text x="188" y="560" class="name">istio-ingressgateway</text>
	<rect x="448" y="544" width="62" height="22" rx="6" class="chip"/>
