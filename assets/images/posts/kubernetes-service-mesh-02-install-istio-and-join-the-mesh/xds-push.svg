	<rect x="140" y="582" width="592" height="38" rx="12" class="pod"/>
	<rect x="92" y="586" width="80" height="30" rx="10" class="proxy"/>
	<text x="132" y="606" text-anchor="middle" class="envoy">Envoy</text>
	<text x="188" y="606" class="name">istio-egressgateway</text>
