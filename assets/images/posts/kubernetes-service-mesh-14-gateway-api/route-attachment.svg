<svg xmlns="http://www.w3.org/2000/svg" width="760" height="604" viewBox="0 0 760 604" role="img" aria-label="Route attachment across namespaces. In namespace partners, the partners team's HTTPRoute bookstore-api for host api.bookstore.local has parentRefs to bookstore-gw in namespace bookstore with sectionName api, and backendRefs to productpage in namespace bookstore on port 9080. In namespace bookstore, the platform team's Gateway bookstore-gw has a listener api for hostname api.bookstore.local whose allowedRoutes use a Selector on kubernetes.io/metadata.name: partners; this decides who may attach. The bookstore team's ReferenceGrant partners-to-bookstore, from HTTPRoute in partners to Service, permits the backendRef to the Service productpage; this decides who may point at their Services. Route status without the ReferenceGrant: ResolvedRefs=False with reason RefNotPermitted, and the gateway answers 500 NC. With the ReferenceGrant: ResolvedRefs=True and the gateway answers 200.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone-label{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.zone-name{font-family:Menlo,monospace;font-size:13px;font-weight:700;fill:#17212b}
			.panel-label{font-size:11px;font-weight:700;letter-spacing:1px;fill:#526579}
			.kind{font-size:12px;font-weight:700;fill:#526579}
			.owner{font-size:12px;fill:#526579}
			.inner-title{font-size:13px;font-weight:700;fill:#17212b}
			.who{font-size:12px;font-weight:700;fill:#456987}
			.detail{font-size:12px;fill:#526579}
			.link-label{font-size:12px;font-weight:700;fill:#456987}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.mono-b{font-family:Menlo,monospace;font-size:12px;font-weight:700;fill:#17212b}
			.mono-title{font-family:Menlo,monospace;font-size:15px;font-weight:700;fill:#17212b}
			.mono-link{font-family:Menlo,monospace;font-size:13px;font-weight:700;fill:#17212b}
			.zone{fill:#edf2f6;stroke:#aab9c7;stroke-width:2}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.panel{fill:#fff;stroke:#aab9c7;stroke-width:1.5}
			.divider{stroke:#d5dee6;stroke-width:1}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt}
			.arrow{fill:#17212b}
			.permit{fill:none;stroke:#456987;stroke-width:2.5;stroke-dasharray:6 4;stroke-linecap:butt}
			.permit-arrow{fill:#456987}
		</style>
	</defs>
	<rect width="760" height="604" fill="#fff"/>

	<!-- Zones: one per namespace -->
	<rect x="16" y="16" width="252" height="572" rx="14" class="zone"/>
	<text x="32" y="44"><tspan class="zone-label">NAMESPACE</tspan><tspan class="zone-name" dx="8">partners</tspan></text>
	<rect x="292" y="16" width="452" height="572" rx="14" class="zone"/>
	<text x="308" y="44"><tspan class="zone-label">NAMESPACE</tspan><tspan class="zone-name" dx="8">bookstore</tspan></text>

	<!-- Cross-namespace references: each has its own shaft and head -->
	<path d="M252 166H320" class="flow"/>
	<path d="M332 166L320 160V172Z" class="arrow"/>
	<path d="M252 300H320" class="flow"/>
	<path d="M332 300L320 294V306Z" class="arrow"/>

	<!-- ReferenceGrant permits the backendRef to the Service -->
	<path d="M430 404V358" class="permit"/>
	<path d="M430 346L424 358H436Z" class="permit-arrow"/>
	<text x="446" y="371" class="link-label">permits backendRefs</text>
	<text x="446" y="389" class="detail">from HTTPRoutes in partners</text>

	<!-- HTTPRoute in partners -->
	<rect x="32" y="64" width="220" height="312" rx="14" class="node"/>
	<text x="48" y="86" class="kind">HTTPRoute</text>
	<text x="236" y="86" text-anchor="end" class="owner">partners team</text>
	<text x="48" y="107" class="mono-title">bookstore-api</text>
	<text x="48" y="127"><tspan class="detail">host</tspan><tspan class="mono" dx="6">api.bookstore.local</tspan></text>
	<path d="M48 142H236" class="divider"/>
	<text x="48" y="170" class="mono-link">parentRefs</text>
	<text x="48" y="189" class="mono">name: bookstore-gw</text>
	<text x="48" y="208" class="mono">namespace: bookstore</text>
	<text x="48" y="227" class="mono">sectionName: api</text>
	<path d="M48 264H236" class="divider"/>
	<text x="48" y="304" class="mono-link">backendRefs</text>
	<text x="48" y="323" class="mono">name: productpage</text>
	<text x="48" y="342" class="mono">namespace: bookstore</text>
	<text x="48" y="361" class="mono">port: 9080</text>

	<!-- Route status -->
	<rect x="32" y="404" width="220" height="168" rx="12" class="panel"/>
	<text x="48" y="426" class="panel-label">NO REFERENCEGRANT</text>
	<text x="48" y="446" class="mono-b">ResolvedRefs=False</text>
	<text x="48" y="464" class="mono">RefNotPermitted</text>
	<text x="48" y="482"><tspan class="detail">gateway answers</tspan><tspan class="mono-b" dx="6">500 NC</tspan></text>
	<path d="M48 498H236" class="divider"/>
	<text x="48" y="518" class="panel-label">WITH REFERENCEGRANT</text>
	<text x="48" y="538" class="mono-b">ResolvedRefs=True</text>
	<text x="48" y="556"><tspan class="detail">gateway answers</tspan><tspan class="mono-b" dx="6">200</tspan></text>

	<!-- Gateway in bookstore, with the api listener -->
	<rect x="340" y="64" width="388" height="162" rx="14" class="node"/>
	<text x="356" y="86" class="kind">Gateway</text>
	<text x="712" y="86" text-anchor="end" class="owner">platform team</text>
	<text x="356" y="107" class="mono-title">bookstore-gw</text>
	<rect x="356" y="120" width="356" height="94" rx="12" class="primary"/>
	<text x="372" y="140"><tspan class="inner-title">listener</tspan><tspan class="mono-b" dx="6">api</tspan></text>
	<text x="696" y="140" text-anchor="end" class="who">who may attach</text>
	<text x="372" y="160" class="mono">hostname: api.bookstore.local</text>
	<text x="372" y="180" class="mono">allowedRoutes.namespaces.from: Selector</text>
	<text x="372" y="199" class="mono">kubernetes.io/metadata.name: partners</text>

	<!-- Service in bookstore -->
	<rect x="340" y="262" width="180" height="76" rx="14" class="node"/>
	<text x="356" y="284" class="kind">Service</text>
	<text x="356" y="305" class="mono-title">productpage</text>
	<text x="356" y="326" class="mono">port 9080</text>

	<!-- ReferenceGrant in bookstore -->
	<rect x="340" y="404" width="388" height="120" rx="14" class="primary"/>
	<text x="356" y="426" class="kind">ReferenceGrant</text>
	<text x="712" y="426" text-anchor="end" class="owner">bookstore team</text>
	<text x="356" y="447" class="mono-title">partners-to-bookstore</text>
	<text x="356" y="467" class="who">who may point at my Services</text>
	<text x="356" y="488" class="mono">from: HTTPRoute in partners</text>
	<text x="356" y="507" class="mono">to: Service</text>
</svg>
