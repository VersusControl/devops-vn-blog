<svg xmlns="http://www.w3.org/2000/svg" width="760" height="842" viewBox="0 0 760 842" role="img" aria-label="JWT at the ingress gateway for a request to admin.bookstore.local:8080/ratings/0. Step 1, RequestAuthentication bookstore-jwt with issuer https://auth.bookstore.local, verifies the token signature with the JWKS public key. A bad or forged token is rejected with 401, Jwt verification fails. A valid token becomes a request principal with claims: the admin token gives https://auth.bookstore.local/alice with role admin, the viewer token gives https://auth.bookstore.local/bob with role viewer. A request with no token passes on with no principal. Step 2, the DENY policy admin-requires-jwt for host admin.bookstore.local on port 8080: rule 0 denies a request with no request principal with 403, rule 1 denies a role claim other than admin, such as bob's viewer token, with 403. Both rules match only the admin host on port 8080, so bookstore.local is unaffected. Step 3, the admin token reaches ratings in bookstore, whose ALLOW policy lets the gateway's service account, istio-ingressgateway-service-account, use GET and POST on /ratings/*.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.row-title{font-size:13px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.note{font-size:13px;fill:#526579}
			.label{font-size:12px;font-style:italic;fill:#526579}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.mono-t{font-family:Menlo,monospace;font-size:13px;font-weight:700;fill:#17212b}
			.num{font-size:13px;font-weight:700;fill:#17212b}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.chip{fill:#d8e7f2;stroke:#456987;stroke-width:1.5}
			.chip-light{fill:#fff;stroke:#456987;stroke-width:1.5}
			.card{fill:#f5f7f9;stroke:#aab9c7;stroke-width:1.5}
			.divider{stroke:#aab9c7;stroke-width:1.5}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt;stroke-linejoin:round}
			.arrow{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="842" fill="#fff"/>

	<!-- Zones -->
	<rect x="16" y="112" width="728" height="578" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="32" y="134" class="zone">INGRESS GATEWAY</text>
	<rect x="16" y="706" width="728" height="120" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="32" y="728" class="zone">BOOKSTORE</text>

	<!-- Connectors: every step and branch has its own shaft and head -->
	<!-- request to RequestAuthentication -->
	<path d="M224 90V136" class="flow"/>
	<path d="M224 148L218 136H230Z" class="arrow"/>
	<!-- bad token to 401 -->
	<path d="M416 195H506" class="flow"/>
	<path d="M518 195L506 189V201Z" class="arrow"/>
	<!-- valid or no token to the principal card -->
	<path d="M224 234V270" class="flow"/>
	<path d="M224 282L218 270H230Z" class="arrow"/>
	<!-- principal card to the DENY policy -->
	<path d="M224 440V476" class="flow"/>
	<path d="M224 488L218 476H230Z" class="arrow"/>
	<!-- rule 0 match to 403 -->
	<path d="M416 586H506" class="flow"/>
	<path d="M518 586L506 580V592Z" class="arrow"/>
	<!-- rule 1 match to 403 -->
	<path d="M416 642H506" class="flow"/>
	<path d="M518 642L506 636V648Z" class="arrow"/>
	<!-- admin token to ratings -->
	<path d="M224 670V734" class="flow"/>
	<path d="M224 746L218 734H230Z" class="arrow"/>

	<!-- Connector labels -->
	<text x="467" y="186" text-anchor="middle" class="label">bad token</text>
	<text x="236" y="262" class="label">valid token, or no token</text>
	<text x="467" y="577" text-anchor="middle" class="label">match</text>
	<text x="467" y="633" text-anchor="middle" class="label">match</text>
	<text x="236" y="732" class="label">admin token, no rule matched</text>

	<!-- Request -->
	<rect x="32" y="16" width="384" height="74" rx="12" class="node"/>
	<text x="48" y="40" class="title">admin API request</text>
	<text x="48" y="60" class="mono">admin.bookstore.local:8080/ratings/0</text>
	<text x="48" y="78" class="mono">Authorization: Bearer &lt;JWT&gt;</text>

	<!-- 1 RequestAuthentication -->
	<rect x="32" y="156" width="384" height="78" rx="12" class="node"/>
	<rect x="48" y="166" width="24" height="24" rx="6" class="chip"/>
	<text x="60" y="183" text-anchor="middle" class="num">1</text>
	<text x="84" y="183" class="title">RequestAuthentication</text>
	<text x="84" y="204" class="mono">issuer: https://auth.bookstore.local</text>
	<text x="84" y="222" class="detail">checks the signature with the JWKS public key</text>

	<rect x="528" y="156" width="200" height="78" rx="12" class="node"/>
	<text x="544" y="181" class="title">401 rejected</text>
	<text x="544" y="201" class="mono">Jwt verification fails</text>
	<text x="544" y="220" class="detail">forged or expired token</text>

	<!-- What the gateway knows after step 1 -->
	<rect x="32" y="290" width="384" height="150" rx="12" class="primary"/>
	<text x="48" y="312" class="zone">REQUEST PRINCIPAL AND CLAIMS</text>
	<text x="48" y="336" class="row-title">admin token</text>
	<text x="144" y="336" class="mono">https://auth.bookstore.local/alice</text>
	<text x="144" y="354" class="mono">role: admin</text>
	<text x="48" y="380" class="row-title">viewer token</text>
	<text x="144" y="380" class="mono">https://auth.bookstore.local/bob</text>
	<text x="144" y="398" class="mono">role: viewer</text>
	<text x="48" y="424" class="row-title">no token</text>
	<text x="144" y="424" class="detail">no principal, passes on</text>

	<!-- Scope note -->
	<rect x="528" y="290" width="200" height="132" rx="12" class="card"/>
	<text x="544" y="312" class="zone">SCOPE</text>
	<text x="544" y="334" class="note">both rules match only</text>
	<text x="544" y="352" class="mono">admin.bookstore.local</text>
	<text x="544" y="370" class="note">on port 8080, so</text>
	<text x="544" y="390" class="mono">bookstore.local</text>
	<text x="544" y="408" class="note">is unaffected</text>

	<!-- 2 DENY admin-requires-jwt -->
	<rect x="32" y="496" width="384" height="174" rx="12" class="node"/>
	<rect x="48" y="508" width="24" height="24" rx="6" class="chip"/>
	<text x="60" y="525" text-anchor="middle" class="num">2</text>
	<text x="84" y="525" class="title">DENY policy</text>
	<text x="180" y="525" class="mono-t">admin-requires-jwt</text>
	<text x="84" y="545" class="detail">host admin.bookstore.local, port 8080</text>
	<path d="M48 558H400" class="divider"/>
	<text x="48" y="590" class="row-title">rule 0</text>
	<text x="104" y="590" class="detail">no request principal</text>
	<path d="M48 614H400" class="divider"/>
	<text x="48" y="646" class="row-title">rule 1</text>
	<text x="104" y="646" class="detail">role claim is not admin</text>

	<rect x="528" y="563" width="200" height="46" rx="12" class="node"/>
	<text x="544" y="582" class="title">403 denied</text>
	<text x="544" y="600" class="detail">no token</text>

	<rect x="528" y="619" width="200" height="46" rx="12" class="node"/>
	<text x="544" y="638" class="title">403 denied</text>
	<text x="544" y="656" class="detail">viewer token (bob)</text>

	<!-- 3 ratings -->
	<rect x="32" y="754" width="696" height="56" rx="12" class="node"/>
	<rect x="48" y="770" width="24" height="24" rx="6" class="chip"/>
	<text x="60" y="787" text-anchor="middle" class="num">3</text>
	<text x="84" y="778" class="title">ratings</text>
	<text x="84" y="796" class="detail">ALLOW policy</text>
	<path d="M216 766V798" class="divider"/>
	<text x="232" y="778" class="mono">from:</text>
	<text x="282" y="778" class="mono">.../sa/istio-ingressgateway-service-account</text>
	<text x="232" y="796" class="mono">to:</text>
	<text x="282" y="796" class="mono">GET, POST on /ratings/*</text>
</svg>
