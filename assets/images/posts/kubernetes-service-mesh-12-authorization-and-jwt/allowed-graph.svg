<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-label="The Book Store call graph after default deny, with only the allowed edges. The ingress gateway, identity cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account, may call productpage with any method. productpage, identity sa/bookstore-productpage, may call details with GET and the reviews Service with GET, which reaches reviews-v1, v2, or v3. reviews-v2 and reviews-v3, identity sa/bookstore-reviews, may call ratings with GET. Two edges are denied with 403: details, identity sa/bookstore-details, calling reviews, and the tester Pod, identity sa/default, calling ratings.">
	<defs>
		<style>
			text{font-family:Arial,sans-serif;fill:#17212b}
			.zone{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#526579}
			.title{font-size:15px;font-weight:700}
			.gw-title{font-size:14px;font-weight:700}
			.pod-title{font-size:14px;font-weight:700}
			.detail{font-size:12px;fill:#526579}
			.method{font-size:12px;font-weight:700;fill:#263746}
			.blocked{font-size:12px;font-weight:700;fill:#526579}
			.legend{font-size:12px;fill:#526579}
			.caller{font-size:13px;font-weight:700}
			.caller-off{font-size:13px;font-weight:700;fill:#6b7d8f}
			.mono{font-family:Menlo,monospace;font-size:12px;fill:#263746}
			.mono-off{font-family:Menlo,monospace;font-size:12px;fill:#6b7d8f}
			.node{fill:#fff;stroke:#283541;stroke-width:2}
			.primary{fill:#d8e7f2;stroke:#456987;stroke-width:2}
			.card{fill:#f5f7f9;stroke:#aab9c7;stroke-width:1.5}
			.divider{stroke:#aab9c7;stroke-width:1.5}
			.flow{fill:none;stroke:#17212b;stroke-width:2.5;stroke-linecap:butt;stroke-linejoin:round}
			.denied{fill:none;stroke:#6b7d8f;stroke-width:2.5;stroke-dasharray:6 4;stroke-linecap:butt}
			.arrow{fill:#17212b}
			.stop{fill:#17212b}
		</style>
	</defs>
	<rect width="760" height="700" fill="#fff"/>
	<g transform="translate(0 -20)">

	<!-- Zone: the reviews Service and its three Pods -->
	<rect x="212" y="196" width="406" height="232" rx="14" fill="#edf2f6" stroke="#aab9c7" stroke-width="2"/>
	<text x="228" y="217" class="zone">REVIEWS</text>

	<!-- Allowed connectors: each destination has its own shaft and head -->
	<!-- ingress gateway to productpage, any method -->
	<path d="M156 90H226" class="flow"/>
	<path d="M238 90L226 84V96Z" class="arrow"/>
	<!-- productpage to details, GET -->
	<path d="M394 90H464" class="flow"/>
	<path d="M476 90L464 84V96Z" class="arrow"/>
	<!-- productpage to the reviews Service, GET -->
	<path d="M319 134V261" class="flow"/>
	<path d="M319 273L313 261H325Z" class="arrow"/>
	<!-- reviews Service to each Pod -->
	<path d="M394 321H434V255H462" class="flow"/>
	<path d="M474 255L462 249V261Z" class="arrow"/>
	<path d="M394 321H462" class="flow"/>
	<path d="M474 321L462 315V327Z" class="arrow"/>
	<path d="M394 321H434V387H462" class="flow"/>
	<path d="M474 387L462 381V393Z" class="arrow"/>
	<!-- reviews-v2 and v3 to ratings, GET -->
	<path d="M602 321H644" class="flow"/>
	<path d="M656 321L644 315V327Z" class="arrow"/>
	<path d="M602 387H644" class="flow"/>
	<path d="M656 387L644 381V393Z" class="arrow"/>

	<!-- Denied connectors: stopped before the destination -->
	<!-- details to reviews -->
	<path d="M542 120V182" class="denied"/>
	<rect x="528" y="182" width="28" height="5" rx="1.5" class="stop"/>
	<text x="556" y="157" class="blocked">403</text>
	<!-- tester to ratings -->
	<path d="M704 484V425" class="denied"/>
	<rect x="690" y="420" width="28" height="5" rx="1.5" class="stop"/>
	<text x="716" y="458" class="blocked">403</text>

	<!-- Connector labels -->
	<text x="197" y="80" text-anchor="middle" class="method">any</text>
	<text x="435" y="80" text-anchor="middle" class="method">GET</text>
	<text x="331" y="170" class="method">GET</text>
	<text x="641" y="312" text-anchor="middle" class="method">GET</text>
	<text x="641" y="378" text-anchor="middle" class="method">GET</text>

	<!-- Nodes -->
	<rect x="16" y="60" width="140" height="60" rx="12" class="node"/>
	<text x="86" y="86" text-anchor="middle" class="gw-title">ingress gateway</text>
	<text x="86" y="105" text-anchor="middle" class="detail">istio-system</text>

	<rect x="244" y="46" width="150" height="88" rx="12" class="node"/>
	<text x="319" y="86" text-anchor="middle" class="title">productpage</text>
	<text x="319" y="105" text-anchor="middle" class="detail">Python</text>

	<rect x="482" y="60" width="120" height="60" rx="12" class="node"/>
	<text x="542" y="86" text-anchor="middle" class="title">details</text>
	<text x="542" y="105" text-anchor="middle" class="detail">Ruby</text>

	<rect x="244" y="281" width="150" height="80" rx="12" class="primary"/>
	<text x="319" y="316" text-anchor="middle" class="title">reviews</text>
	<text x="319" y="336" text-anchor="middle" class="detail">Service</text>

	<rect x="482" y="230" width="120" height="50" rx="12" class="node"/>
	<text x="542" y="251" text-anchor="middle" class="pod-title">reviews-v1</text>
	<text x="542" y="269" text-anchor="middle" class="detail">Java</text>

	<rect x="482" y="296" width="120" height="50" rx="12" class="node"/>
	<text x="542" y="317" text-anchor="middle" class="pod-title">reviews-v2</text>
	<text x="542" y="335" text-anchor="middle" class="detail">Java</text>

	<rect x="482" y="362" width="120" height="50" rx="12" class="node"/>
	<text x="542" y="383" text-anchor="middle" class="pod-title">reviews-v3</text>
	<text x="542" y="401" text-anchor="middle" class="detail">Java</text>

	<rect x="664" y="296" width="80" height="116" rx="12" class="node"/>
	<text x="704" y="350" text-anchor="middle" class="title">ratings</text>
	<text x="704" y="370" text-anchor="middle" class="detail">Node.js</text>

	<rect x="664" y="484" width="80" height="50" rx="12" class="node"/>
	<text x="704" y="505" text-anchor="middle" class="pod-title">tester</text>
	<text x="704" y="523" text-anchor="middle" class="detail">Pod</text>

	<!-- Legend -->
	<path d="M16 474H40" class="flow"/>
	<path d="M52 474L40 468V480Z" class="arrow"/>
	<text x="62" y="478" class="legend">allowed by an ALLOW policy</text>
	<path d="M262 474H292" class="denied"/>
	<rect x="292" y="467" width="5" height="14" rx="1.5" class="stop"/>
	<text x="308" y="478" class="legend">denied, 403: no rule allows it</text>

	<!-- Caller identities -->
	<rect x="16" y="556" width="728" height="148" rx="12" class="card"/>
	<text x="32" y="578" class="zone">CALLER</text>
	<text x="168" y="578" class="zone">PRINCIPAL FROM ITS mTLS CERTIFICATE</text>
	<path d="M32 588H728" class="divider"/>
	<text x="32" y="608" class="caller">ingress gateway</text>
	<text x="168" y="608" class="mono">cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account</text>
	<text x="32" y="628" class="caller">productpage</text>
	<text x="168" y="628" class="mono">cluster.local/ns/bookstore/sa/bookstore-productpage</text>
	<text x="32" y="648" class="caller">reviews</text>
	<text x="168" y="648" class="mono">cluster.local/ns/bookstore/sa/bookstore-reviews</text>
	<text x="32" y="668" class="caller-off">details</text>
	<text x="168" y="668" class="mono-off">cluster.local/ns/bookstore/sa/bookstore-details</text>
	<text x="32" y="688" class="caller-off">tester</text>
	<text x="168" y="688" class="mono-off">cluster.local/ns/bookstore/sa/default</text>
	<text x="728" y="668" text-anchor="end" class="legend">on no caller list</text>
	<text x="728" y="688" text-anchor="end" class="legend">on no caller list</text>
	</g>
</svg>
