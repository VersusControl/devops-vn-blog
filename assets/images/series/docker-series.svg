<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1600" height="760" fill="#0d1117"/>
  <circle cx="1380" cy="200" r="320" fill="#2496ED" opacity="0.12"/>
  <circle cx="1440" cy="580" r="200" fill="#1D63ED" opacity="0.10"/>
  <!-- Docker containers/whale representation -->
  <g transform="translate(1260,280)" fill="none" stroke="#2496ED" stroke-opacity="0.5" stroke-width="6">
    <!-- Container stack -->
    <rect x="0" y="80" width="70" height="50" rx="6"/>
    <rect x="80" y="80" width="70" height="50" rx="6"/>
    <rect x="160" y="80" width="70" height="50" rx="6"/>
    <rect x="0" y="20" width="70" height="50" rx="6"/>
    <rect x="80" y="20" width="70" height="50" rx="6"/>
    <rect x="160" y="20" width="70" height="50" rx="6"/>
    <rect x="40" y="-40" width="70" height="50" rx="6"/>
    <rect x="120" y="-40" width="70" height="50" rx="6"/>
    <!-- Whale tail hint -->
    <path d="M-30,100 Q-60,60 -40,20" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Solid container icon -->
  <g transform="translate(1300,340)" fill="#2496ED" fill-opacity="0.25">
    <rect x="0" y="60" width="50" height="36" rx="4"/>
    <rect x="58" y="60" width="50" height="36" rx="4"/>
    <rect x="116" y="60" width="50" height="36" rx="4"/>
    <rect x="0" y="16" width="50" height="36" rx="4"/>
    <rect x="58" y="16" width="50" height="36" rx="4"/>
    <rect x="116" y="16" width="50" height="36" rx="4"/>
    <rect x="29" y="-28" width="50" height="36" rx="4"/>
    <rect x="87" y="-28" width="50" height="36" rx="4"/>
  </g>
  <rect x="120" y="150" width="54" height="6" rx="3" fill="#2496ED"/>
  <text x="192" y="163" font-size="26" fill="#2496ED" font-weight="700" letter-spacing="4">DEVOPS VN · CONTAINERS</text>
  <text x="118" y="430" font-size="112" fill="#ffffff" font-weight="800">Docker</text>
  <text x="120" y="510" font-size="68" fill="#9aa4b2" font-weight="700">Basics</text>
  <text x="120" y="606" font-size="30" fill="#9aa4b2" font-weight="500">Containerize anything — from zero to production</text>
  <text x="120" y="652" font-size="24" fill="#5b6472" font-weight="600" letter-spacing="1">devopsvn.tech</text>
