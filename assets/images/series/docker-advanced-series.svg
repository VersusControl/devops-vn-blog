  <text x="100" y="486" class="title">Advanced</text>
  <text x="100" y="570" class="subtitle">Build, secure, ship, and operate</text>
  <text x="100" y="608" class="subtitle">production container workloads.</text>
  <text x="100" y="820" class="footer">devopsvn.tech</text>

  <g transform="translate(875 82)">
