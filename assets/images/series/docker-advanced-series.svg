      .title { font-family: Arial, sans-serif; font-size: 76px; font-weight: 800; fill: #f7f9fb; }
      .subtitle { font-family: Arial, sans-serif; font-size: 28px; fill: #aebdcd; }
      .zone { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #78bdf1; }
      .chapter { font-family: Menlo, monospace; font-size: 12px; fill: #78bdf1; }
      .topic { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #dce8f5; }
      .detail { font-family: Arial, sans-serif; font-size: 13px; fill: #aebdcd; }
      .footer { font-family: Menlo, monospace; font-size: 17px; fill: #71849a; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#0d1117"/>
  <path d="M790 0V900" stroke="#263545" stroke-width="2"/>

