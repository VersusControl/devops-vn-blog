<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Docker Advanced series cover with eight individual chapter cards covering BuildKit, small images, runtime security, multi-platform images, registry digests, production Compose, debugging, and Kubernetes delivery.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5 0 10z" fill="#2496ed"/>
